syntax = "proto3";

option go_package = "chainguard.dev/sdk/proto/platform/argos/v1";

package chainguard.platform.argos;

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "annotations/auth.proto";

// ArgosOSV is the customer-facing OSV-spec query surface for the Private OSV
// shared corpus. All members holding CAP_ARGOS_OSV_READ see the same record
// set; there is no per-organisation filtering. Records are customer-blind.
service ArgosOSV {
  rpc Query(OSVQueryRequest) returns (OSVQueryResponse) {
    option (google.api.http) = {
      post: "/argos/v1/osv/query"
      body: "*"
    };
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_ARGOS_OSV_READ]
        unscoped: true
      }
    };
  }
  rpc QueryBatch(OSVQueryBatchRequest) returns (OSVQueryBatchResponse) {
    option (google.api.http) = {
      post: "/argos/v1/osv/querybatch"
      body: "*"
    };
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_ARGOS_OSV_READ]
        unscoped: true
      }
    };
  }
  rpc GetVuln(GetOSVRequest) returns (OSVRecord) {
    option (google.api.http) = {
      get: "/argos/v1/osv/vulns/{id=**}"
    };
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_ARGOS_OSV_READ]
        unscoped: true
      }
    };
  }
  rpc Dump(DumpOSVRequest) returns (stream DumpOSVResponse) {
    option (google.api.http) = {
      get: "/argos/v1/osv/dump"
    };
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_ARGOS_OSV_DUMP]
        unscoped: true
      }
    };
  }
}

message Package {
  string ecosystem = 1;
  string name = 2;
  string purl = 3;
}

message Event {
  oneof event {
    string introduced = 1;
    string fixed = 2;
    string last_affected = 3 [json_name = "last_affected"];
    string limit = 4;
  }
}

message Range {
  // RangeType mirrors the OSV spec's `type` enum. Value names are
  // deliberately unprefixed so the protojson wire form matches OSV verbatim
  // (the spec uses bare "SEMVER" / "ECOSYSTEM" / "GIT"); nested-enum scoping
  // means Go consumers see Range_SEMVER, Range_ECOSYSTEM, Range_GIT.
  enum RangeType {
    UNSPECIFIED = 0;
    SEMVER = 1;
    ECOSYSTEM = 2;
    GIT = 3;
  }
  RangeType type = 1;
  string repo = 2;
  repeated Event events = 3;
}

message Affected {
  Package package = 1;
  repeated Range ranges = 2;
  repeated string versions = 3;
  // ecosystem_specific is the OSV-spec free-form ecosystem-owned extension
  // object. Currently never populated.
  google.protobuf.Struct ecosystem_specific = 4 [json_name = "ecosystem_specific"];
  // database_specific is the Chainguard atomic-vulnerability extension; see
  // DatabaseSpecific.
  DatabaseSpecific database_specific = 5 [json_name = "database_specific"];
}

// DatabaseSpecific is the Chainguard database-owned extension on an Affected
// entry: the atomic-vulnerability classification and sink location for the
// record. Field names are pinned to OSV-spec snake_case via json_name.
message DatabaseSpecific {
  // cwe_ids is the ordered list of CWE classifications; the lead (most
  // specific) CWE is cwe_ids[0].
  repeated string cwe_ids = 1 [json_name = "cwe_ids"];

  // sink_locator lists every confirmed sink of the defect within the
  // upstream package's own source. Empty for non-flow defects. The list is
  // unordered and no entry is privileged; the same sink identity (class +
  // method) may appear more than once with different file_line values when
  // the code moved between releases — each entry is a dated observation (see
  // observed_versions), not an affected-range claim. Version applicability
  // lives in the OSV `ranges` on the Affected entry.
  repeated SinkLocator sink_locator = 2 [json_name = "sink_locator"];

  // defect_kind is the coarse defect class: "missing-control",
  // "incorrect-control", or "configuration-default".
  string defect_kind = 3 [json_name = "defect_kind"];

  // chainguard carries the Chainguard-artifact claims that are deliberately
  // kept out of the OSV ranges: the exact published Chainguard rebuilds that
  // contain a fix for this vulnerability. The `ranges` on the Affected entry
  // stay authoritative for public upstream releases only; a Chainguard
  // artifact inherits the vulnerability status of the upstream version it was
  // built from unless it is named here.
  ChainguardExtension chainguard = 4 [json_name = "chainguard"];
}

// ChainguardExtension is the Chainguard-artifact section of an Affected
// entry's database_specific: artifacts distributed through Chainguard
// Libraries whose vulnerability status has diverged from the upstream version
// they were built from.
message ChainguardExtension {
  // fixed_artifacts lists the exact published Chainguard rebuilds that
  // contain a fix for this vulnerability, ordered by purl.
  repeated FixedArtifact fixed_artifacts = 1 [json_name = "fixed_artifacts"];
}

// FixedArtifact names one published Chainguard rebuild containing a fix.
message FixedArtifact {
  // purl is the exact versioned package URL of the published rebuild, e.g.
  // "pkg:maven/io.netty/netty-codec-dns@1.4.2-0.cgp.1".
  string purl = 1;

  // upstream_version is the public upstream version the rebuild was built
  // from, e.g. "1.4.2" — the version whose vulnerability status the artifact
  // would inherit had Chainguard not applied the fix. Empty when the
  // published version does not carry a recognized rebuild suffix.
  string upstream_version = 2 [json_name = "upstream_version"];
}

// SinkLocator locates one confirmed sink of a defect within the upstream
// package source. A DatabaseSpecific carries a repeated, unordered list of
// these; each entry is a dated observation of the sink at the versions in
// observed_versions.
message SinkLocator {
  // class is the fully-qualified class/type of the sink (or module path for
  // non-OO languages).
  string class = 1;

  // method is the symbolic method/function at the sink.
  string method = 2;

  // arg_signature is the sink's argument signature, when known.
  string arg_signature = 3 [json_name = "arg_signature"];

  // file_line is the sink's source location, e.g. "src/.../X.java:NNN".
  string file_line = 4 [json_name = "file_line"];

  // observed_versions lists the package versions at which this exact
  // location (class + method + file_line) was confirmed by analysis. It is
  // an observation record, not an affected-range claim — version
  // applicability lives in the OSV `ranges` on the Affected entry. Empty on
  // records that predate the field.
  repeated string observed_versions = 5 [json_name = "observed_versions"];
}

message Severity {
  string type = 1;
  string score = 2;
}

// PatchStatus is the patch-generation state of a CGP record. Values are
// identical to the internal PatchStatus enum; UNSPECIFIED means the record
// predates patch-status tracking or its status has not yet been evaluated.
enum PatchStatus {
  PATCH_STATUS_UNSPECIFIED = 0;
  PATCH_STATUS_NOT_PATCHED = 1;
  PATCH_STATUS_IN_PROGRESS = 2;
  PATCH_STATUS_FAILED = 3;
  PATCH_STATUS_PATCHED = 4;
}

// EmbargoStatus is the state of the embargo period on a record.
//
// Values may be added over time. Treat an unrecognised value as
// EMBARGO_STATUS_UNSPECIFIED rather than assuming this set is closed.
enum EmbargoStatus {
  EMBARGO_STATUS_UNSPECIFIED = 0;
  EMBARGO_STATUS_DEFAULT = 1;
  EMBARGO_STATUS_EXTENSION_APPROVED = 2;
  EMBARGO_STATUS_EXTENSION_DENIED = 3;
  EMBARGO_STATUS_EXPIRED = 4;
  EMBARGO_STATUS_VOIDED = 5;
}

// ExtensionReason is the rationale recorded with an embargo extension
// decision, drawn from a fixed set of values rather than free text. Values may
// be added over time; treat an unrecognised value as
// EXTENSION_REASON_UNSPECIFIED.
enum ExtensionReason {
  EXTENSION_REASON_UNSPECIFIED = 0;
  EXTENSION_REASON_UPSTREAM_ENGAGED = 1;
  EXTENSION_REASON_PATCH_IN_REVIEW = 2;
  EXTENSION_REASON_CONTRACTUAL_CAP_REACHED = 3;
}

// Embargo is the embargo period on a record: when the validation window
// opened, when it closes, and what state it is in.
//
// The window is identical for every recipient of the record: no field here
// varies by caller.
message Embargo {
  // status is the state of the period.
  EmbargoStatus status = 1 [json_name = "status"];

  // started_at is when the validation window opened.
  google.protobuf.Timestamp started_at = 2 [json_name = "started_at"];

  // ends_at is when the window currently closes. This is the date to act on;
  // it moves only by a reviewed extension decision.
  google.protobuf.Timestamp ends_at = 3 [json_name = "ends_at"];

  // extension is the current extension decision, absent while the period is
  // in its default state. It is identical for every recipient of the record.
  Extension extension = 4 [json_name = "extension"];

  // Extension is a reviewed decision on an extension request.
  message Extension {
    // requested_at is when the extension was requested.
    google.protobuf.Timestamp requested_at = 1 [json_name = "requested_at"];

    // decided_at is when it was approved or denied. A denial is recorded
    // without moving ends_at.
    google.protobuf.Timestamp decided_at = 2 [json_name = "decided_at"];

    // reason is the rationale, from the closed ExtensionReason set.
    ExtensionReason reason = 3 [json_name = "reason"];
  }
}

// TopLevelDatabaseSpecific is the Chainguard-defined content for the OSV-spec
// top-level database_specific field: a JSON object holding additional
// information about the vulnerability as defined by the database from which
// the record was obtained. Unlike the per-Affected DatabaseSpecific, this
// applies to the whole vulnerability record.
message TopLevelDatabaseSpecific {
  // patch_status is the patch-generation state of this record.
  PatchStatus patch_status = 1 [json_name = "patch_status"];

  // embargo is the embargo period on this record, absent when no period has
  // been established.
  Embargo embargo = 2 [json_name = "embargo"];
}

// Reference is one OSV-spec references[] entry: a typed, record-level URL
// (https://ossf.github.io/osv-schema/#references-field). Chainguard emits
// FIX-typed references naming the verified upstream fix commit — the exact
// commit, validated by tag ancestry in the named repository, behind the
// record's highest fixed boundary. A reference is record-level and carries
// no binding to any affected range or version, per the OSV spec.
message Reference {
  // ReferenceType mirrors the OSV spec's reference type vocabulary. Value
  // names are deliberately unprefixed so the JSON wire form matches OSV
  // verbatim (the spec uses bare "FIX" / "WEB" / ...); nested-enum scoping
  // means Go consumers see Reference_FIX, Reference_WEB, etc.
  enum ReferenceType {
    UNSPECIFIED = 0;
    ADVISORY = 1;
    ARTICLE = 2;
    DETECTION = 3;
    DISCUSSION = 4;
    REPORT = 5;
    FIX = 6;
    INTRODUCED = 7;
    PACKAGE = 8;
    EVIDENCE = 9;
    WEB = 10;
  }

  // type is the reference type.
  ReferenceType type = 1;

  // url is the fully-qualified URL, scheme included.
  string url = 2;
}

message OSVRecord {
  string id = 1;
  string schema_version = 2 [json_name = "schema_version"];
  string summary = 3;
  string details = 4;
  repeated string aliases = 5;
  repeated Severity severity = 6;
  repeated Affected affected = 7;
  google.protobuf.Timestamp published = 8;
  google.protobuf.Timestamp modified = 9;
  repeated string related = 10;
  // withdrawn is the time the entry should be considered withdrawn, per OSV
  // spec. Unset means the record has not been withdrawn.
  google.protobuf.Timestamp withdrawn = 11;
  // database_specific is the OSV-spec top-level extension object carrying
  // Chainguard-defined record-level metadata (OSV spec §database_specific-field).
  TopLevelDatabaseSpecific database_specific = 12 [json_name = "database_specific"];
  // references lists the record's OSV-spec typed reference URLs. Chainguard
  // populates FIX-typed entries with the verified upstream fix commit; see
  // Reference.
  repeated Reference references = 13;
}

message OSVQueryRequest {
  Package package = 1;
  string version = 2;
  // page_token is the opaque cursor from a previous response's next_page_token.
  // Empty starts at the first page. (OSV spec: query supports page_token.)
  string page_token = 3 [json_name = "page_token"];
}

message OSVQueryResponse {
  repeated OSVRecord vulns = 1;
  // next_page_token is the cursor for the next page; empty when last page.
  string next_page_token = 2 [json_name = "next_page_token"];
}

// MinimalOSVRecord is the abbreviated vuln entry returned by QueryBatch,
// matching the OSV spec's batch response (id + modified only); callers
// follow up with GetVuln for full detail.
message MinimalOSVRecord {
  string id = 1;
  google.protobuf.Timestamp modified = 2;
}

message OSVQueryBatchRequest {
  repeated OSVQueryRequest queries = 1;
}

message OSVQueryBatchResult {
  repeated MinimalOSVRecord vulns = 1;
  // next_page_token paginates this query's results (OSV batch spec).
  string next_page_token = 2 [json_name = "next_page_token"];
}

message OSVQueryBatchResponse {
  repeated OSVQueryBatchResult results = 1;
}

message GetOSVRequest {
  string id = 1;
}

message DumpOSVRequest {}

// DumpOSVMetadata is the first message in a Dump stream, carrying archive
// provenance. Subsequent messages carry raw tar.gz chunks via DumpOSVResponse.
message DumpOSVMetadata {
  google.protobuf.Timestamp generated_at = 1 [json_name = "generated_at"];
  int64 size_bytes = 2 [json_name = "size_bytes"];
  string sha256 = 3;
}

// DumpOSVResponse is either the leading metadata frame or a raw archive chunk.
message DumpOSVResponse {
  oneof content {
    DumpOSVMetadata metadata = 1;
    bytes chunk = 2;
  }
}
