syntax = "proto3";

package chainguard.platform.argos;

import "annotations/auth.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "chainguard.dev/sdk/proto/platform/argos/v1";

// ArgosPartners lets a mitigation partner declare the mitigation methods it
// can apply and the packages it is interested in. Requested capabilities
// await Chainguard review before they widen what the partner can see;
// interests need no review. See
// docs/argos/mitigation-partner-api-capability-mapping.md.
service ArgosPartners {
  // GetCapabilities returns the partner's capabilities by review state and
  // its interests.
  rpc GetCapabilities(GetPartnerCapabilitiesRequest) returns (
      PartnerCapabilities
  ) {
    option (google.api.http) = {
      get: "/argos/v1/partners/{partner_id}/capabilities"
    };
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_ARGOS_MITIGATION_PARTNER]
      }
    };
  }

  // UpdateCapabilities overwrites the partner's requested capabilities and
  // interests. A requested capability keeps an approved state, moves
  // rejected back to pending, and is otherwise pending; one not requested is
  // removed without approval (but audited). Interests are replaced outright.
  rpc UpdateCapabilities(UpdatePartnerCapabilitiesRequest) returns (
      UpdatePartnerCapabilitiesResponse
  ) {
    option (google.api.http) = {
      put: "/argos/v1/partners/{partner_id}/capabilities"
      body: "*"
    };
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [
          CAP_ARGOS_MITIGATION_PARTNER,
          CAP_ARGOS_PARTNER_CAPABILITY_REQUEST
        ]
      }
    };
  }

  // DeleteCapabilities removes the named capabilities and interests from the
  // partner, ignoring names it does not hold, and returns what remains. No
  // approval is required.
  rpc DeleteCapabilities(DeletePartnerCapabilitiesRequest) returns (
      PartnerCapabilities
  ) {
    option (google.api.http) = {
      delete: "/argos/v1/partners/{partner_id}/capabilities"
      body: "*"
    };
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [
          CAP_ARGOS_MITIGATION_PARTNER,
          CAP_ARGOS_PARTNER_CAPABILITY_REQUEST
        ]
      }
    };
  }

  // ListMitigationMethods returns the live mitigation-method catalogue, keyed
  // by display name. There is no per-organisation filtering: every method a
  // partner could request is visible so they can build a capabilities.md.
  rpc ListMitigationMethods(ListMitigationMethodsRequest) returns (
      ListMitigationMethodsResponse
  ) {
    option (google.api.http) = {
      get: "/argos/v1/mitigation-methods"
    };
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_ARGOS_PARTNER_CAPABILITY_REQUEST]
        unscoped: true
      }
    };
  }

  // CreateMitigation reports how the partner handled a vulnerability. The
  // partner must hold an approved capability for method, and method must map
  // to one of the vulnerability's CWEs. A vulnerability the partner cannot
  // see is NOT_FOUND.
  rpc CreateMitigation(CreateMitigationRequest) returns (Mitigation) {
    option (google.api.http) = {
      post: "/argos/v1/partners/{partner_id}/mitigations"
      body: "*"
    };
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [
          CAP_ARGOS_MITIGATION_PARTNER,
          CAP_ARGOS_MITIGATION_REPORT
        ]
      }
    };
  }

  // GetMitigation returns one of the partner's mitigations, withdrawn or not.
  rpc GetMitigation(GetMitigationRequest) returns (Mitigation) {
    option (google.api.http) = {
      get: "/argos/v1/partners/{partner_id}/mitigations/{id}"
    };
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_ARGOS_MITIGATION_PARTNER]
      }
    };
  }

  // ListMitigations returns the partner's live mitigations, optionally for
  // one vulnerability.
  rpc ListMitigations(ListMitigationsRequest) returns (
      ListMitigationsResponse
  ) {
    option (google.api.http) = {
      get: "/argos/v1/partners/{partner_id}/mitigations"
    };
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_ARGOS_MITIGATION_PARTNER]
      }
    };
  }

  // UpdateMitigation replaces a live mitigation's cwe_id, status and details
  // under the same checks as CreateMitigation.
  rpc UpdateMitigation(UpdateMitigationRequest) returns (Mitigation) {
    option (google.api.http) = {
      put: "/argos/v1/partners/{partner_id}/mitigations/{id}"
      body: "*"
    };
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [
          CAP_ARGOS_MITIGATION_PARTNER,
          CAP_ARGOS_MITIGATION_REPORT
        ]
      }
    };
  }

  // WithdrawMitigation withdraws a live mitigation. It needs no approved
  // capability for the method, so a partner can always pull a report.
  rpc WithdrawMitigation(WithdrawMitigationRequest) returns (
      WithdrawMitigationResponse
  ) {
    option (google.api.http) = {
      delete: "/argos/v1/partners/{partner_id}/mitigations/{id}"
    };
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [
          CAP_ARGOS_MITIGATION_PARTNER,
          CAP_ARGOS_MITIGATION_REPORT
        ]
      }
    };
  }

  // The two staff methods below carry no google.api.http option and this
  // file's gateway is generated without generate_unbound_methods, so they
  // have no REST route and only gRPC callers reach them.

  // ListPartnerReviews returns, for Chainguard staff review, each partner's
  // capabilities by review state and the mitigation-method catalogue. With
  // partner_id set it returns that partner only.
  rpc ListPartnerReviews(ListPartnerReviewsRequest) returns (
      ListPartnerReviewsResponse
  ) {
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_ARGOS_PARTNER_CAPABILITY_APPROVE, CAP_INTERNAL]
        unscoped: true
      }
    };
  }

  // DecidePartnerCapability approves, rejects or revokes one of a partner's
  // capabilities, provided its state is still expected_state.
  rpc DecidePartnerCapability(DecidePartnerCapabilityRequest) returns (
      DecidePartnerCapabilityResponse
  ) {
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_ARGOS_PARTNER_CAPABILITY_APPROVE, CAP_INTERNAL]
        unscoped: true
      }
    };
  }
}

message GetPartnerCapabilitiesRequest {
  // partner_id is the UIDP of the partner organization.
  string partner_id = 1 [(chainguard.annotations.iam_scope) = true];
}

message UpdatePartnerCapabilitiesRequest {
  // partner_id is the UIDP of the partner organization.
  string partner_id = 1 [(chainguard.annotations.iam_scope) = true];
  // capabilities is the full set of mitigation method display names the
  // partner now requests. Any name that is not a live method is reported
  // back as unrecognized.
  repeated string capabilities = 2;
  // interests is the full set of PURLs the partner is interested in. Empty
  // or unset means the partner is interested in every PURL.
  repeated string interests = 3;
}

message RequestedCapabilities {
  // pending is every requested capability now awaiting review, sorted.
  repeated string pending_capabilities = 1;
  // unrecognized is every requested name that is not a live method, sorted.
  repeated string unrecognized_capabilities = 2;
}

message UpdatePartnerCapabilitiesResponse {
  RequestedCapabilities capabilities = 1;
}

message DeletePartnerCapabilitiesRequest {
  // partner_id is the UIDP of the partner organization.
  string partner_id = 1 [(chainguard.annotations.iam_scope) = true];
  // capabilities names method display names to remove.
  repeated string capabilities = 2;
  // interests names PURLs to remove.
  repeated string interests = 3;
}

message PartnerCapabilityState {
  // pending is every capability awaiting review, sorted.
  repeated string pending_capabilities = 1;
  // approved is every approved capability, sorted.
  repeated string approved_capabilities = 2;
  // rejected is every rejected capability, sorted.
  repeated string rejected_capabilities = 3;
  // rejection_reasons maps a rejected capability's display name to the
  // reason it was rejected, so the partner can see why.
  map<string, string> rejection_reasons = 4;
}

message PartnerCapabilities {
  PartnerCapabilityState capabilities = 1;
  // interests is the partner's current set of PURLs of interest, sorted.
  // Empty means the partner is interested in every PURL.
  repeated string interests = 2;
}

message ListMitigationMethodsRequest {
}

message MitigationMethod {
  string title = 1;
  string description = 2;
  // cwes are sorted.
  repeated string cwes = 3;
}

message ListMitigationMethodsResponse {
  // mitigation_methods is keyed by display name.
  map<string, MitigationMethod> mitigation_methods = 1;
}

message ListPartnerReviewsRequest {
  // partner_id, when set, is one partner's pseudonym (not an organization
  // UIDP).
  string partner_id = 1 [debug_redact = true];
}

message ListPartnerReviewsResponse {
  repeated PartnerReview partners = 1;
  // mitigation_methods is keyed by display name.
  map<string, MitigationMethod> mitigation_methods = 2;
}

message PartnerReview {
  // partner_id is the partner's pseudonym (not an organization UIDP).
  string partner_id = 1 [debug_redact = true];
  PartnerCapabilityState capabilities = 2;
}

message DecidePartnerCapabilityRequest {
  // partner_id is the partner's pseudonym (not an organization UIDP).
  string partner_id = 1 [debug_redact = true];
  // method is the mitigation method's display name.
  string method = 2;
  // action is APPROVE, REJECT or REVOKE.
  string action = 3;
  // expected_state is PENDING, APPROVED or REJECTED, as last listed.
  // Required.
  string expected_state = 4;
  // rejection_reason is shown to the partner; required for REJECT and REVOKE.
  string rejection_reason = 5 [debug_redact = true];
}

message DecidePartnerCapabilityResponse {
}

enum MitigationStatus {
  MITIGATION_STATUS_UNSPECIFIED = 0;
  // DECLINED: the partner chose not to act.
  MITIGATION_STATUS_DECLINED = 1;
  MITIGATION_STATUS_MITIGATED = 2;
  // FAILED: the partner tried and could not.
  MITIGATION_STATUS_FAILED = 3;
}

message Mitigation {
  string id = 1;
  string vuln_id = 2;
  // method is the mitigation method's display name.
  string method = 3;
  // cwe_id is empty or of the form CWE-79.
  string cwe_id = 4;
  MitigationStatus status = 5;
  string details = 6;
  google.protobuf.Timestamp create_time = 7;
  google.protobuf.Timestamp update_time = 8;
  bool withdrawn = 9;
}

message CreateMitigationRequest {
  // partner_id is the UIDP of the partner organization.
  string partner_id = 1 [(chainguard.annotations.iam_scope) = true];
  string vuln_id = 2;
  // method is the mitigation method's display name.
  string method = 3;
  // cwe_id is optional. When set it must be on both the vulnerability and
  // the method.
  string cwe_id = 4;
  MitigationStatus status = 5;
  string details = 6;
}

message GetMitigationRequest {
  // partner_id is the UIDP of the partner organization.
  string partner_id = 1 [(chainguard.annotations.iam_scope) = true];
  string id = 2;
}

message ListMitigationsRequest {
  // partner_id is the UIDP of the partner organization.
  string partner_id = 1 [(chainguard.annotations.iam_scope) = true];
  // vuln_id empty lists every vulnerability's mitigations.
  string vuln_id = 2;
  string page_token = 3;
  int32 page_size = 4;
}

message ListMitigationsResponse {
  repeated Mitigation mitigations = 1;
  // next_page_token is empty on the last page.
  string next_page_token = 2;
}

message UpdateMitigationRequest {
  // partner_id is the UIDP of the partner organization.
  string partner_id = 1 [(chainguard.annotations.iam_scope) = true];
  string id = 2;
  string cwe_id = 3;
  MitigationStatus status = 4;
  string details = 5;
}

message WithdrawMitigationRequest {
  // partner_id is the UIDP of the partner organization.
  string partner_id = 1 [(chainguard.annotations.iam_scope) = true];
  string id = 2;
}

message WithdrawMitigationResponse {
}
