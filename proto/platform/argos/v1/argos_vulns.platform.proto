syntax = "proto3";

option go_package = "chainguard.dev/sdk/proto/platform/argos/v1";

package chainguard.platform.argos;

import "annotations/auth.proto";
import "argos_osv.platform.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

// ArgosVulns is the Chainguard-specific (non-OSV-spec) vulnerability query
// surface for the Console. Unlike ArgosOSV (the unscoped, OSV-spec shared
// corpus), these RPCs are ORG-SCOPED: a caller sees only their own org's CGP
// records (the org<->CGP association is customer-attributable). Gated by
// CAP_ARGOS_DOCUMENTS_LIST at the parent org.
service ArgosVulns {
  // BatchGet returns metadata for an explicit set of CGP IDs in one call
  // (avoids N x ArgosOSV.GetVuln). Scoped to parent. Paginated.
  rpc BatchGet(BatchGetVulnsRequest) returns (VulnList) {
    option (google.api.http) = {
      post: "/argos/v1/orgs/{parent=**}/vulns:batchGet"
      body: "*"
    };
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_ARGOS_DOCUMENTS_LIST]
      }
    };
  }
  // ListForOrg returns all CGP records associated with the org's documents
  // (accumulated server-side). Scoped to parent. Paginated.
  rpc ListForOrg(ListOrgVulnsRequest) returns (VulnList) {
    option (google.api.http) = {
      get: "/argos/v1/orgs/{parent=**}/vulns"
    };
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_ARGOS_DOCUMENTS_LIST]
      }
    };
  }
}

message BatchGetVulnsRequest {
  // parent is the UIDP of the organization (root group) to scope the query to.
  string parent = 1 [(chainguard.annotations.iam_scope) = true];
  // cgp_ids is the explicit set of CGP vulnerability IDs to fetch metadata for.
  repeated string cgp_ids = 2;
  string page_token = 3;
  int32 page_size = 4;
}

message ListOrgVulnsRequest {
  // parent is the UIDP of the organization (root group) to scope the query to.
  string parent = 1 [(chainguard.annotations.iam_scope) = true];
  // package is replaced by ecosystem and package_name; the server never
  // applied it.
  string package = 2 [deprecated = true];
  // version keeps records whose affected range for package_name contains it,
  // or that were fixed at it. It requires package_name, and total_count is
  // unset when it is given.
  string version = 3;
  string page_token = 4;
  int32 page_size = 5;
  // updated_since restricts results to CGP IDs bound to documents last updated
  // at or after the given time.
  google.protobuf.Timestamp updated_since = 6;
  // has_fix keeps records with (true) or without (false) any fixed version,
  // upstream or a Chainguard rebuild, as chainctl counts it. Field 7 was
  // has_chainguard_fix, a narrower rule.
  optional bool has_fix = 7;
  // ecosystem keeps records with an affected package in this ecosystem,
  // compared ignoring case.
  string ecosystem = 8;
  // package_name keeps records with an affected package of exactly this name.
  string package_name = 9;
  // order_by orders the list; unspecified is CGP ID order. Under an order,
  // total_count counts matching records as a filtered list does, and
  // page_token must come from a page under the same order.
  VulnOrderBy order_by = 10 [(google.api.field_behavior) = OPTIONAL];
}

// VulnOrderBy orders ListForOrg by a record timestamp, ties broken by CGP ID
// in the same direction. MODIFIED is the record's last change, which a
// disclosure or withdrawal can move past its modified field. A record without
// a published time sorts as the earliest instant. A record whose time changes
// between pages can be skipped or returned twice. New values may appear; a
// client should treat an unknown value as unspecified.
enum VulnOrderBy {
  // CGP ID order.
  VULN_ORDER_BY_UNSPECIFIED = 0;
  // Oldest last change first, ties by ascending CGP ID.
  VULN_ORDER_BY_MODIFIED_ASC = 1;
  // Newest last change first, ties by descending CGP ID.
  VULN_ORDER_BY_MODIFIED_DESC = 2;
  // Earliest published first, ties by ascending CGP ID.
  VULN_ORDER_BY_PUBLISHED_ASC = 3;
  // Latest published first, ties by descending CGP ID.
  VULN_ORDER_BY_PUBLISHED_DESC = 4;
}

message VulnList {
  // vulns is the list of OSV records returned, reusing the public OSVRecord
  // from argos_osv (same proto package: chainguard.platform.argos).
  repeated OSVRecord vulns = 1;
  string next_page_token = 2;
  // total_count is the total number of matching records across all pages.
  // Optional; provided for UI pagination.
  optional int64 total_count = 3;
}
