syntax = "proto3";

option go_package = "chainguard.dev/sdk/proto/platform/registry/v1";

package chainguard.platform.registry;

import "annotations/auth.proto";
import "annotations/events.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "registry.platform.proto";

service Charts {
  // AddChart adds a Helm chart and its image dependencies as synced repos in
  // the destination organization.
  rpc AddChart(AddChartRequest) returns (AddChartResponse) {
    option (google.api.http) = {
      post: "/registry/v1/repos/{parent_id=**}:addChart"
      body: "*"
    };
    // AddChart authorizes charts-add OR (repo-create AND group-create) at
    // the requested destination and establishes its scope in the handler.
    // Adding a chart that entitles images also requires image-add.
    option (chainguard.annotations.iam) = { enabled: {} };
    option (chainguard.annotations.events) = {
      type: "dev.chainguard.api.platform.registry.chart.added.v1"
      extensions: ["group"]
      audience: CUSTOMER
    };
  }

  // FindChart resolves a chart name to its source repo within a managed chart
  // catalog. The lookup runs server-side under the catalog identity, so callers
  // need no catalog-scoped credentials; the returned source_repo_id is then
  // passed to AddChart. Mirrors the browse-then-add flow the console performs
  // via the graphql catalog interceptor.
  rpc FindChart(FindChartRequest) returns (FindChartResponse) {
    option (google.api.http) = {
      get: "/registry/v1/charts:find"
    };
    // The catalog read is performed under the catalog identity; the caller only
    // needs to be an authenticated principal (unscoped CAP_REPO_LIST), not to
    // hold any capability on the private catalog folders.
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_REPO_LIST]
        unscoped: true
      }
    };
  }

  // GetChartSyncStatus reports whether a chart repo the organization added is
  // waiting on image repos, queued, syncing, failed, or synced, and which
  // required images have no repo in the organization.
  rpc GetChartSyncStatus(GetChartSyncStatusRequest) returns (ChartSyncStatus) {
    option (google.api.http) = {
      get: "/registry/v1/repos/{repo_id=**}:chartSyncStatus"
    };
    // The handler also requires CAP_REPO_LIST on the organization holding the
    // chart's folder, because the missing-image check reads the repos at its
    // root.
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_REPO_LIST]
      }
    };
  }
}

// ChartCatalog selects which managed chart catalog a FindChart lookup targets.
// The server maps the selector to the environment's catalog folder UIDP, so
// clients never carry environment-specific catalog UIDPs.
enum ChartCatalog {
  CHART_CATALOG_UNSPECIFIED = 0;
  // The community chart catalog (the default).
  CHART_CATALOG_COMMUNITY = 1;
  // The iamguarded chart catalog.
  CHART_CATALOG_IAMGUARDED = 2;
}

// FindChartRequest resolves a chart name within a managed catalog.
message FindChartRequest {
  // Which managed chart catalog to search.
  ChartCatalog catalog = 1;
  // The chart name to resolve (e.g. "argo-cd").
  string name = 2;
}

// FindChartResponse carries the resolved source chart repo.
message FindChartResponse {
  // The UIDP of the resolved source chart repo, suitable for
  // AddChartRequest.source_repo_id.
  string source_repo_id = 1;
  // The resolved chart name.
  string name = 2;
}

message AddChartRequest {
  // The UIDP of the destination organization.
  string parent_id = 1 [(chainguard.annotations.iam_scope) = true];
  // The UIDP of the source chart repo (e.g., from the catalog).
  string source_repo_id = 2;
  // If true, return what would change but don't create anything.
  bool dry_run = 3;
  // The tag of the source chart to inspect for image dependencies. Defaults to
  // the newest non-FIPS tag in the source repo when empty, or the newest FIPS
  // tag when fips is set. Mutually exclusive with fips.
  string tag = 4;
  // Catalog repo names of the chart's images to provision (e.g. "nginx"; see
  // ChartImage.repo_name). Must be a subset of the images in the chart's
  // metadata; unknown names are rejected with INVALID_ARGUMENT. Images the
  // chart requires are always provisioned regardless of this list — the list
  // selects which optional images to include. Empty means all images.
  repeated string images = 5;
  // If true, default to the newest FIPS tag in the source repo instead of the
  // newest non-FIPS tag. Mutually exclusive with tag; setting both is rejected
  // with INVALID_ARGUMENT.
  bool fips = 6;
}

// AddChartResponse contains the result of an AddChart operation.
message AddChartResponse {
  repeated AddChartResult repos = 1;
}

// AddChartResult describes what happened to a single repo during AddChart.
message AddChartResult {
  // Path of the repo relative to the destination organization. The chart
  // itself lives under the catalog folder (e.g. "charts/argo-cd"); image
  // dependencies are created at the org root, so their path is the bare repo
  // name (e.g. "nginx").
  string name = 1;
  // True if the repo was newly created by this call; false if it already
  // existed (or, on a dry run, would not need to be created).
  bool created = 2;
  // The UIDP of the resulting repo. Empty only when a dry run reports a
  // would-be-created repo that does not yet exist; an existing repo (created
  // = false) always carries its UIDP, including on dry runs.
  string id = 3;
  // Whether the image is required or optional for the chart to deploy.
  // UNSPECIFIED for the chart repo itself and for charts whose metadata does
  // not carry per-image requirements.
  ChartImageRequirement requirement = 4;
  // True if provisioning this repo consumed (or, on a dry run, would consume)
  // an entitlement slot. Always false for the chart repo itself and for
  // organizations whose plan does not meter individual images.
  bool consumes_slot = 5;
}

message GetChartSyncStatusRequest {
  // The UIDP of the chart repo in the organization's chart folder.
  string repo_id = 1 [(chainguard.annotations.iam_scope) = true];
  // The chart tag whose chart-lock decides which images are required.
  // Defaults to the newest non-FIPS tag of the chart's source, or the newest
  // FIPS tag when fips is set, as in AddChart. Mutually exclusive with fips.
  string tag = 2;
  // If true, default to the newest FIPS tag instead of the newest non-FIPS
  // tag. Mutually exclusive with tag; setting both is rejected with
  // INVALID_ARGUMENT.
  bool fips = 3;
}

// ChartSyncStatus is the sync state of a chart repo. Like SyncStatus it
// describes the repo, not a tag; only missing_images depends on the tag.
message ChartSyncStatus {
  enum Status {
    // Same name and number as SyncStatus.Status.
    // protolint:disable:next ENUM_FIELD_NAMES_ZERO_VALUE_END_WITH
    UNKNOWN = 0;
    // The chart repo is queued to sync. Same name and number as
    // SyncStatus.Status.
    QUEUED = 1;
    // The chart repo is syncing. Same name and number as SyncStatus.Status.
    IN_PROGRESS = 2;
    // The chart repo's sync failed. Same name and number as
    // SyncStatus.Status.
    FAILED = 3;
    // A required image has no repo in the organization syncing from its
    // catalog repo; see missing_images.
    AWAITING_IMAGES = 4;
    // The chart repo is not queued and holds at least one tag.
    SYNCED = 5;
  }

  Status status = 1;

  // When the chart repo's key was queued, as in SyncStatus.create_time. Set
  // when the workqueue reports a queued time for the key; today that is
  // QUEUED and FAILED. Unset for AWAITING_IMAGES and SYNCED, which do not read
  // the key.
  google.protobuf.Timestamp create_time = 2;

  // The tag whose chart-lock the missing-image check read.
  string tag = 3;

  // The required images the organization has no repo for. Set only for
  // AWAITING_IMAGES.
  repeated MissingImage missing_images = 4;

  message MissingImage {
    // The catalog repo name, e.g. "nginx".
    string name = 1;
    // The catalog repo UIDP.
    string source_repo_id = 2;
  }
}
