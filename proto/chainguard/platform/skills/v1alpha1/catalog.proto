syntax = "proto3";

package chainguard.platform.skills.v1alpha1;

import "annotations/auth.proto";
import "annotations/mcp.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "platform/common/v1/uidp.platform.proto";

option go_package = "chainguard.dev/sdk/proto/chainguard/platform/skills/v1alpha1";
option java_multiple_files = true;
option java_outer_classname = "CatalogProto";
option java_package = "com.chainguard.platform.skills.v1alpha1";

// Skills is the catalog surface for hardened Chainguard skills. Its customer-
// facing side is a read API (ListSkills) — the shared backend consumed by the
// cgr-skills MCP, chainctl, and the community UI (one backend, many front doors,
// mirroring the registry ListRepos/ListTags endpoints). It also carries the
// publish-time writes (UpdateSkill/DeleteSkill), which are internal_only and
// hidden from the tool surface. Skill content is pulled from the OCI registry
// (skills.cgr.dev); this API serves the catalog metadata (name, description,
// category) the registry does not carry.
//
// A skill is a registry Repo, so versions, digests, and content come from the
// registry API (ListRepos/ListTags/GetTag + OCI). Ranked catalog search is
// SearchSkills.
service Skills {
  // ListSkills lists skills in the catalog under a group, paginated. It never
  // returns the whole catalog in one response (bounded page_size).
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse) {
    option (google.api.http) = {get: "/skills/v1alpha1/skills"};
    // Org-agnostic like registry ListRepos: the caller passes a UIDP filter and
    // the results self-scope to the orgs the caller holds CAP_SKILLS_LIST
    // on (unscoped). The cgr-skills MCP is one caller that filters the public
    // skills group.
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_SKILLS_LIST]
        unscoped: true
      }
    };
    option (chainguard.annotations.mcp) = {
      description: "List hardened Chainguard skills in the catalog under a group (name + description + category), one bounded page at a time. To find a specific skill prefer search; use this to browse."
      read_only: true
      destructive: false
      idempotent: true
      open_world: false
    };
  }

  // SearchSkills is the ranked search surface over the catalog: it matches the
  // free-text query against name, description, category, and keywords, scoped to
  // a group. Like ListSkills it is org-agnostic and unscoped, self-scoping to the
  // orgs the caller holds CAP_SKILLS_LIST on.
  rpc SearchSkills(SearchSkillsRequest) returns (SearchSkillsResponse) {
    option (google.api.http) = {get: "/skills/v1alpha1/skills:search"};
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_SKILLS_LIST]
        unscoped: true
      }
    };
    option (chainguard.annotations.mcp) = {
      description: "Search hardened Chainguard skills in the catalog by a free-text query (matched against name, description, category, and keywords) under a group. Prefer this over list to find a specific skill."
      read_only: true
      destructive: false
      idempotent: true
      open_world: false
    };
  }

  // UpdateSkill writes a skill's catalog metadata row at publish time, keyed by
  // repo_uidp (the skill's id — a skill is a registry repo). It follows AIP-134
  // create-or-update: with allow_missing=true the row is created when none
  // exists; otherwise a missing row is NotFound. Internal publish-path use only:
  // its skills.write capability is internal_only and it is hidden from the tool
  // surface, so it is never customer-callable — the skillchain-megaserver client
  // holds the internal grant.
  rpc UpdateSkill(UpdateSkillRequest) returns (Skill) {
    option (google.api.http) = {
      patch: "/skills/v1alpha1/skills/{repo_uidp=**}"
      body: "*"
    };
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_SKILLS_WRITE]
      }
    };
    // Internal publish-path RPC — keep it off the agent/MCP tool surface.
    option (chainguard.annotations.mcp) = {hidden: true};
  }

  // DeleteSkill soft-deletes a skill's catalog row by UIDP on demote/removal, so
  // ListSkills stops surfacing it. Internal publish-path use only (skills.delete
  // is internal_only), hidden from the tool surface.
  rpc DeleteSkill(DeleteSkillRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/skills/v1alpha1/skill/{id=**}"};
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_SKILLS_DELETE]
      }
    };
    // Internal publish-path RPC — keep it off the agent/MCP tool surface.
    option (chainguard.annotations.mcp) = {hidden: true};
  }
}

// Skill is one hardened skill in the catalog. Content (SKILL.md + references)
// lives in the OCI registry; this record carries the catalog metadata the
// registry does not (description, license, category). Read-only over the public
// API — populated internally at publish time.
message Skill {
  // id, the skill's UIDP under the owning Group.
  string id = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (chainguard.annotations.iam_scope) = true
  ];
  // name is the skill's catalog name (its path under the skills folder), e.g.
  // "github.com/anthropics/skills/pdf".
  string name = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // description is a human-readable one-line summary.
  string description = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // license is the skill's SPDX license identifier, if declared.
  string license = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // category groups the skill in the catalog, if declared.
  string category = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // keywords are free-form tags associated with the skill. Field 6 is reclaimed
  // from the removed digest field: digest = 6 (string) shipped in SDK
  // v0.1.159-v0.1.165, but the catalog was never populated or consumed in that
  // window, so the slot is reused for keywords (repeated string).
  repeated string keywords = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // create_time is when the skill was first recorded.
  google.protobuf.Timestamp create_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // update_time is when the skill was last updated.
  google.protobuf.Timestamp update_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // hardened is true when the skill's promoted version was modified by the
  // harden pipeline (harden.modified). Backs the "Hardened" chip on the catalog
  // directory page (ACID-373).
  bool hardened = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // stars is the accumulated count of stars (favorites) for the skill.
  int64 stars = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // downloads is the accumulated download/pull count for the skill.
  int64 downloads = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  // source is the organization that published the skill (e.g. "anthropics").
  string source = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
  // next id: 13
}

message UpdateSkillRequest {
  // repo_uidp is the UIDP of the registry repo backing this skill — the stable
  // key the row is matched on (create-or-update), carried in the resource path.
  string repo_uidp = 1 [(google.api.field_behavior) = REQUIRED];
  // parent_id is the owning Group UIDP. It only scopes the capability check
  // (iam_scope); the row's identity is repo_uidp (the skill is keyed by its
  // backing repo's UIDP), so parent_id is not stored. repo_uidp must be within
  // parent_id's subtree.
  string parent_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];
  // name is the skill's catalog name (its path under the skills folder).
  string name = 3 [(google.api.field_behavior) = REQUIRED];
  // description is a human-readable one-line summary.
  string description = 4 [(google.api.field_behavior) = OPTIONAL];
  // license is the skill's SPDX license identifier, if declared.
  string license = 5 [(google.api.field_behavior) = OPTIONAL];
  // category groups the skill in the catalog, if declared.
  string category = 6 [(google.api.field_behavior) = OPTIONAL];
  // keywords are free-form tags associated with the skill.
  repeated string keywords = 7 [(google.api.field_behavior) = OPTIONAL];
  reserved 8; // was digest — the catalog is version-independent; digests are the registry's
  // allow_missing, per AIP-134 create-or-update: when true, create the row if it
  // does not exist; when false (default), a missing row is NotFound.
  bool allow_missing = 9 [(google.api.field_behavior) = OPTIONAL];
  // hardened marks the promoted version as harden-pipeline-modified
  // (harden.modified); the writer sets it at promote time and it surfaces as the
  // catalog "Hardened" chip.
  bool hardened = 10 [(google.api.field_behavior) = OPTIONAL];
  // source is the organization that published the skill (e.g. "anthropics"). The
  // publish-time writer sets it; a re-publish should carry it so it is not
  // cleared.
  string source = 11 [(google.api.field_behavior) = OPTIONAL];
  // stars is the accumulated count of stars (favorites). An out-of-band
  // engagement metric: UpdateSkill preserves the stored value when this is 0
  // (unset), so a publish-time / backfill writer that has no count does not
  // clobber it; a metrics writer passes the real count to set it.
  int64 stars = 12 [(google.api.field_behavior) = OPTIONAL];
  // downloads is the accumulated download/pull count. Like stars, an out-of-band
  // metric preserved on 0 (unset) so partial writers never reset it.
  int64 downloads = 13 [(google.api.field_behavior) = OPTIONAL];
  // next id: 14
}

message DeleteSkillRequest {
  // id, the UIDP of the Skill to soft-delete.
  string id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];
}

message ListSkillsRequest {
  // uidp is a UIDP-based filter naming the org (group) to list skills under.
  // Any org may be filtered, but one is required — there is no cross-org
  // "list everything" mode. Results still self-scope to the orgs the caller is
  // authorized for (the RPC is unscoped), so naming an org the caller cannot
  // access returns nothing rather than another org's skills.
  chainguard.platform.common.UIDPFilter uidp = 1 [(google.api.field_behavior) = REQUIRED];
  // category optionally narrows results to a single category.
  string category = 2;
  // page_size is the maximum number of results to return per page. It is bounded
  // server-side: omitting it applies a default page size and any value is capped
  // at a maximum, so a list is always paginated and never returns the whole
  // catalog in one response.
  int32 page_size = 3;
  // page_token is a token from a previous response's next_page_token. Omit to
  // start from the first page.
  string page_token = 4;
  // source optionally narrows results to a single publishing organization
  // (e.g. "anthropics").
  string source = 5;
  // next id: 6
}

message ListSkillsResponse {
  repeated Skill items = 1;
  // next_page_token is the token for the next page (empty if no more pages).
  string next_page_token = 2;
  // total_count is the total number of skills matching the filter.
  int64 total_count = 3;
}

message SearchSkillsRequest {
  // uidp is a UIDP-based filter naming the org (group) to search skills under.
  // Required, like ListSkills: results self-scope to the orgs the caller is
  // authorized for.
  chainguard.platform.common.UIDPFilter uidp = 1 [(google.api.field_behavior) = REQUIRED];
  // query is the free-text search string, matched against the catalog's name,
  // description, category, and keywords.
  string query = 2 [(google.api.field_behavior) = REQUIRED];
  // page_size is the maximum number of results to return per page. It is bounded
  // server-side (same as ListSkills): omitting it applies a default page size and
  // any value is capped at a maximum, so a search is always paginated and never
  // returns the whole match set in one response.
  int32 page_size = 3;
  // page_token is a token from a previous response's next_page_token. Omit to
  // start from the first page.
  string page_token = 4;
  // next id: 5
}

message SearchSkillsResponse {
  repeated Skill items = 1;
  // next_page_token is the token for the next page (empty if no more pages).
  string next_page_token = 2;
  // total_count is the total number of skills matching the query.
  int64 total_count = 3;
}
