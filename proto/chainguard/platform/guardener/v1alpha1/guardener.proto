syntax = "proto3";

package chainguard.platform.guardener.v1alpha1;

import "annotations/auth.proto";
import "annotations/mcp.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";

option go_package = "chainguard.dev/sdk/proto/chainguard/platform/guardener/v1alpha1";
option java_multiple_files = true;
option java_outer_classname = "GuardenerProto";
option java_package = "com.chainguard.platform.guardener.v1alpha1";

// Guardener is the customer-facing surface for the guardener platform. It covers
// a group's guardener entitlement (settings only support can change), the
// on-demand migration API (enqueue a migration for a repository
// and track it via a long-running operation), and read access to the dependency
// scans guardener continuously builds for the group's linked repositories.
service Guardener {
  // GetEntitlement returns the guardener entitlement for a group. A group with no
  // configured entitlement returns the default (repo_visibility_scope
  // unspecified, treated as public-only) rather than NOT_FOUND.
  rpc GetEntitlement(GetEntitlementRequest) returns (Entitlement) {
    option (google.api.http) = {get: "/guardener/v1alpha1/entitlements/{group=**}"};
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_GUARDENER_ENTITLEMENT_LIST]
      }
    };
  }

  // UpdateEntitlement creates or updates the guardener entitlement for a group.
  // It requires CAP_INTERNAL in addition to CAP_GUARDENER_ENTITLEMENT_MANAGE, so
  // only internal (support) identities can change these settings.
  rpc UpdateEntitlement(UpdateEntitlementRequest) returns (Entitlement) {
    option (google.api.http) = {
      put: "/guardener/v1alpha1/entitlements/{group=**}"
      body: "*"
    };
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [
          CAP_GUARDENER_ENTITLEMENT_MANAGE,
          CAP_INTERNAL
        ]
      }
    };
  }

  // MigrateRepository enqueues a GitHub Actions migration for the given
  // repository and returns a long-running operation. The migration opens (or
  // updates) a single pull request replacing upstream GitHub Actions with their
  // Chainguard equivalents at version-equivalent tags.
  // With configured_migrations set, registered workers check their repository
  // opt-ins and report independent outcomes in one operation. Each feature
  // requires its own migration capability. Permission refusals are feature
  // results, and deployment-disabled features finish as successful no-ops.
  // ON_DEMAND mode with the Images feature requests a one-time image migration
  // without a YAML opt-in. Explicit migration opt-outs and ignores still apply.
  //
  // The caller's group must own the repository's GitHub installation (verified
  // via a matching account_association); the resulting operation is namespaced
  // under that group's UIDP.
  rpc MigrateRepository(MigrateRepositoryRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/guardener/v1alpha1/migrate"
      body: "*"
    };
    option (chainguard.annotations.iam) = {
      enabled: {}
    };
    option (google.longrunning.operation_info) = {
      response_type: "chainguard.platform.guardener.v1alpha1.MigrateOperationResponse"
      metadata_type: "chainguard.platform.guardener.v1alpha1.MigrateOperationMetadata"
    };
    option (chainguard.annotations.mcp) = {
      description: "Enqueue repository migration. Set configured_migrations "
                   "to run the opted-in Actions and image migrations with "
                   "separate results and pull requests. Set ON_DEMAND mode "
                   "and the Images feature for a one-time image migration "
                   "without YAML opt-in. Omitting both retains "
                   "Actions-only behavior."
      read_only: false
      destructive: false
      idempotent: true
      open_world: false
    };
  }

  // GetMigrationOperation returns the current state of a migration operation
  // previously returned by MigrateRepository. The operation name embeds the
  // owning group's UIDP; group must match and is the IAM scope.
  // Each feature's permission is checked separately; unauthorized feature
  // details are replaced with a permission-denied result. Legacy operations
  // require the Actions migration capability.
  rpc GetMigrationOperation(GetMigrationOperationRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {get: "/guardener/v1alpha1/{name=operations/migrate/**}"};
    option (chainguard.annotations.iam) = {
      enabled: {}
    };
    option (chainguard.annotations.mcp) = {
      description: "Get the state of a guardener migration long-running operation by its name."
      read_only: true
      destructive: false
      idempotent: true
      open_world: false
    };
  }

  // ListScans lists summaries of a group's dependency scans — one per
  // repository, its most recent scan — newest first, optionally filtered to
  // one repository. Scans are built continuously for the repositories of the
  // group's linked GitHub installations; a group (or filtered repository)
  // with no scans yields an empty list. Each summary carries the scan's id,
  // resolvable to the full scan via GetScan.
  rpc ListScans(ListScansRequest) returns (ListScansResponse) {
    option (google.api.http) = {get: "/guardener/v1alpha1/{group=**}/scans"};
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_GUARDENER_SCAN_LIST]
      }
    };
    option (chainguard.annotations.mcp) = {
      description: "List summaries of a group's guardener dependency scans (one per repository, newest first): scan id, repository, commit, and scan time. Resolve a summary's id with GetScan."
      read_only: true
      destructive: false
      idempotent: true
      open_world: false
    };
  }

  // GetScan returns one dependency scan by the id a ListScans summary
  // carried: every declared artifact (its purl and the files that declared
  // it) and the relationships between artifacts. NOT_FOUND means the scan
  // does not exist for the group (or expired).
  rpc GetScan(GetScanRequest) returns (Scan) {
    option (google.api.http) = {get: "/guardener/v1alpha1/{group=**}/scans/{id}"};
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_GUARDENER_SCAN_GET]
      }
    };
    option (chainguard.annotations.mcp) = {
      description: "Get one guardener dependency scan by id: declared artifacts (purl and declaring file paths) and the relationships between them."
      read_only: true
      destructive: false
      idempotent: true
      open_world: false
    };
  }
}

// Entitlement holds the support-configurable settings for a group.
message Entitlement {
  // RepoVisibilityScope controls which repositories guardener responds to for the
  // group.
  enum RepoVisibilityScope {
    // Unspecified is the default when no entitlement is configured; treated as
    // PUBLIC.
    REPO_VISIBILITY_SCOPE_UNSPECIFIED = 0;
    // Guardener responds only to public repositories.
    // buf:lint:ignore ENUM_VALUE_PREFIX
    PUBLIC = 1;
    // Guardener responds to all repositories (public and private).
    // buf:lint:ignore ENUM_VALUE_PREFIX
    ALL = 2;
  }

  // group is the Chainguard group UIDP the entitlement applies to.
  string group = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];

  // repo_visibility_scope controls which repositories guardener responds to for
  // the group.
  RepoVisibilityScope repo_visibility_scope = 2;

  // create_time is when the entitlement was first configured.
  google.protobuf.Timestamp create_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // update_time is when the entitlement was last updated.
  google.protobuf.Timestamp update_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message GetEntitlementRequest {
  // group is the Chainguard group UIDP whose entitlement to fetch.
  string group = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];
}

message UpdateEntitlementRequest {
  // group is the Chainguard group UIDP whose entitlement to create or update.
  string group = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];

  // repo_visibility_scope is the repo visibility scope to set for the group.
  Entitlement.RepoVisibilityScope repo_visibility_scope = 2;
}

// MigrateRepositoryRequest identifies the repository, group and migration
// intent.
message MigrateRepositoryRequest {
  // UIDP of the caller's group (org). Must own the repository's installation.
  string group = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];

  // Full URL of the repository to migrate, e.g.
  // "https://github.com/owner/repo". Only github.com is supported today; the
  // field is a URL so other forges (GitHub Enterprise, GitLab) can be supported
  // without a request change.
  string url = 2 [(google.api.field_behavior) = REQUIRED];
  // Run registered migrations enabled by the repository's configuration.
  // Permissions and deployment availability are reported per feature.
  // False with an unspecified mode preserves legacy Actions-only behavior.
  bool configured_migrations = 3 [(google.api.field_behavior) = OPTIONAL];
  // ON_DEMAND authorizes a one-time Images run without a YAML migration opt-in.
  // It requires features to contain only IMAGES and cannot be combined with
  // configured_migrations. An explicit migration opt-out remains effective.
  MigrationMode mode = 4 [(google.api.field_behavior) = OPTIONAL];
  // Workers to run for an ON_DEMAND request, which currently requires exactly
  // IMAGES. Must be empty for other requests.
  repeated MigrationFeature features = 5 [
    (google.api.field_behavior) = OPTIONAL
  ];
}

// MigrationFeatureResult describes one feature in a repository migration.
message MigrationFeatureResult {
  // The feature whose effective configuration controls this migration.
  MigrationFeature feature = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The feature's child operation, namespaced under the same group.
  string operation = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // False means queued or running. True does not imply success: check error.
  bool done = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The PR created or updated, when there are changes.
  string pull_request_url = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // True when the feature completed successfully without edits.
  bool no_op = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // True when repository configuration or the deployment disabled migration.
  bool disabled = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // A terminal failure for this feature. Other features may have succeeded.
  google.rpc.Status error = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message GetMigrationOperationRequest {
  // UIDP of the owning group; the IAM scope. Must match the UIDP embedded in
  // the operation name.
  string group = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];

  // The operation name, as returned by MigrateRepository
  // (operations/migrate/{uidp}/{uuid}).
  string name = 2 [(google.api.field_behavior) = REQUIRED];
}

// Trigger identifies what initiated a migration run.
enum Trigger {
  TRIGGER_UNSPECIFIED = 0;
  // A user enqueued the migration via MigrateRepository.
  TRIGGER_USER = 1;
  // The system (cron migrator) enqueued the migration.
  TRIGGER_SYSTEM = 2;
}

// MigrateOperationMetadata is carried in Operation.metadata while a migration
// is running and when it is done.
message MigrateOperationMetadata {
  // Full URL of the repository being migrated, e.g.
  // "https://github.com/owner/repo".
  string url = 1;
  // The workqueue key for the repository's migration.
  string repo_key = 2;
  // When the operation was created.
  google.protobuf.Timestamp create_time = 3;
  // What triggered the run (user vs system).
  Trigger trigger = 4;
  // The identity that triggered the run: the caller's subject for user-
  // triggered runs, or the reconciler/cron identity for system-triggered runs.
  string actor = 5;
  // The worker awaited by a leaf operation; unset for legacy Actions.
  MigrationFeature feature = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // True when this operation tracks configuration-driven feature migrations.
  bool configured_migrations = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Progress of each feature, including any already-completed PRs or failures.
  repeated MigrationFeatureResult results = 8 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];
  // The requested mode; unspecified preserves legacy/configured behavior.
  MigrationMode mode = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// MigrateOperationResponse is carried in Operation.response when a migration
// completes. Leaf failures use Operation.error. Parent operations instead
// carry independent feature failures in results so successful PRs remain
// visible.
message MigrateOperationResponse {
  // The migration pull request opened or updated by the run. Empty when the
  // run was a no-op (nothing to migrate).
  string pull_request_url = 1;
  // True when the run completed but produced no pull request (opted out, no
  // edits, or no net changes).
  bool no_op = 2;
  // True when repository configuration or the deployment disabled migration.
  bool disabled = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Results for a parent operation. The parent completes after all children
  // terminate; check each error before treating the request as successful.
  repeated MigrationFeatureResult results = 4 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];
}

message ListScansRequest {
  // UIDP of the caller's group; the IAM scope. Scans are stored per group, so
  // this scopes the listing to the group's own scans.
  string group = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];

  // Optional: filters the listing to one repository, as its host-prefixed
  // path, e.g. "github.com/owner/repo". Carried as a query parameter over
  // HTTP: a group UIDP and a repository path are both hierarchical, and only
  // one of them can be a multi-segment URL path variable. The field is a
  // path, not a fixed segment count, so forges with nested namespaces (e.g.
  // GitLab subgroups) can be supported without a request change; only
  // github.com repositories are scanned today.
  string repo = 2;
}

message ListScansResponse {
  // The matching scan summaries, newest first (one per repository: its most
  // recent scan).
  repeated ScanSummary scans = 1;
}

// ScanSummary identifies one dependency scan without its artifact payload.
message ScanSummary {
  // Opaque id of the scan, unique within the group; resolve it to the full
  // scan with GetScan. Ids are stable for the lifetime of the scan but carry
  // no format guarantee — treat them as opaque tokens.
  string id = 1;

  // The repository that was scanned, as its host-prefixed path, e.g.
  // "github.com/owner/repo".
  string repo = 2;

  // The commit that was scanned (the repository's default-branch HEAD at scan
  // time).
  string commit_sha = 3;

  // When the scan ran.
  google.protobuf.Timestamp scan_time = 4;
}

message GetScanRequest {
  // UIDP of the caller's group; the IAM scope. Scan ids only resolve within
  // the group that owns them.
  string group = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];

  // The scan id, from a ListScans summary.
  string id = 2 [(google.api.field_behavior) = REQUIRED];
}

// Scan is one dependency scan of a repository at a commit: the declared
// artifacts and the relationships between them.
message Scan {
  // Opaque id of the scan (see ScanSummary.id).
  string id = 1;

  // The repository that was scanned, as its host-prefixed path, e.g.
  // "github.com/owner/repo".
  string repo = 2;

  // The commit that was scanned (the repository's default-branch HEAD at scan
  // time).
  string commit_sha = 3;

  // When the scan ran.
  google.protobuf.Timestamp scan_time = 4;

  // The artifacts the repository declares.
  repeated ScanArtifact artifacts = 5;

  // The relationships between artifacts.
  repeated ScanRelationship relationships = 6;
}

// ScanArtifact is one declared artifact found by a scan.
message ScanArtifact {
  // Opaque identifier of the artifact within this scan; the join key for
  // ScanRelationship endpoints.
  string id = 1;

  // Package URL (https://github.com/package-url/purl-spec) of the artifact.
  string purl = 2;

  // Repository-relative paths of the files that declared the artifact (e.g.
  // "go.mod", "service/Dockerfile").
  repeated string paths = 3;
}

// ScanRelationship is one relationship between two artifacts of a scan.
message ScanRelationship {
  // ScanArtifact.id of the relationship's source.
  string from = 1;

  // ScanArtifact.id of the relationship's target.
  string to = 2;

  // The relationship type (e.g. "dependency-of").
  string type = 3;
}

// MigrationFeature identifies the repository migration worker.
enum MigrationFeature {
  // Legacy operations did not identify their Actions worker explicitly.
  MIGRATION_FEATURE_UNSPECIFIED = 0;
  // GitHub Actions workflow migration.
  MIGRATION_FEATURE_ACTIONS = 1;
  // Container image reference migration.
  MIGRATION_FEATURE_IMAGES = 2;
}

// MigrationMode distinguishes configured migrations from one-time requests.
enum MigrationMode {
  // Preserve existing behavior controlled by configured_migrations.
  MIGRATION_MODE_UNSPECIFIED = 0;
  // Run Images once without requiring a repository migration opt-in.
  MIGRATION_MODE_ON_DEMAND = 1;
}
