syntax = "proto3";

package chainguard.platform.iam.v2;

import "annotations/auth.proto";
import "annotations/events.proto";
import "annotations/mcp.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";

option go_package = "chainguard.dev/sdk/proto/chainguard/platform/iam/v2";
option java_multiple_files = true;
option java_outer_classname = "AuthPoliciesProto";
option java_package = "com.chainguard.platform.iam.v2";

// AuthPoliciesService manages an organization's authentication policy: the
// controls that decide which sign-in methods its members may use. Every
// organization has exactly one policy, addressed by the organization's UIDP.
// It is never created or deleted, only read and updated.
service AuthPoliciesService {
  // GetAuthPolicy returns the authentication policy of an organization. An
  // organization that has never configured one gets a policy with every
  // control unset, which leaves sign-in unrestricted.
  rpc GetAuthPolicy(GetAuthPolicyRequest) returns (AuthPolicy) {
    option (google.api.http) = {get: "/iam/v2/authPolicies/{uid=**}"};
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_IAM_AUTH_POLICIES_LIST]
      }
    };
  }

  // UpdateAuthPolicy changes an organization's authentication policy. Turning
  // sso_only on shuts every member who does not sign in through the
  // organization's own identity provider out of it, so this is held by
  // organization owners only and every change is published as an event.
  rpc UpdateAuthPolicy(UpdateAuthPolicyRequest) returns (AuthPolicy) {
    option (google.api.http) = {
      patch: "/iam/v2/authPolicies/{auth_policy.uid=**}"
      body: "auth_policy"
    };
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_IAM_AUTH_POLICIES_UPDATE]
      }
    };
    option (chainguard.annotations.events) = {
      type: "dev.chainguard.api.iam.auth_policies.updated.v1"
      extensions: ["group"]
      audience: CUSTOMER
    };
    // Never an MCP tool: flipping sso_only can lock an organization's
    // members out, and session_duration is an organization-wide sign-in
    // decision too; both belong to a person acting through chainctl or the
    // Console. The backend builds its MCP surface from
    // v2beta1 descriptors only, so no RPC in this v2-only service is a tool
    // today; hidden guards the day v2 joins that surface.
    option (chainguard.annotations.mcp) = {hidden: true};
  }

  // StartValidation opens a validation session: a real sign-in, run ahead of
  // enabling sso_only, that proves the organization's own identity provider
  // authenticates a person (IDP) or that a designated break-glass identity
  // can sign in without it (BREAK_GLASS). It returns the pending Validation
  // with its id and, only on this response, the open_url a human must open to
  // run the sign-in; it mints no Chainguard session of its own. The sign-in's
  // outcome is recorded on the session for GetValidationStatus to return. A
  // session that passes also records what it proves for GetAuthPolicy to
  // report as its status: for IDP, a fingerprint of the provider
  // configuration it went through, which replaces any earlier one; for
  // BREAK_GLASS, the designee's own validation, which replaces that
  // designee's earlier one. A failed session is reported by
  // GetValidationStatus and does not change GetAuthPolicy's status, so an
  // earlier pass stays recorded. Re-runnable: a new session may be started at
  // any time.
  //
  // Held by organization owners, the same capability as UpdateAuthPolicy:
  // starting a validation is part of configuring the policy, and the designee
  // of a break-glass session is named by an owner, not self-selected. A
  // BREAK_GLASS session also requires auth_policies.break_glass.update on the
  // organization, the capability AuthPolicy.break_glass_identities is shown
  // to, because whether a session opens tells the caller whether the identity
  // is designated; without it the call is PERMISSION_DENIED for every
  // identity. An IDP session needs auth_policies.update alone.
  //
  // (-- api-linter: core::0136::response-message-name=disabled
  //     aip.dev/not-precedent: StartValidation is bound under the policy it
  //     validates but creates and returns a Validation, the thing it operates
  //     on; a StartValidationResponse wrapper around it would add nothing but
  //     a second message. --)
  rpc StartValidation(StartValidationRequest) returns (Validation) {
    option (google.api.http) = {
      post: "/iam/v2/authPolicies/{uid=**}:startValidation"
      body: "*"
    };
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_IAM_AUTH_POLICIES_UPDATE]
      }
    };
    option (chainguard.annotations.events) = {
      type: "dev.chainguard.api.iam.auth_policies.validation.started.v1"
      extensions: ["group"]
      audience: CUSTOMER
    };
    // Never an MCP tool: a validation session drives a real sign-in a person
    // must complete, so it belongs to a human in chainctl or the Console, not
    // a tool call. Hidden guards the day v2 joins the MCP surface.
    option (chainguard.annotations.mcp) = {hidden: true};
  }

  // GetValidationStatus returns a validation session by id: its state
  // (pending, passed, failed or expired), the diagnostics the sign-in
  // produced (which step failed, the provider's error code, the claims it
  // saw), and the recorded result. It never returns open_url. It is a read
  // and emits no event, but it is held to the capabilities that started the
  // session: the diagnostics name the person who signed in (their provider
  // subject and email), which is not for every member who may read the
  // policy flag. A break-glass session also needs
  // auth_policies.break_glass.update, as starting one does; to a caller
  // without it the session is NOT_FOUND. The policy's uid is a root
  // organization UIDP, a single path segment, so the binding matches it
  // exactly; the session is addressed as a resource under the policy, so
  // its id travels in the path rather than in the query string.
  //
  // (-- api-linter: core::0131::response-message-name=disabled
  //     aip.dev/not-precedent: GetValidationStatus returns the Validation it
  //     is asked about, not a message named ValidationStatus as the rule
  //     reads off the method name (that name is the policy's validation
  //     view, a different message in this file); the method is named for
  //     what it answers, the way LookupGroup/LookupIdentity diverge from
  //     their resources elsewhere in this API. --)
  // (-- api-linter: core::0127::resource-name-extraction=disabled
  //     aip.dev/not-precedent: GetValidationStatus addresses a session under
  //     the policy by the policy's UIDP plus the session id; we extract the
  //     ids, not a full resource name, as everywhere else in this API that
  //     keys on UIDPs. --)
  rpc GetValidationStatus(GetValidationStatusRequest) returns (Validation) {
    // protolint:disable:next MAX_LINE_LENGTH
    option (google.api.http) = {get: "/iam/v2/authPolicies/{uid}/validations/{session_id}"};
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_IAM_AUTH_POLICIES_UPDATE]
      }
    };
    // A read, but never an MCP tool: the diagnostics name the person who
    // signed in, and the session it reads belongs to a sign-in a human runs.
    // Hidden guards the day v2 joins the MCP surface.
    option (chainguard.annotations.mcp) = {
      hidden: true
      read_only: true
    };
  }

  // SetBreakGlassAdmins replaces an organization's set of break-glass
  // admins: the owners who keep a way in through a sign-in method other than
  // the organization's identity provider while sso_only is on, for when that
  // provider is misconfigured or unavailable. The identities in the request
  // are the whole set afterwards; an empty request clears it.
  //
  // Each identity not already designated must be a person's login identity
  // (a root identity with an exact issuer and subject, not a workload,
  // assumable, service-principal, or static-key identity), must not expire,
  // must sign in through an issuer other than the organization's own
  // identity provider (one that signs in through it has no way in while that
  // provider is down, which is when break-glass is needed), must be active,
  // and must hold the owner role on the organization itself through a
  // manually assigned role binding; a binding on a group beneath the
  // organization, a role other than owner, or a SCIM-provisioned binding does
  // not qualify. An identity already designated is kept without being checked
  // again; remove it and designate it again to have it checked. While it is
  // designated, its owner binding on the organization cannot be removed,
  // downgraded, or moved to another identity: take it off the designation
  // first. At most 5 identities may be designated. While sso_only is on, the
  // last designee cannot be removed: designate a replacement first, or turn
  // sso_only off.
  //
  // Held by organization owners through the built-in role, and by any custom
  // role that carries auth_policies.break_glass.update, which exists so that
  // an organization can delegate exactly this without the sso_only switch.
  // Every change is published as an event. Its body is the resulting policy
  // with break_glass_identities removed: events reach every subscriber an
  // organization editor can register, and the designation is shown only to
  // holders of auth_policies.break_glass.update. The event records that the
  // designation changed; a holder reads the policy for the list.
  rpc SetBreakGlassAdmins(SetBreakGlassAdminsRequest) returns (AuthPolicy) {
    option (google.api.http) = {
      post: "/iam/v2/authPolicies/{uid=**}:setBreakGlassAdmins"
      body: "*"
    };
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_IAM_AUTH_POLICIES_BREAK_GLASS_UPDATE]
      }
    };
    option (chainguard.annotations.events) = {
      type: "dev.chainguard.api.iam.auth_policies.break_glass.updated.v1"
      extensions: ["group"]
      audience: CUSTOMER
    };
    // Never an MCP tool, for the same reason as UpdateAuthPolicy: the
    // break-glass list decides who can still sign in during an identity
    // provider outage.
    option (chainguard.annotations.mcp) = {hidden: true};
  }
}

// AuthPolicy is an organization's authentication policy. There is one per
// organization; it has no identity of its own and is addressed by the
// organization's UIDP.
message AuthPolicy {
  option (google.api.resource) = {
    type: "iam.chainguard.dev/AuthPolicy"
    pattern: "groups/{group}/authPolicy"
    singular: "authPolicy"
    plural: "authPolicies"
  };

  // UIDP of the root organization this policy belongs to. Only root
  // organizations carry a policy; it governs sign-in for every group beneath
  // them. The value MUST be a root organization's UIDP: the UIDP of a group
  // below the root is rejected with INVALID_ARGUMENT and is never resolved to
  // its root, so authorization is always checked against the organization the
  // policy governs and an owner of a sub-group alone cannot read or write it.
  //
  // This is the policy's address, not a server-assigned id: UpdateAuthPolicy
  // takes it from the request body (and the HTTP path), so it is REQUIRED on
  // input rather than OUTPUT_ONLY. Clients that build requests from the field
  // annotations (AIP-203) would otherwise drop it and have nothing to address.
  string uid = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];

  // sso_only, when true, makes the organization's own identity provider the
  // only way to sign in to it: sessions established through any other method
  // (social sign-in, for example) are refused for this organization. Unset or
  // false leaves sign-in unrestricted, which is the behaviour of an
  // organization that has never configured a policy.
  //
  // The field is presence-tracked so that "never configured" and "explicitly
  // off" stay distinguishable, and so that an Update whose mask is implied
  // from the populated fields can carry an explicit false. Readers must use
  // the SsoOnly pointer field directly, never the generated GetSsoOnly()
  // accessor: the accessor returns false for nil and erases that distinction.
  optional bool sso_only = 2 [(google.api.field_behavior) = OPTIONAL];

  // session_duration is how long a sign-in to the organization lasts: the
  // most time a refresh-token session may run from its login before the
  // member must sign in again. A session whose client rotates its refresh
  // tokens (chainctl, MCP clients) stays valid while it is used, up to this
  // length; any other session lasts at most 20 hours. When a session covers
  // several organizations the shortest length wins.
  //
  // Unset means Chainguard's default. A value is from 1 hour to 90 days, in
  // whole seconds; anything else is rejected with INVALID_ARGUMENT, zero
  // included. Naming the field in update_mask with no value clears it back
  // to the default. A shorter length applies at its next refresh to an
  // existing session that stays valid while it is used; any other existing
  // session keeps the expiry it was issued with, at most 20 hours. A read
  // can return zero, which only Chainguard sets: the organization's members
  // get no refresh tokens at all. See
  // docs/customer-platform/2026-10-29-sliding-refresh-lifetime.md in
  // chainguard-dev/mono.
  // protolint:disable:next MAX_LINE_LENGTH
  google.protobuf.Duration session_duration = 3 [(google.api.field_behavior) = OPTIONAL];

  // validations reports, computed when the policy is read, whether the
  // organization's recorded validations are current: whether the identity
  // provider validation still matches the provider as it is configured now,
  // and which currently-designated break-glass identities have one of their
  // own. Currency is a read-time comparison of the recorded fingerprint to the
  // live provider configuration, with no invalidation hooks: a provider change
  // makes a validation stale the moment the policy is next read. It is
  // populated only for a caller holding auth_policies.update at this
  // organization, the capability that acts on it; every other reader gets the
  // policy without it. Whether sso_only may be enabled is not decided here:
  // that is readiness, below, which applies the same predicates and adds
  // the owner-binding check; this view breaks them out per designee.
  ValidationStatus validations = 20 [(google.api.field_behavior) = OUTPUT_ONLY];

  // break_glass_identities lists, by UIDP, the identities designated as the
  // organization's break-glass admins: the owners who keep signing in through
  // a method other than the organization's identity provider while sso_only
  // is on. Empty when none are designated. It is a set: no order is implied,
  // and no identity appears twice. It is changed through SetBreakGlassAdmins
  // only: UpdateAuthPolicy ignores it in an update_mask, as it ignores the
  // readiness fields (an update_mask naming only it has nothing to update
  // and is INVALID_ARGUMENT), and, as with any OUTPUT_ONLY field, ignores it
  // in the body, so a policy read back and sent to UpdateAuthPolicy cannot
  // change the set by accident.
  //
  // It is shown only to a caller holding auth_policies.break_glass.update on
  // the organization; every other reader of the policy gets it empty. The
  // same rule holds for validations.break_glass_designees, which names the
  // same identities: a caller holding auth_policies.update but not
  // auth_policies.break_glass.update gets the validation view with the
  // identity provider's currency and no designees. Every member may learn
  // whether SSO is enforced, but which accounts are the way around it is told
  // only to those who may change that list.
  repeated string break_glass_identities = 4 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = UNORDERED_LIST
  ];

  // Fields from 30 report the organization's readiness to enforce the
  // policy: facts about the organization that decide whether sso_only can be
  // turned on and whether, once on, it takes effect. They are never written.
  //
  // readiness reports whether sso_only may be enabled right now
  // and, when it may not, why. GetAuthPolicy populates it; UpdateAuthPolicy
  // leaves it unset and ignores it on input. Enabling sso_only is refused
  // with FAILED_PRECONDITION (reason SSO_ONLY_NOT_READY, one
  // PreconditionFailure violation per reason) while it reports a blocker,
  // with no way to force it; disabling is never gated. It is still reported
  // while sso_only is on, so an organization can see when it would have to
  // validate again before it could re-enable the policy.
  //
  // Field numbers 10 through 29 are held for the validation and break-glass
  // designation surfaces that land alongside this one; readiness and later
  // read-only state use 30 upward.
  SsoOnlyReadiness readiness = 30 [(google.api.field_behavior) = OUTPUT_ONLY];

  // enforcement_entitled reports whether the organization is enabled for SSO
  // enforcement. While the feature is in early access Chainguard enables it
  // per organization: UpdateAuthPolicy refuses to turn sso_only on for an
  // organization that is not, with FAILED_PRECONDITION and the violation type
  // SSO_ENFORCEMENT_NOT_ENTITLED, and an sso_only that is already on is stored
  // but not enforced at sign-in until the organization is enabled again.
  // Turning sso_only off never needs it. Unset when it could not be
  // determined for this response; a client treats unset as unknown, not as
  // false.
  optional bool enforcement_entitled = 40 [
    // Reported, never written: UpdateAuthPolicy ignores it.
    (google.api.field_behavior) = OUTPUT_ONLY
  ];
}

// ValidationStatus is the read-time currency of an organization's recorded
// validations. Every field is derived when the policy is read; nothing here
// is stored or writable: the whole message is output-only.
message ValidationStatus {
  // idp_validation_current is true when the organization's identity provider
  // has a recorded validation whose fingerprint still matches the provider as
  // it is configured now. False when there has never been one or the
  // configuration has changed since (a stale validation).
  bool idp_validation_current = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // break_glass_designees lists each currently-designated break-glass identity
  // with whether its own non-IdP validation is current. A new designee appears
  // here with validation_current false until it passes its own validation; a
  // designee removed from the policy drops out of the list. Like
  // AuthPolicy.break_glass_identities, it is empty for a caller without
  // auth_policies.break_glass.update on the organization.
  repeated BreakGlassValidationStatus break_glass_designees = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = UNORDERED_LIST
  ];
}

// BreakGlassValidationStatus is one designated break-glass identity's
// validation currency, computed at read time.
message BreakGlassValidationStatus {
  // identity_uidp is the designated break-glass identity.
  string identity_uidp = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // validation_current is true when this identity has a recorded non-IdP
  // validation no older than the maximum age Chainguard applies (90 days by
  // default) that is still bound to the identity as it is configured now:
  // the validation records the identity's claim_match as it was when the
  // sign-in passed, so re-pointing the identity at another issuer, subject
  // or audience means validating again. The same rule readiness applies.
  // Un-designating an identity drops its validation, so a re-designated
  // identity must pass its own again.
  bool validation_current = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// StartValidationRequest is the request message for StartValidation.
message StartValidationRequest {
  // UIDP of the root organization whose provider (or break-glass path) is
  // being validated. Follows the AuthPolicy.uid rule: a sub-group UIDP is
  // INVALID_ARGUMENT.
  string uid = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];

  // kind selects what to validate: the identity provider, or a break-glass
  // identity's non-IdP path.
  ValidationKind kind = 2 [(google.api.field_behavior) = REQUIRED];

  // identity_uidp is the designated break-glass identity to validate. Required
  // for VALIDATION_KIND_BREAK_GLASS, and must be empty for VALIDATION_KIND_IDP.
  // It must be an identity currently designated on this organization's policy.
  string identity_uidp = 3 [(google.api.field_behavior) = OPTIONAL];
}

// GetValidationStatusRequest is the request message for GetValidationStatus.
message GetValidationStatusRequest {
  // UIDP of the root organization the session belongs to. A session is bound
  // to its organization; a mismatch is NOT_FOUND.
  string uid = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];

  // session_id is the id StartValidation returned.
  string session_id = 2 [(google.api.field_behavior) = REQUIRED];
}

// SsoOnlyReadiness is the verdict of the checks that gate enabling
// sso_only: the organization's identity provider has passed validation in
// its current configuration, and a designated break-glass identity has
// proven it can still sign in without it.
message SsoOnlyReadiness {
  // idp_validated_current is true when the organization's identity provider
  // has passed validation and its configuration (issuer, client id, scopes,
  // PKCE setting, token-endpoint auth method, client secret and the secret
  // version it is pinned to) has not changed since.
  bool idp_validated_current = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // break_glass_ready is true when at least one designated break-glass
  // identity has validated its non-SSO sign-in recently enough, can still
  // sign in, holds the owner role on the organization, and has an identity
  // that does not expire.
  bool break_glass_ready = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // reasons lists what blocks enabling sso_only, one per blocker. Empty
  // when both booleans are true.
  repeated Reason reasons = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Reason is one blocker of enabling sso_only.
  message Reason {
    // code is a stable UPPER_SNAKE_CASE identifier for the blocker:
    // IDENTITY_PROVIDER_MISSING, IDP_VALIDATION_MISSING,
    // IDP_VALIDATION_STALE, BREAK_GLASS_NOT_DESIGNATED,
    // BREAK_GLASS_VALIDATION_MISSING, BREAK_GLASS_VALIDATION_EXPIRED,
    // BREAK_GLASS_NOT_OWNER, BREAK_GLASS_EXPIRING, or
    // ORGANIZATION_NOT_VERIFIED. New codes may be added; render message for
    // any code not recognised.
    string code = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

    // message explains the blocker in plain language, fit to show an
    // organization owner as is.
    string message = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  }
}

// Validation is one validation session: its identity, its state, and — once
// it completes — the diagnostics the sign-in produced. It carries no token,
// code, secret or cookie. Every field is output-only.
message Validation {
  // id is the session id.
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // uid is the root organization the session validates.
  string uid = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // kind is what the session validates.
  ValidationKind kind = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // identity_uidp is the designated break-glass identity a BREAK_GLASS session
  // is for; empty for an IDP session.
  string identity_uidp = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // state is where the session is in its life.
  ValidationState state = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // diagnostics is what a completed session's sign-in showed; unset while
  // pending.
  Diagnostics diagnostics = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // open_url is the URL the human opens to run the sign-in. It is set only on
  // the response to StartValidation, never on GetValidationStatus: it carries
  // the session id, which is the only credential the sign-in needs, so it is
  // shown once, to the administrator who started the session (and, for a
  // break-glass session, handed to the designee). It is never recorded in the
  // event StartValidation emits.
  string open_url = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Diagnostics is what a completed session's sign-in showed: not a generic
  // pass/fail, but which step failed, the provider's error code, and the
  // claims the verified token carried.
  message Diagnostics {
    // step is the stage a failed sign-in stopped at; unset for a passed one.
    ValidationStep step = 1;
    // error_code is the provider's own error code when it gave one, or the
    // issuer's rejection reason for the ID token.
    string error_code = 2;
    // message is a short, human-readable description of the outcome.
    string message = 3;
    // issuer is the iss of the verified ID token, when one was verified.
    string issuer = 4;
    // subject is the sub of the verified ID token, when one was verified.
    string subject = 5;
    // email is the token's email claim, when present.
    string email = 6;
    // email_verified is the token's email_verified claim, when present.
    bool email_verified = 7;
    // claims lists the names of the claims the verified ID token carried.
    repeated string claims = 8;
  }
}

// GetAuthPolicyRequest is the request message for GetAuthPolicy.
message GetAuthPolicyRequest {
  // UIDP of the root organization whose policy to retrieve. MUST be a root
  // organization's UIDP: a sub-group UIDP is rejected with INVALID_ARGUMENT
  // and is never resolved to its root.
  string uid = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];
}

// UpdateAuthPolicyRequest is the request message for UpdateAuthPolicy.
message UpdateAuthPolicyRequest {
  // The policy to apply. uid names the root organization it belongs to and
  // follows the AuthPolicy.uid rule: a sub-group UIDP is INVALID_ARGUMENT.
  AuthPolicy auth_policy = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];

  // The list of fields to update. If not provided, an implied
  // field mask is used equivalent to all fields that are populated
  // (have non-default values). sso_only and session_duration are the fields
  // that can be named. "*" is not supported: elsewhere a wildcard is a full
  // replacement that clears whatever the body leaves unset, and on a sign-in
  // control that is a silent clear, so it is rejected with INVALID_ARGUMENT
  // and the caller names the fields instead. uid, validations and the
  // readiness fields may also be named, as a client that echoes a Get
  // response back does; they are never written.
  google.protobuf.FieldMask update_mask = 2 [
    // Optional per AIP-134: omitted, the mask is implied as described above.
    (google.api.field_behavior) = OPTIONAL
  ];
}

// SetBreakGlassAdminsRequest is the request message for SetBreakGlassAdmins.
message SetBreakGlassAdminsRequest {
  // UIDP of the root organization whose policy to change. Follows the
  // AuthPolicy.uid rule: a sub-group UIDP is INVALID_ARGUMENT and is never
  // resolved to its root.
  string uid = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];

  // UIDPs of the identities to designate. This is the entire set after the
  // call: an identity absent from it is no longer designated, and an empty
  // request clears the designation (refused while sso_only is on and the set
  // is not already empty). Each entry must meet the rules on
  // SetBreakGlassAdmins; a request that names an identity twice, or more than
  // 5 identities, is INVALID_ARGUMENT.
  repeated string identities = 2 [(google.api.field_behavior) = OPTIONAL];
}

// ValidationKind is what a validation session proves.
enum ValidationKind {
  // Unset; a request must name a kind.
  VALIDATION_KIND_UNSPECIFIED = 0;
  // The organization's identity provider authenticates a person end to end.
  VALIDATION_KIND_IDP = 1;
  // A designated break-glass identity can sign in without the identity
  // provider.
  VALIDATION_KIND_BREAK_GLASS = 2;
}

// ValidationState is where a validation session is in its life.
//
// (-- api-linter: core::0216::nesting=disabled
//     aip.dev/not-precedent: ValidationKind, ValidationState and
//     ValidationStep are vocabulary shared by StartValidationRequest and the
//     Validation it returns, kept top-level like this API's other enums
//     rather than nested in one message. --)
enum ValidationState {
  // Unset.
  VALIDATION_STATE_UNSPECIFIED = 0;
  // Created; the sign-in has not finished.
  VALIDATION_STATE_PENDING = 1;
  // The sign-in succeeded and its result is recorded.
  VALIDATION_STATE_PASSED = 2;
  // The sign-in failed; diagnostics say where.
  VALIDATION_STATE_FAILED = 3;
  // Never completed before the session's expiry.
  VALIDATION_STATE_EXPIRED = 4;
}

// ValidationStep is the stage of the sign-in a failed session stopped at, so a
// diagnostic names a step rather than a generic pass/fail.
enum ValidationStep {
  // Unset; a passed session names no step.
  VALIDATION_STEP_UNSPECIFIED = 0;
  // Resolving the identity provider and its OIDC discovery document.
  VALIDATION_STEP_DISCOVERY = 1;
  // The provider sent the person back with an error instead of a code.
  VALIDATION_STEP_REDIRECT = 2;
  // Redeeming the authorization code at the provider's token endpoint.
  VALIDATION_STEP_CODE_EXCHANGE = 3;
  // Verifying the ID token the provider returned.
  VALIDATION_STEP_ID_TOKEN = 4;
  // Reading the claims a sign-in needs from the verified token.
  VALIDATION_STEP_CLAIMS = 5;
  // Matching the authenticated person to the designated break-glass identity.
  VALIDATION_STEP_IDENTITY_MATCH = 6;
}
