syntax = "proto3";

package chainguard.platform.iam.v2beta1;

import "annotations/auth.proto";
import "annotations/mcp.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option go_package = "chainguard.dev/sdk/proto/chainguard/platform/iam/v2beta1";
option java_multiple_files = true;
option java_outer_classname = "ScimGroupsProto";
option java_package = "com.chainguard.platform.iam.v2beta1";

// ScimGroupsService reads the SCIM-provisioned groups of an identity provider.
// A group's external_id is the key an ExternalGroupRoleMapping matches on, so
// a caller assigning a role to a listed group passes that field as the
// mapping's external_group_id.
service ScimGroupsService {
  // ListScimGroups returns the SCIM-provisioned groups of an identity
  // provider, with pagination. Each group carries its member count and whether
  // role changes for it are still being applied.
  rpc ListScimGroups(ListScimGroupsRequest) returns (ListScimGroupsResponse) {
    // protolint:disable:next MAX_LINE_LENGTH
    option (google.api.http) = {get: "/iam/v2beta1/identityProviders/{parent=**}/scimGroups"};
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_IAM_SCIM_GROUPS_LIST]
      }
    };
    option (chainguard.annotations.mcp) = {
      description:
        "List the SCIM-provisioned groups of an identity provider, "
        "with member counts. Supports filtering by externalId and "
        "displayName, plus pagination."
      read_only: true
      destructive: false
      idempotent: true
      open_world: false
      // Withheld from the MCP tool surface, like ScimUsers: group names and
      // sizes describe a customer's directory structure, which is not
      // something to place on an AI-agent surface by default. Unaffected: the
      // gRPC and REST APIs, chainctl, and the console; only MCP tool
      // generation skips it.
      hidden: true
    };
  }
}

// ScimGroup is a SCIM-provisioned group of an identity provider. Every field
// is server-owned: SCIM groups are written by the IdP's SCIM connector, not
// through this API, which is read-only. Membership is summarized by
// member_count; the member list is not exposed.
message ScimGroup {
  option (google.api.resource) = {
    type: "iam.chainguard.dev/ScimGroup"
    pattern: "identityProviders/{identity_provider}/scimGroups/{scim_group}"
    singular: "scimGroup"
    plural: "scimGroups"
  };

  // Unique identifier for the SCIM group record (UIDP). Generated by server.
  string uid = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // UID of the identity provider that provisioned this group.
  string identity_provider_uid = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The group's correlation key: the value an ExternalGroupRoleMapping
  // matches on, byte for byte and case-sensitively. When the identity
  // provider sends no externalId (Okta does not), the key is the group's
  // display name at the time it was first pushed and external_id_derived is
  // true; a later rename changes display_name but never this key.
  string external_id = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The SCIM displayName attribute: the group's current name.
  string display_name = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // True when external_id was taken from display_name because the identity
  // provider supplied no externalId.
  bool external_id_derived = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Number of members the identity provider has pushed to the group. It counts
  // provisioned users, including users who have not yet signed in.
  int64 member_count = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // True while role changes for this group are still being applied: a mapping
  // was added or removed, or the group's membership changed more than a single
  // request could apply. A background process clears it, normally within about
  // five minutes. While it is true, members may not yet hold the roles mapped
  // to the group.
  bool needs_full_sync = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the SCIM group record was created.
  // protolint:disable:next MAX_LINE_LENGTH
  google.protobuf.Timestamp create_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the SCIM group record was last updated.
  // protolint:disable:next MAX_LINE_LENGTH
  google.protobuf.Timestamp update_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ListScimGroupsRequest is the request message for ListScimGroups.
message ListScimGroupsRequest {
  // parent is the UID of the identity provider whose SCIM groups to list.
  // SCIM groups are a sub-resource of an identity provider and scope to a
  // single one rather than the group hierarchy, so the parent is required and
  // is the authorization scope (AIP-132 parent).
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];

  // Exact match on the group's external_id (byte for byte).
  string external_id = 2 [(google.api.field_behavior) = OPTIONAL];

  // Exact match on the group's current display name.
  string display_name = 3 [(google.api.field_behavior) = OPTIONAL];

  // Maximum number of results to return per page.
  // Default: 50, Maximum: 200.
  int32 page_size = 10 [(google.api.field_behavior) = OPTIONAL];

  // Page token from a previous List response for pagination.
  // Opaque token with 3-day expiration.
  string page_token = 11 [(google.api.field_behavior) = OPTIONAL];

  // Order results by field. Format: "field [asc|desc]"
  // Default: "uid asc"
  // Note: Changing order_by between pages invalidates the page token.
  string order_by = 12 [(google.api.field_behavior) = OPTIONAL];

  // Number of results to skip before returning.
  // Used for random-access pagination (jumping to arbitrary pages).
  // Can be combined with page_token to skip from cursor position.
  // Must be non-negative.
  int32 skip = 13 [(google.api.field_behavior) = OPTIONAL];
}

// ListScimGroupsResponse is the response message for ListScimGroups.
message ListScimGroupsResponse {
  // SCIM groups matching the filter criteria.
  repeated ScimGroup scim_groups = 1;

  // Token for retrieving the next page of results.
  // Empty if no more results.
  string next_page_token = 2;

  // Total number of results matching the filter.
  // Optional, provided for UI pagination.
  optional int64 total_count = 3;

  // Number of results that were skipped.
  // Accumulates across paginated requests.
  int32 skipped = 4;
}
