syntax = "proto3";

package chainguard.platform.iam.v2beta1;

import "annotations/auth.proto";
import "annotations/mcp.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option go_package = "chainguard.dev/sdk/proto/chainguard/platform/iam/v2beta1";
option java_multiple_files = true;
option java_outer_classname = "ScimUsersProto";
option java_package = "com.chainguard.platform.iam.v2beta1";

// ScimUsersService reads the SCIM-provisioned users of an identity provider.
service ScimUsersService {
  // ListScimUsers returns the SCIM-provisioned users of an identity provider,
  // with pagination. Users provisioned but not yet logged in are included: the
  // provisioning record exists before any Chainguard identity is linked.
  rpc ListScimUsers(ListScimUsersRequest) returns (ListScimUsersResponse) {
    option (google.api.http) = {get: "/iam/v2beta1/identityProviders/{parent=**}/scimUsers"};
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_IAM_SCIM_USERS_LIST]
      }
    };
    option (chainguard.annotations.mcp) = {
      description: "List the SCIM-provisioned users of an identity provider, including users provisioned but not yet logged in. Supports filtering by userName, externalId, and active, plus pagination."
      read_only: true
      destructive: false
      idempotent: true
      open_world: false
    };
  }
}

// ScimUser is a SCIM-provisioned user of an identity provider. Every field is
// server-owned: SCIM users are written by the IdP's SCIM connector, not through
// this API, which is read-only. Name and email attributes are deliberately not
// exposed here (data minimization); use the SCIM protocol endpoint for the full
// user resource.
message ScimUser {
  option (google.api.resource) = {
    type: "iam.chainguard.dev/ScimUser"
    pattern: "identityProviders/{identity_provider}/scimUsers/{scim_user}"
    singular: "scimUser"
    plural: "scimUsers"
  };

  // Unique identifier for the SCIM user record (UIDP). Generated by server.
  string uid = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // UID of the identity provider that provisioned this user.
  string identity_provider_uid = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The SCIM userName attribute, typically an email address.
  string user_name = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The IdP-assigned SCIM externalId, an opaque correlation key. May be empty.
  string external_id = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The SCIM displayName attribute. May be empty.
  string display_name = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The SCIM active flag. When false, the IdP has deprovisioned the user.
  bool active = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // UID of the Chainguard IAM identity this SCIM user is linked to. Empty until
  // the user's first login; its presence therefore indicates the user has
  // authenticated at least once.
  string iam_identity_uid = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the SCIM user record was created.
  google.protobuf.Timestamp create_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the SCIM user record was last updated.
  google.protobuf.Timestamp update_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ListScimUsersRequest is the request message for ListScimUsers.
message ListScimUsersRequest {
  // parent is the UID of the identity provider whose SCIM users to list. SCIM
  // users are a sub-resource of an identity provider and scope to a single one
  // rather than the group hierarchy, so the parent is required and is the
  // authorization scope (AIP-132 parent).
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];

  // Exact match on the SCIM userName (case-insensitive).
  string user_name = 2 [(google.api.field_behavior) = OPTIONAL];

  // Exact match on the IdP-assigned SCIM externalId.
  string external_id = 3 [(google.api.field_behavior) = OPTIONAL];

  // When set, filter by the SCIM active flag.
  optional bool active = 4 [(google.api.field_behavior) = OPTIONAL];

  // Maximum number of results to return per page.
  // Default: 50, Maximum: 200.
  int32 page_size = 10 [(google.api.field_behavior) = OPTIONAL];

  // Page token from a previous List response for pagination.
  // Opaque token with 3-day expiration.
  string page_token = 11 [(google.api.field_behavior) = OPTIONAL];

  // Order results by field. Format: "field [asc|desc]"
  // Default: "uid asc"
  // Note: Changing order_by between pages invalidates the page token.
  string order_by = 12 [(google.api.field_behavior) = OPTIONAL];

  // Number of results to skip before returning.
  // Used for random-access pagination (jumping to arbitrary pages).
  // Can be combined with page_token to skip from cursor position.
  // Must be non-negative.
  int32 skip = 13 [(google.api.field_behavior) = OPTIONAL];
}

// ListScimUsersResponse is the response message for ListScimUsers.
message ListScimUsersResponse {
  // SCIM users matching the filter criteria.
  repeated ScimUser scim_users = 1;

  // Token for retrieving the next page of results.
  // Empty if no more results.
  string next_page_token = 2;

  // Total number of results matching the filter.
  // Optional, provided for UI pagination.
  optional int64 total_count = 3;

  // Number of results that were skipped.
  // Accumulates across paginated requests.
  int32 skipped = 4;
}
