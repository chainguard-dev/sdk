syntax = "proto3";

package chainguard.platform.registry.v2;

import "annotations/auth.proto";
import "annotations/mcp.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/httpbody.proto";
import "google/protobuf/timestamp.proto";

option go_package = "chainguard.dev/sdk/proto/chainguard/platform/registry/v2";
option java_multiple_files = true;
option java_outer_classname = "StigReportsProto";
option java_package = "com.chainguard.platform.registry.v2";

// StigReportsService provides read-only access to per-image STIG reports.
service StigReportsService {
  // GetStigReport returns a structured projection of the STIG report for an
  // image manifest. A NOT_FOUND error means no report exists for the image,
  // which is distinct from a report with zero failures.
  rpc GetStigReport(GetStigReportRequest) returns (StigReport) {
    option (google.api.http) = {get: "/registry/v2/repos/{repo_uid=**}/digests/{digest}/stig"};
    // Both RPCs fetch and verify registry artifacts using the caller's token.
    // Manifest reads resolve the image and bundle manifests; referrer reads
    // discover bundles; blob reads fetch the config and report payloads.
    // Registry read routes also require IAM_GROUPS_LIST, and blob reads require
    // REPO_LIST. These are registry permissions, not manifest-metadata reads.
    // Require the union of bundle and legacy permissions up front: TAG_LIST
    // authorizes resolving the known .att tag for legacy fallback, even though
    // a bundle-backed report does not need that lookup. This keeps the RPC's
    // permission contract independent of the report's storage format.
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [
          CAP_IAM_GROUPS_LIST,
          CAP_REPO_LIST,
          CAP_MANIFEST_LIST,
          CAP_TAG_LIST,
          CAP_REFERRERS_LIST,
          CAP_REPO_BLOBS_GET
        ]
      }
    };
    option (chainguard.annotations.mcp) = {
      description: "Get the STIG compliance report for a container image manifest."
      read_only: true
      destructive: false
      idempotent: true
      open_world: false
    };
  }

  // DownloadStigReport returns the report's canonical XCCDF XML document.
  // Its data is the exact document represented by GetStigReport, identified
  // by StigReport.xccdf_sha256.
  // (-- api-linter: core::0136::response-message-name=disabled
  // api-linter: core::0136::http-uri-suffix=disabled
  // aip.dev/not-precedent: HttpBody preserves the raw XML response, and the
  // resource-local download action intentionally uses the stable :download suffix. --)
  rpc DownloadStigReport(DownloadStigReportRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/registry/v2/repos/{repo_uid=**}/digests/{digest}/stig:download"};
    // Download performs the same verified registry read as GetStigReport;
    // only the response representation differs. Keep its capability union,
    // including TAG_LIST for legacy .att fallback, identical (see above).
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [
          CAP_IAM_GROUPS_LIST,
          CAP_REPO_LIST,
          CAP_MANIFEST_LIST,
          CAP_TAG_LIST,
          CAP_REFERRERS_LIST,
          CAP_REPO_BLOBS_GET
        ]
      }
    };
    option (chainguard.annotations.mcp) = {hidden: true};
  }
}

// GetStigReportRequest is the request message for GetStigReport.
message GetStigReportRequest {
  // UIDP of the repository containing the image.
  string repo_uid = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];

  // Digest of the image manifest whose STIG report to retrieve.
  string digest = 2 [(google.api.field_behavior) = REQUIRED];

  // Architecture to descend into when the digest addresses an OCI index
  // (e.g., "amd64", "arm64"). When empty, the report is read from the
  // manifest as addressed by the digest, with no per-architecture descent.
  string architecture = 3 [(google.api.field_behavior) = OPTIONAL];
}

// DownloadStigReportRequest is the request message for DownloadStigReport.
message DownloadStigReportRequest {
  // UIDP of the repository containing the image.
  string repo_uid = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];

  // Digest of the image manifest whose XCCDF document to download.
  string digest = 2 [(google.api.field_behavior) = REQUIRED];

  // Architecture to descend into when the digest addresses an OCI index
  // (e.g., "amd64", "arm64"). When empty, the document is read from the
  // manifest as addressed by the digest, with no per-architecture descent.
  string architecture = 3 [(google.api.field_behavior) = OPTIONAL];
}

// StigRuleResult is one XCCDF rule result from the scan.
message StigRuleResult {
  // XCCDF rule idref, a DISA vulnerability ID
  // (e.g., "xccdf_mil.disa.stig_rule_SV-263659r982563_rule").
  string rule_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Rule severity as recorded in the scan document
  // (e.g., "high", "medium", "low"); "unknown" when the document did not
  // record one.
  string severity = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The rule's verdict.
  StigResult result = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Human-readable rule title; empty when unavailable.
  string title = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Human-readable rule description; empty when unavailable.
  string description = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // ID of the innermost group enclosing the rule in the scan content
  // (e.g., "xccdf_._group_No_Users") — the content's own categorization.
  // Empty when the scan document does not group the rule.
  string group_id = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Human-readable title of that group; empty when the content defines
  // none (the GPOS benchmark titles none of its groups).
  string group_title = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// StigResultCount is the number of rules with a given result.
message StigResultCount {
  // The rule verdict being counted.
  StigResult result = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Number of rules with that verdict.
  int32 count = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// StigGroupSummary is the per-group rollup of rule results: one entry per
// group in the scan content, so consumers render grouped sections without
// walking every rule result.
message StigGroupSummary {
  // ID of the group, matching StigRuleResult.group_id.
  string group_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Human-readable title of the group; empty when the content defines none.
  string group_title = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Number of the group's rules per result.
  repeated StigResultCount result_counts = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// StigReport is a structured projection of one canonical XCCDF results
// document. Fields the report producer could not record are zero, with an
// explicit marker where "unknown" must stay distinguishable from "empty".
message StigReport {
  // XCCDF profile the scan evaluated.
  string profile_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Scan start time; unset when the scan document did not record it.
  google.protobuf.Timestamp start_time = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Scan end time; unset when the scan document did not record it.
  google.protobuf.Timestamp end_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Scanner image reference that produced the report; absent when the scan
  // generation did not record scanner identity.
  optional string scanner_image = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // SCAP datastream version the scan evaluated against; absent when the scan
  // generation did not record it.
  optional string datastream_version = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  reserved 6;
  reserved "datastream_version_known";

  // Every rule result from the scan, all states preserved.
  repeated StigRuleResult rules = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Number of rules per result.
  repeated StigResultCount result_counts = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Digest of the manifest whose filesystem contents were evaluated. Equal
  // to the requested digest when the image itself was scanned; the assembly
  // origin digest when serving the report for a custom-assembled rebuild.
  string scanned_digest = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Per-group rollup of rule verdicts, one entry per group in the scan
  // content, ordered by group ID. Empty when the scan document does not
  // group its rules.
  repeated StigGroupSummary groups = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Architecture of the manifest whose filesystem contents were evaluated;
  // absent when it cannot be determined for a historical report.
  optional string architecture = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Lowercase hexadecimal SHA-256 digest of the canonical XCCDF XML returned
  // by DownloadStigReport.
  string xccdf_sha256 = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// StigResult is the XCCDF 1.2 rule-result vocabulary: the only states a
// rule verdict may carry.
enum StigResult {
  // Unknown or unset result state.
  STIG_RESULT_UNSPECIFIED = 0;

  // The rule's requirements are met.
  STIG_RESULT_PASS = 1;

  // The rule's requirements are not met. A STIG failure ("finding") is
  // exactly a rule result in this state.
  STIG_RESULT_FAIL = 2;

  // The checking engine hit an error evaluating the rule.
  STIG_RESULT_ERROR = 3;

  // The scanner could not determine the rule's state.
  STIG_RESULT_UNKNOWN = 4;

  // The rule does not apply to the scanned target.
  STIG_RESULT_NOT_APPLICABLE = 5;

  // The rule was not checked (no check defined or checks disabled).
  STIG_RESULT_NOT_CHECKED = 6;

  // The rule was not selected by the evaluated profile.
  STIG_RESULT_NOT_SELECTED = 7;

  // The rule failed but was then fixed by remediation.
  STIG_RESULT_FIXED = 8;

  // The rule is informational only and carries no compliance verdict.
  STIG_RESULT_INFORMATIONAL = 9;
}
