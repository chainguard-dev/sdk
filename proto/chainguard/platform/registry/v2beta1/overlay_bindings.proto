syntax = "proto3";

package chainguard.platform.registry.v2beta1;

import "annotations/auth.proto";
import "annotations/events.proto";
import "annotations/mcp.proto";
import "chainguard/platform/registry/v2beta1/overlays.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "platform/common/v1/uidp.platform.proto";

option go_package = "chainguard.dev/sdk/proto/chainguard/platform/registry/v2beta1";
option java_multiple_files = true;
option java_outer_classname = "OverlayBindingsProto";
option java_package = "com.chainguard.platform.registry.v2beta1";

// OverlayBindingsService manages the bindings that bind overlays to
// repos under tag selectors for tag-scoped Custom Assembly.
//
// Bindings have no name. A binding carries no inline content — content
// always comes from the referenced overlay.
//
// The collection segment is camelCase /overlayBindings/ per the
// RoleBinding → /roleBindings/ precedent, distinct from the /overlays/
// prefix, so these literal routes never collide with the OverlaysService
// {uid=**}/{parent=**} wildcards. Dispatch is pinned by
// Test_Conformance_GatewayRouteOrder.
service OverlayBindingsService {
  // CreateOverlayBinding attaches an existing overlay to one repo under
  // a tag selector. See TagSelector for the supported selector kinds
  // (EXACT, ALL, VARIANT) and the precedence order applied when multiple
  // bindings match a single tag at rebuild time.
  // (-- api-linter: core::0133::http-body=disabled
  //     aip.dev/not-precedent: the request carries a reference + selector,
  //     not an embedded resource, so the body maps the whole request. --)
  rpc CreateOverlayBinding(CreateOverlayBindingRequest) returns (OverlayBinding) {
    option (google.api.http) = {
      post: "/registry/v2beta1/overlayBindings/{parent=**}"
      body: "*"
    };
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_REGISTRY_OVERLAYS_EDIT]
      }
    };
    option (chainguard.annotations.events) = {
      type: "dev.chainguard.api.platform.registry.overlay_binding.created.v1"
      extensions: ["group"]
      audience: CUSTOMER
    };
    option (chainguard.annotations.mcp) = {
      description: "Attach a Custom Assembly overlay to a repo under a tag selector (EXACT, ALL, or VARIANT)."
      read_only: false
      destructive: false
      idempotent: false
      open_world: false
      hidden: true
    };
  }

  // UpdateOverlayBinding updates a binding's tag selector — its only
  // mutable field. The binding's repo and overlay reference are
  // immutable: moving a binding to another repo or re-pointing it at
  // another overlay is delete-and-recreate.
  rpc UpdateOverlayBinding(UpdateOverlayBindingRequest) returns (OverlayBinding) {
    option (google.api.http) = {
      patch: "/registry/v2beta1/overlayBindings/{overlay_binding.uid=**}"
      body: "overlay_binding"
    };
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_REGISTRY_OVERLAYS_EDIT]
      }
    };
    option (chainguard.annotations.events) = {
      type: "dev.chainguard.api.platform.registry.overlay_binding.updated.v1"
      extensions: ["group"]
      audience: CUSTOMER
    };
    option (chainguard.annotations.mcp) = {
      description: "Update a Custom Assembly overlay binding's tag selector."
      read_only: false
      destructive: false
      idempotent: true
      open_world: false
      hidden: true
    };
  }

  // GetOverlayBinding retrieves a single overlay binding by UID.
  rpc GetOverlayBinding(GetOverlayBindingRequest) returns (OverlayBinding) {
    option (google.api.http) = {get: "/registry/v2beta1/overlayBindings/{uid=**}"};
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_REGISTRY_OVERLAYS_LIST]
      }
    };
    option (chainguard.annotations.mcp) = {
      description: "Get a Custom Assembly overlay binding by its UIDP."
      read_only: true
      destructive: false
      idempotent: true
      open_world: false
    };
  }

  // ListOverlayBindings returns overlay bindings based on filter
  // criteria with pagination support.
  rpc ListOverlayBindings(ListOverlayBindingsRequest) returns (ListOverlayBindingsResponse) {
    option (google.api.http) = {get: "/registry/v2beta1/overlayBindings"};
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_REGISTRY_OVERLAYS_LIST]
        unscoped: true
      }
    };
    option (chainguard.annotations.mcp) = {
      description: "List Custom Assembly overlay bindings the caller has access to. Supports scoping to a repo and filtering by overlay."
      read_only: true
      destructive: false
      idempotent: true
      open_world: false
    };
  }

  // DeleteOverlayBinding detaches an overlay from a repo by deleting the
  // binding by UID.
  rpc DeleteOverlayBinding(DeleteOverlayBindingRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/registry/v2beta1/overlayBindings/{uid=**}"};
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_REGISTRY_OVERLAYS_EDIT]
      }
    };
    option (chainguard.annotations.events) = {
      type: "dev.chainguard.api.platform.registry.overlay_binding.deleted.v1"
      extensions: ["group"]
      audience: CUSTOMER
    };
    option (chainguard.annotations.mcp) = {
      description: "Delete a Custom Assembly overlay binding by its UIDP."
      read_only: false
      destructive: true
      idempotent: true
      open_world: false
      hidden: true
    };
  }
}

// OverlayBinding binds one overlay to one repo — or, when all_repos is
// set, to every repo under an organization or folder — under a tag
// selector. Its UID is a UIDP under the resource it attaches to: the
// repo, or the group (the organization's root group, or a folder at any
// depth) for all-repos bindings. Bindings have no name; audit rendering
// comes from the repo (or the all-repos marker), the selector, and the
// expanded overlay content.
message OverlayBinding {
  option (google.api.resource) = {
    type: "registry.chainguard.dev/OverlayBinding"
    pattern: "overlayBindings/{overlay_binding}"
    singular: "overlayBinding"
    plural: "overlayBindings"
  };

  // The unique identifier of this OverlayBinding, a UIDP under the repo
  // it attaches to. Carries iam_scope so requests that embed the resource
  // (UpdateOverlayBinding) resolve their authorization scope from it.
  string uid = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (chainguard.annotations.iam_scope) = true
  ];

  // The UIDP of the repo this binding applies to. Empty when all_repos
  // is set.
  string repo = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The referenced Overlay expanded inline (uid, name, and its config
  // rendered in full) so list responses are audit-complete without
  // a follow-up call.
  // (-- api-linter: core::0122::embedded-resource=disabled
  //     aip.dev/not-precedent: audit-complete rendering embeds the overlay
  //     content in every response by design (CON-2306). --)
  Overlay overlay = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The selector picking which tags on the repo this binding applies to.
  // See TagSelector for the supported kinds and precedence rules.
  TagSelector tag_selector = 5 [(google.api.field_behavior) = REQUIRED];

  // AllRepos marks a binding that applies to every repo under its
  // parent group — the whole organization, or a folder's subtree —
  // current and future, instead of a single repo. Such a binding's UID
  // is a UIDP under that group and `repo` is empty; the tag selector
  // still scopes which tags are customized on each repo. Immutable,
  // like the repo reference: changing a binding's scope is delete plus
  // create.
  bool all_repos = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  reserved 4;
  reserved "tags";
}

// TagSelector selects a set of image tags on a repo. Kind discriminates
// the matching mode; the payload field corresponding to Kind carries the
// match input. Overlay bindings apply in a fixed precedence when multiple
// bindings match a single tag being rebuilt:
//
//   1. The repo's KIND_ALL bindings.
//   2. KIND_VARIANT bindings whose variant_type matches the tag (today
//      only VARIANT_TYPE_DEV, matching the "-dev" tag suffix).
//   3. KIND_EXACT bindings whose `tags` include the tag.
//
// Layers merge later-wins for scalar fields; packages accumulate. A later
// layer is more specific. The Guarded Entrypoint fields
// (guarded_entrypoint, preflight, command_override, fail_mode) state how
// they layer on each field of CustomOverlay. All three layers can stack on
// a single tag (e.g. `latest-dev`). Within one layer, co-matching bindings
// merge commutatively: the bind-time compatibility check (see
// CreateOverlayBindingRequest.tag_selector) guarantees their overlays'
// configs never set the same field to different values.
//
// When a repo's ancestor groups have all-repos bindings (see
// CreateOverlayBindingRequest.all_repos), each scope's three kind
// layers apply BELOW the repo's own, ordered by depth: the
// organization's all-repos ALL, VARIANT, EXACT compose first, then each
// enclosing folder's layers shallowest to deepest, then the repo-scoped
// layers on top — a deeper scope wins scalar conflicts against a
// shallower one and a repo-scoped binding wins against any all-repos
// binding, so all-repos bindings act as organization- or folder-wide
// defaults that narrower scopes can override. Packages still accumulate
// across every layer. Scope layers never co-match each other: the
// bind-time compatibility check runs among the all-repos bindings of
// one group and among the repo's own bindings, never across scopes.
message TagSelector {
  // Kind is the matching mode. See per-kind field expectations below.
  enum Kind {
    // Unspecified is invalid; callers must set a kind explicitly.
    KIND_UNSPECIFIED = 0;
    // KIND_EXACT matches tags whose name appears verbatim in `tags`.
    // `tags` must be non-empty; `variant_type` must be unset.
    KIND_EXACT = 1;
    // KIND_ALL matches every tag on the parent repo. `tags` and
    // `variant_type` must be unset. This is the way to customize a
    // whole repo and the migration target for legacy
    // repo.custom_overlay values.
    KIND_ALL = 2;
    // KIND_VARIANT matches every tag on the parent repo that belongs
    // to the variant named by `variant_type`. `tags` must be unset and
    // `variant_type` must not be VARIANT_TYPE_UNSPECIFIED.
    KIND_VARIANT = 3;
  }

  // VariantType names a tag-naming convention Chainguard image repos
  // follow. Populated only when kind=KIND_VARIANT.
  enum VariantType {
    // Unspecified is invalid; callers must set variant_type explicitly
    // when kind=KIND_VARIANT.
    VARIANT_TYPE_UNSPECIFIED = 0;
    // Dev matches tags whose name ends in "-dev" (e.g. "latest-dev",
    // "1.4-dev"). Development-oriented image variants ship with a
    // superset of packages compared to their prod siblings; a
    // VARIANT_TYPE_DEV binding is the tag-scoped hook for adding
    // dev-only tooling without touching prod tags.
    VARIANT_TYPE_DEV = 1;
  }

  // Kind is the matching mode.
  Kind kind = 1 [(google.api.field_behavior) = REQUIRED];

  // Tags is the list of exact tag names to match. Populated when
  // kind=KIND_EXACT; must be empty for any other kind.
  repeated string tags = 2 [(google.api.field_behavior) = OPTIONAL];

  // VariantType picks the variant to match. Populated when
  // kind=KIND_VARIANT; must be VARIANT_TYPE_UNSPECIFIED for any other
  // kind.
  VariantType variant_type = 3 [(google.api.field_behavior) = OPTIONAL];
}

// CreateOverlayBindingRequest is the request message for attaching an
// overlay to a repo.
//
// (-- api-linter: core::0133::request-resource-field=disabled
//     api-linter: core::0133::request-required-fields=disabled
//     api-linter: core::0133::request-unknown-fields=disabled
//     aip.dev/not-precedent: The binding's content is a reference to an
//     existing Overlay plus a tag selector, not an inline resource: inline
//     content is unrepresentable by design. --)
message CreateOverlayBindingRequest {
  // The UIDP of the repo to attach to — or, when all_repos is set, the
  // UIDP of the group whose repos the binding applies to: the
  // organization's root group for an org-wide binding, or a folder at
  // any depth to scope the binding to that folder's subtree.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];

  // References the overlay to attach: its UIDP, or its name resolved
  // within the repo's organization.
  string overlay = 2 [(google.api.field_behavior) = REQUIRED];

  // The selector picking which tags on the parent repo this binding
  // applies to. See TagSelector for the supported kinds and their
  // per-kind validation rules. Per-repo rules are enforced at create
  // time: at most one binding per (repo, overlay) pair, surfacing as
  // AlreadyExists; beyond that, any number of bindings per selector
  // kind, provided every co-matching pair — two ALL; two VARIANT of one
  // variant type; two EXACT sharing a tag — references overlays whose
  // configs merge commutatively (list fields union; map keys, named
  // entries, and scalars must not be set to different values). A content
  // conflict surfaces as FailedPrecondition whose PreconditionFailure
  // detail carries violation type OVERLAY_BINDING_CONFLICT, naming the
  // conflicting binding id(s) and field paths in the message; earlier
  // releases rejected same-kind overlap as AlreadyExists, so clients
  // branching on that code should branch on the violation type instead.
  // Cross-kind overlap is precedence-layered at rebuild time and never a
  // conflict. Bindings are also rejected on repos whose legacy
  // custom_overlay is set — FailedPrecondition too, but without the
  // OVERLAY_BINDING_CONFLICT violation type — the two customization
  // paths are mutually exclusive until the legacy value is migrated to
  // an ALL binding.
  TagSelector tag_selector = 4 [(google.api.field_behavior) = REQUIRED];

  // AllRepos, when true, attaches the overlay to every repo under the
  // group named by `parent` — including repos created after the binding
  // exists — instead of a single repo. `parent` must then be a group
  // UIDP: the organization's root group (the binding covers the whole
  // org) or a folder at any depth (the binding covers the folder's
  // subtree). A parent that is not a live group — a repo UIDP, a
  // deleted folder, a typo — fails InvalidArgument: the API confirms
  // the group against the IAM store before creating. The caller's
  // authorization on parent is settled by the request's iam_scope
  // authorization.
  // The tag selector still scopes which tags are customized on each
  // repo. At create time an all-repos binding is checked against the
  // other all-repos bindings of the SAME group only — at most one
  // all-repos binding per (group, overlay) pair (AlreadyExists), and
  // co-matching selectors must reference overlays whose configs merge
  // commutatively (FailedPrecondition) — never against individual
  // repos' bindings or other scopes' all-repos bindings: scopes compose
  // in depth-ordered precedence layers at rebuild time (see
  // TagSelector). Repos whose legacy custom_overlay is set keep the
  // legacy behavior and skip all-repos bindings at rebuild time.
  bool all_repos = 5 [(google.api.field_behavior) = OPTIONAL];

  reserved 3;
  reserved "tags";
}

// UpdateOverlayBindingRequest is the request message for
// UpdateOverlayBinding.
message UpdateOverlayBindingRequest {
  // The binding to update. The uid identifies the binding; tag_selector
  // is its only mutable field. The repo, the all_repos scope, and the
  // overlay reference are immutable (OUTPUT_ONLY): moving or re-scoping
  // a binding is delete on the old scope plus create on the new one.
  OverlayBinding overlay_binding = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];

  // The list of fields to update. If not provided, an implied
  // field mask is used equivalent to all fields that are populated
  // (have non-default values). "tag_selector" is the only accepted
  // path; any other path fails with InvalidArgument.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

// GetOverlayBindingRequest is the request message for getting a single
// OverlayBinding by UID.
message GetOverlayBindingRequest {
  // UID of the overlay binding to retrieve.
  string uid = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];
}

// DeleteOverlayBindingRequest is the request message for deleting a
// single OverlayBinding by UID.
message DeleteOverlayBindingRequest {
  // UID of the overlay binding to delete.
  string uid = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];
}

// ListOverlayBindingsRequest provides filtering options for
// ListOverlayBindings.
message ListOverlayBindingsRequest {
  // Filters records based on their position in the group hierarchy.
  // Bindings are children of their repo, so children_of a repo UIDP
  // lists one repo's bindings. All-repos bindings are children of the
  // organization, so children_of the org's root UIDP lists them.
  chainguard.platform.common.UIDPFilter uidp = 1 [(google.api.field_behavior) = OPTIONAL];

  // If set, only returns bindings referencing this overlay UID.
  string overlay = 2 [(google.api.field_behavior) = OPTIONAL];

  // (-- Pagination Fields --)

  // Maximum number of results to return per page.
  // Default: 50, Maximum: 200.
  int32 page_size = 10 [(google.api.field_behavior) = OPTIONAL];

  // Page token from a previous List response for pagination.
  // Opaque token with 3-day expiration.
  string page_token = 11 [(google.api.field_behavior) = OPTIONAL];

  // Order results by field. Format: "field [asc|desc]"
  // Default: "uid asc"
  // Note: Changing order_by between pages invalidates the page token.
  string order_by = 12 [(google.api.field_behavior) = OPTIONAL];

  // Number of results to skip before returning.
  // Used for random-access pagination (jumping to arbitrary pages).
  // Can be combined with page_token to skip from cursor position.
  // Must be non-negative.
  int32 skip = 13 [(google.api.field_behavior) = OPTIONAL];
}

// ListOverlayBindingsResponse is the response to ListOverlayBindings,
// with pagination.
message ListOverlayBindingsResponse {
  // Overlay bindings matching the filter criteria.
  repeated OverlayBinding overlay_bindings = 1;

  // Token for retrieving the next page of results.
  // Empty if no more results.
  string next_page_token = 2;

  // Total number of results matching the filter.
  // Optional, provided for UI pagination.
  optional int64 total_count = 3;

  // Number of results that were skipped.
  // Accumulates across paginated requests.
  int32 skipped = 4;
}
