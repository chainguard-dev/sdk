// RequestGroupState selects drafts or submitted groups when listing.
enum RequestGroupState {
  // Unspecified: the server applies its default, which is submitted.
  REQUEST_GROUP_STATE_UNSPECIFIED = 0;

  // Not yet submitted. Never triggers a build.
  REQUEST_GROUP_STATE_DRAFT = 1;

  // Submitted by the customer.
  REQUEST_GROUP_STATE_SUBMITTED = 2;

  // Both drafts and submitted groups.
  REQUEST_GROUP_STATE_ALL = 3;
}

// RequestGroupStatus is the group's coverage-processing status.
enum RequestGroupStatus {
  // Unspecified status.
  REQUEST_GROUP_STATUS_UNSPECIFIED = 0;

  // Input accepted; requirements still being parsed and persisted.
  REQUEST_GROUP_STATUS_CREATING = 1;

  // Queued for a coverage check.
  REQUEST_GROUP_STATUS_PENDING = 2;

  // Coverage check running.
  REQUEST_GROUP_STATUS_PROCESSING = 3;

  // Every item reached a settled availability.
  REQUEST_GROUP_STATUS_COMPLETED = 4;

  // The coverage check failed and will be retried.
  REQUEST_GROUP_STATUS_FAILED = 5;

  // Deleted by a customer or an admin.
  REQUEST_GROUP_STATUS_CANCELED = 6;

  // A draft reclaimed after sitting idle. Distinct from CANCELED, which is a
  // deliberate act.
  REQUEST_GROUP_STATUS_EXPIRED = 7;
}

// Availability is the normalized build status of one requested version.
//
// It never depends on whether the organization has upstream fallback enabled.
// "Can Chainguard build this?" is a different question from "am I pulling
// upstream in the meantime?", so an org that turned upstream off sees identical
// values and the identical requestable set. The toggle is reported separately on
// RequestGroup.org_upstream_enabled, for phrasing only.
enum Availability {
  // Unspecified availability.
  AVAILABILITY_UNSPECIFIED = 0;

  // Chainguard has built this exact version.
  AVAILABILITY_BUILT = 1;

  // Not built, and requestable. The upgrade field may name a newer built version.
  AVAILABILITY_CAN_BE_REQUESTED = 2;

  // On the malware block list. Still requestable, but the build is held until the
  // block is withdrawn — a false positive must not silently discard a legitimate
  // request, and the daily refresh picks the item up once it clears.
  AVAILABILITY_BLOCKED = 3;

  // The version does not exist on the upstream registry, so there is nothing to
  // build. The only true dead end.
  AVAILABILITY_NOT_FOUND_UPSTREAM = 4;

  // Chainguard will not build this version for policy reasons, such as licence or
  // end-of-life.
  AVAILABILITY_WONT_BUILD = 5;

  // The requirement is not a parseable pinned package and version. Terminal and
  // not retried; the customer must fix or remove the line.
  AVAILABILITY_INVALID_REQUIREMENT = 6;

  // A build has been triggered and is running.
  AVAILABILITY_BUILDING = 7;

  // A build ran and failed. Retried automatically.
  AVAILABILITY_BUILD_FAILED = 8;
}

// CVERemediationStatus is the aggregate remediation status of one version.
//
// Fully orthogonal to Availability, and populated only for an opted-in group.
enum CVERemediationStatus {
  // Unspecified remediation status.
  CVE_REMEDIATION_STATUS_UNSPECIFIED = 0;

  // Queued for review, or not yet resolvable to a version we hold. Distinct from
  // NO_HIGH_CRITICAL_CVES: this means no answer yet, not a clean answer.
  CVE_REMEDIATION_STATUS_SCAN_QUEUED = 1;

  // Cross-referenced against advisory data, and no High or Critical CVEs apply.
  CVE_REMEDIATION_STATUS_NO_HIGH_CRITICAL_CVES = 2;

  // CVEs identified; remediation not started.
  CVE_REMEDIATION_STATUS_REVIEWING = 3;

  // Remediation underway on at least one CVE.
  CVE_REMEDIATION_STATUS_IN_PROGRESS = 4;

  // Remediation finished with at least one CVE remediated.
  CVE_REMEDIATION_STATUS_COMPLETE = 5;

  // Every CVE on this version was ruled out of scope. The decision on
  // CVERemediation says which kind of out-of-scope.
  CVE_REMEDIATION_STATUS_WONT_REMEDIATE = 6;
}

// CVERemediationDecision is what a Chainguard reviewer decided about a CVE,
// stated in customer terms.
//
// It exists because WONT_REMEDIATE covers judgements that mean opposite things
// to the reader: "this does not affect the build you pull" is reassurance, while
// "we are not fixing this" is a risk to weigh. Collapsing both into one status
// reports the reassuring case as the alarming one.
//
// A value appears only where a reviewer recorded a judgement. Automation may
// retire a decision whose premise no longer holds, but never authors one, so a
// value here always reflects a person's call.
enum CVERemediationDecision {
  // No reviewer decision to report. Either nobody has decided yet, or the row
  // was settled by automation. Not an error, and the common case.
  CVE_REMEDIATION_DECISION_UNSPECIFIED = 0;

  // The Chainguard build is not affected, so there is nothing to remediate and
  // nothing for the caller to act on.
  //
  // Reported only when it holds for EVERY CVE on the version. A version with one
  // unaffected CVE and one deliberately unfixed CVE is not NOT_AFFECTED: the
  // unanimity requirement is deliberate, because wrongly reassuring a caller
  // hides real exposure, while wrongly alarming them only costs an
  // investigation.
  CVE_REMEDIATION_DECISION_NOT_AFFECTED = 1;

  // Chainguard does not plan to fix this, and there is no upgrade to move to.
  // The caller carries the risk and may want to weigh it.
  CVE_REMEDIATION_DECISION_NO_FIX_PLANNED = 2;

  // Chainguard does not plan to publish a remediated build of the pinned
  // version, because moving to a later version resolves it.
  CVE_REMEDIATION_DECISION_UPGRADE_AVAILABLE = 3;
}

// InputFormat is how a submitted input is parsed.
//
// Every accepted format is already pinned, so parsing happens in-process. Formats
// needing a build tool to resolve versions — pom.xml, build.gradle, unpinned
// requirements.txt — are deliberately absent.
enum InputFormat {
  // Unspecified format.
  INPUT_FORMAT_UNSPECIFIED = 0;

  // A pinned requirements.txt.
  INPUT_FORMAT_REQUIREMENTS_TXT = 1;

  // A poetry.lock file.
  INPUT_FORMAT_POETRY_LOCK = 2;

  // A uv.lock file.
  INPUT_FORMAT_UV_LOCK = 3;

  // A newline-separated list of Java coordinates, "group:artifact:version". The
  // extended "group:artifact[:packaging[:classifier]]:version" form is accepted.
  // Already fully resolved, so no build tool runs.
  INPUT_FORMAT_MAVEN_GAV_LIST = 4;
}

// RequestSource records how a group came to exist.
enum RequestSource {
  // Unspecified source.
  REQUEST_SOURCE_UNSPECIFIED = 0;

  // Uploaded through the console.
  REQUEST_SOURCE_MANUAL_UPLOAD = 1;

  // Created through the API.
  REQUEST_SOURCE_API = 2;

  // Created from observed upstream-fallback traffic.
  REQUEST_SOURCE_UPSTREAM_FALLBACK = 3;

  // Created by the Gardener GitHub app.
  REQUEST_SOURCE_GARDENER_GITHUB = 4;

  // Predates source tracking.
  REQUEST_SOURCE_LEGACY = 5;
}

// RequestedLibraryBuildStatus is the build ladder across a library's requested versions.
//
// A version counts as buildable unless it is WONT_BUILD or NOT_FOUND_UPSTREAM,
// so versions Chainguard will never build do not hold a library short of
// COMPLETE.
enum RequestedLibraryBuildStatus {
  // Unspecified build status.
  REQUESTED_LIBRARY_BUILD_STATUS_UNSPECIFIED = 0;

  // Submitted, but no build activity on any version yet.
  REQUESTED_LIBRARY_BUILD_STATUS_REVIEWING = 1;

  // Build activity has started on at least one version and at least one buildable
  // version is not built yet. A version that is already built, or that failed and
  // will be retried, counts as activity.
  REQUESTED_LIBRARY_BUILD_STATUS_IN_PROGRESS = 2;

  // Every buildable requested version is built, with at least one built and
  // nothing still building or failed.
  REQUESTED_LIBRARY_BUILD_STATUS_COMPLETE = 3;

  // No requested version is buildable.
  REQUESTED_LIBRARY_BUILD_STATUS_WONT_BUILD = 4;
}

// RequestedLibraryCVEStatus is the remediation ladder across a library's versions.
//
// Only meaningful where a contributing group opted in.
enum RequestedLibraryCVEStatus {
  // Unspecified remediation status.
  REQUESTED_LIBRARY_CVE_STATUS_UNSPECIFIED = 0;

  // Opted in, but no version is past being queued, or a cross-referenced version
  // still has untriaged CVEs. A library with even one un-cross-referenced version
  // is REVIEWING rather than clean: the alternative would report an unfinished
  // check as a clean bill of health.
  REQUESTED_LIBRARY_CVE_STATUS_REVIEWING = 1;

  // Remediation underway on at least one version.
  REQUESTED_LIBRARY_CVE_STATUS_IN_PROGRESS = 2;

  // Every version came back cross-referenced and clean, and none is still queued.
  REQUESTED_LIBRARY_CVE_STATUS_NO_HIGH_CRITICAL_CVES = 3;

  // Remediation finished with at least one CVE remediated and nothing in progress.
  REQUESTED_LIBRARY_CVE_STATUS_COMPLETE = 4;

  // Every CVE across the library was ruled out of scope.
  REQUESTED_LIBRARY_CVE_STATUS_WONT_REMEDIATE = 5;
}
