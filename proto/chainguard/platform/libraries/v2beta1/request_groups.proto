// RequestedLibrary aggregates an organization's requests for one library.
//
// Both statuses are computed at read time from the underlying item states rather
// than stored, so they cannot drift from the items they summarise.
message RequestedLibrary {
  option (google.api.resource) = {
    type: "libraries.chainguard.dev/RequestedLibrary"
    pattern: "requestedLibraries/{requested_library}"
    singular: "requestedLibrary"
    plural: "requestedLibraries"
  };

  // Canonical package name: the PEP 503 name for Python, "group:artifact" for
  // Java. With ecosystem, this identifies the library.
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The ecosystem the library belongs to. The dashboard renders one table per
  // ecosystem.
  Ecosystem ecosystem = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Build status across the library's requested versions.
  RequestedLibraryBuildStatus build_status = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // CVE-remediation status across the library's requested versions. Populated
  // only where a contributing group is opted in.
  RequestedLibraryCVEStatus cve_status = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How many distinct versions of this library the organization has requested.
  int32 requested_version_count = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How many of those versions Chainguard has built.
  int32 built_version_count = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Total CVEs remediated across the library's versions.
  int32 remediated_cve_count = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How the requests for this library arrived, deduplicated.
  repeated RequestSource sources = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The request groups that asked for this library. Capped, because a library
  // requested by many groups must not make this row unbounded; see
  // contributing_group_count for the true total.
  repeated RequestGroupRef contributing_groups = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How many groups asked for this library, including any beyond the capped list
  // above.
  int32 contributing_group_count = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When this library was most recently requested.
  google.protobuf.Timestamp last_request_time = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// RequestGroupRef points at a group that contributed a request.
message RequestGroupRef {
  // The group's unique identifier.
  string uid = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The group's customer-supplied name.
  string name = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// RequestedLibraryVersion is one requested version of a library, with the detail behind
// the library-level summary.
message RequestedLibraryVersion {
  // The version string as requested.
  string version = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Build availability of this version.
  Availability availability = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Reason accompanying availability, passed through verbatim.
  string availability_reason = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // A newer built version to move to, when one exists.
  Upgrade upgrade = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // CVE-remediation status of this version.
  CVERemediation cve_remediation = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How the requests for this version arrived, deduplicated.
  repeated RequestSource sources = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The IAM identities that requested this version. Only uids are stored; resolve
  // them through IAM to display names.
  repeated string requested_by = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The groups that asked for this version.
  repeated RequestGroupRef contributing_groups = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When this version was most recently requested.
  google.protobuf.Timestamp last_request_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
}

