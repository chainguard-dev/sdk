syntax = "proto3";

package chainguard.platform.libraries.v2beta1;

import "annotations/auth.proto";
import "annotations/mcp.proto";
// Ecosystem is shared with the artifacts service rather than redeclared, so a
// requested Python library and a Python artifact name the same ecosystem value.
import "chainguard/platform/libraries/v2beta1/artifacts.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option go_package = "chainguard.dev/sdk/proto/chainguard/platform/libraries/v2beta1";
option java_multiple_files = true;
option java_outer_classname = "RequestGroupsProto";
option java_package = "com.chainguard.platform.libraries.v2beta1";

// RequestGroupsService reports the library versions an organization tracks:
// the versions it asked Chainguard for, and, where usage tracking is enabled,
// the versions it pulls through the Chainguard Repository.
//
// Customers do not upload requests through this service. Explicit requests
// come through Chainguard staff, over the internal /v1 routes.
service RequestGroupsService {
  // ListRequestedLibraries returns one row per library the organization
  // tracks: versions it asked for, and versions it pulls through the
  // Chainguard Repository. The source field chooses between them. Where usage
  // tracking is not enabled, only requested versions are tracked.
  //
  // A customer asks "where is snakeyaml" rather than "what was in the lockfile
  // I uploaded in March", so this is per library. It reports only libraries
  // the organization tracks, not every library it can reach.
  //
  // The tree is paged one level at a time rather than nested: this RPC returns
  // bounded per-library summaries, and one library's versions are fetched by
  // ListRequestedLibraryVersions on expand. A nested response could not keep both
  // the page size and the page token one-dimensional.
  rpc ListRequestedLibraries(ListRequestedLibrariesRequest) returns (ListRequestedLibrariesResponse) {
    option (google.api.http) = {get: "/libraries/v2beta1/requestedLibraries"};
    option (chainguard.annotations.iam) = {
      enabled: {capabilities: [CAP_LIBRARIES_REQUEST_GROUPS_LIST]}
    };
    option (chainguard.annotations.mcp) = {
      description:
        "List the libraries an organization tracks (requested, or pulled "
        "where usage tracking is enabled), with per-library build status "
        "and CVE-remediation status."
      read_only: true
      destructive: false
      idempotent: true
      open_world: false
    };
  }

  // ListRequestedLibraryVersions returns the tracked versions of one library:
  // the versions it asked for, and, where usage tracking is enabled, the
  // versions it pulls. The source field chooses between them.
  //
  // A requested library is a computed aggregate identified by name and ecosystem
  // rather than a stored resource with a uid, so this reads as a custom method on
  // the collection instead of a sub-resource of an addressable parent.
  rpc ListRequestedLibraryVersions(ListRequestedLibraryVersionsRequest) returns (ListRequestedLibraryVersionsResponse) {
    option (google.api.http) = {get: "/libraries/v2beta1/requestedLibraries:listRequestedLibraryVersions"};
    option (chainguard.annotations.iam) = {
      enabled: {capabilities: [CAP_LIBRARIES_REQUEST_GROUPS_LIST]}
    };
    option (chainguard.annotations.mcp) = {
      description:
        "List the tracked versions of one library, with per-version build "
        "availability, CVE-remediation status, who requested each, and when "
        "it was last pulled."
      read_only: true
      destructive: false
      idempotent: true
      open_world: false
    };
  }

  // ListRequestedLibraryVersionCves is the click-through detail behind one
  // version's aggregate CVE status: the individual CVEs, what Chainguard
  // decided about each, and which release fixes it.
  //
  // The aggregate on RequestedLibraryVersion collapses this list to a status
  // and two counts, which is lossy by construction. This is the authoritative
  // answer for any single CVE.
  //
  // The signature is over the 80-character limit and cannot be brought under
  // it: buf format puts an rpc signature on one line, and the method name plus
  // its request and response leave 14 characters for a name that has to say
  // which resource it lists. Disabled for this line only, rather than for the
  // file or the rule, so every other line still has to fit.
  // protolint:disable:next MAX_LINE_LENGTH
  rpc ListRequestedLibraryVersionCves(ListRequestedLibraryVersionCvesRequest) returns (ListRequestedLibraryVersionCvesResponse) {
    option (google.api.http) = {
      get:
        "/libraries/v2beta1/requestedLibraries"
        ":listRequestedLibraryVersionCves"
    };
    option (chainguard.annotations.iam) = {
      enabled: {capabilities: [CAP_LIBRARIES_REQUEST_GROUPS_LIST]}
    };
    option (chainguard.annotations.mcp) = {
      description:
        "List the individual CVEs recorded against one requested library "
        "version, with severity, KEV status, per-CVE remediation state, and "
        "the Chainguard release that fixes each."
      read_only: true
      destructive: false
      idempotent: true
      open_world: false
    };
  }
}

// Upgrade names newer built versions of the same package.
//
// Ordering is ecosystem-aware — PEP 440 for Python, Maven's own ordering for Java
// — because lexical ordering places 2.10 below 2.9 and would suggest a downgrade.
// Neither ecosystem guarantees semver, so no claim is made that an upgrade is
// compatible; only that it is newer and built.
//
// Only final releases are offered: never a pre-release, and never a
// Chainguard remediated release, which is offered as the exact version
// requested rather than as a version to move to. A Java version keeps the
// variant the request names, such as "-jre" or ".jre8". For a Python request
// that names a platform, only versions with a wheel for it are offered.
message Upgrade {
  // The lowest version that qualifies: the minimal move.
  string closest_version = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The highest qualifying version found. Equal to closest_version when only
  // one version qualifies; for a Python request that names a platform, also
  // when none of the newest versions checked has a matching wheel.
  string latest_version = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// CVERemediation is the remediation state of one requested version, aggregated
// across the CVEs found against it.
message CVERemediation {
  // Aggregate remediation status for this version.
  CVERemediationStatus status = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How many High and Critical CVEs on this version are remediated. Meaningful
  // regardless of the aggregate status, since a version can be partly
  // remediated. Scoped like cve_count below.
  int32 remediated_count = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How many High and Critical CVEs were found against this version.
  //
  // Scoped to match the vocabulary around it: cve_status reports
  // NO_HIGH_CRITICAL_CVES, so this counts the findings that claim speaks to.
  // Medium and low findings are excluded, as are findings for which no CVSS
  // score was recorded. The per-CVE read
  // (ListRequestedLibraryVersionCVEs) is NOT scoped and lists every finding,
  // so it can return more CVEs than this counts.
  int32 cve_count = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // 4 held a repeated string of internal reviewer notes. Not recycled: a field
  // number is wire format, and a client generated from an earlier copy of this
  // file would decode a new field 4 as the old one.
  reserved 4;

  // The reviewer's decision, where a reviewer recorded one. UNSPECIFIED
  // otherwise, which is the common case: most rows are settled by automation and
  // carry no human judgement to report.
  //
  // Derived server-side from an internal triage vocabulary rather than passed
  // through, so triage can be renamed without breaking this contract.
  //
  // Lossy by construction: decisions are recorded per CVE and this field is per
  // version, so a version whose CVEs were decided differently collapses to one
  // value. NOT_AFFECTED is reported only when it holds for every CVE on the
  // version. Read the per-CVE detail for the answer on any single CVE.
  CVERemediationDecision decision = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The upstream release to move this version to in order to clear its
  // outstanding CVEs, e.g. "3.9.2".
  //
  // Outstanding means every CVE counted by cve_count except the ones a
  // reviewer ruled out of scope. An EXCLUDED CVE is not asking to be cleared
  // and commonly records no upstream fix at all, so requiring one would
  // withhold a real target on the strength of a finding we have already said
  // does not apply. The per-CVE read says which were ruled out.
  //
  // Populated only alongside status FIX_AVAILABLE. On any other rung naming a
  // target would overstate what the upgrade achieves: REVIEWING covers a
  // version with one CVE that has no fix beside another that does, so no
  // release clears it, and COMPLETE and WONT_REMEDIATE have nothing to move
  // to.
  //
  // The greatest of the upstream_fix_version values those CVEs record, ordered
  // by the ecosystem's own version semantics. Greatest rather than nearest,
  // because the target has to clear all of them at once -- a release that
  // carries the first CVE's fix but predates the second's leaves the version
  // vulnerable while reading as resolved.
  //
  // Always strictly newer than the version asked about. A recorded fix is not
  // guaranteed to be ahead of it, so one at or below the pinned version names
  // nothing here: moving there is not an upgrade, and it would not clear the
  // CVEs.
  //
  // Empty wherever that cannot be established, which is not rare and never
  // means "no fix exists": an outstanding CVE records no upstream fix, the
  // greatest recorded fix is not above the version asked about, the ecosystem
  // has no implemented version ordering, a recorded version does not parse, or
  // the target did not clear the malware gate below. A target the gate blocked
  // is in blocked_fix_version instead. Read upstream_fix_version on the
  // per-CVE detail for what is known per CVE.
  //
  // Checked against the malware block list at read time, fail-closed: a
  // non-empty value has passed the gate and may be recommended. A target here
  // is an upstream release, so it can carry malware or sit on the retroactive
  // block list -- unlike remediated_version on the per-CVE detail, which is
  // always a Chainguard build. A check that errors withholds it too: a gate
  // that cannot be consulted must not read as clearance to upgrade.
  string fix_version = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The target fix_version would have named, when the malware gate blocked it:
  // the release is on the block list or carries malware. A fix exists at that
  // version, and it must not be installed. Reported so that a blocked fix does
  // not read as no fix, and kept out of fix_version so that a client reading
  // only fix_version never recommends it.
  //
  // At most one of fix_version and blocked_fix_version is set, and only
  // alongside status FIX_AVAILABLE. Both are empty when the gate could not
  // answer (not scanned yet, unreachable, out of time): an unvetted target is
  // withheld on this rung, and the per-CVE detail still names it.
  string blocked_fix_version = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// RequestedLibrary aggregates an organization's requests for one library.
//
// Both statuses are computed at read time from the underlying item states rather
// than stored, so they cannot drift from the items they summarise.
message RequestedLibrary {
  option (google.api.resource) = {
    type: "libraries.chainguard.dev/RequestedLibrary"
    pattern: "requestedLibraries/{requested_library}"
    singular: "requestedLibrary"
    plural: "requestedLibraries"
  };

  // Canonical package name: the PEP 503 name for Python, "group:artifact" for
  // Java. With ecosystem, this identifies the library.
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The ecosystem the library belongs to. The dashboard renders one table per
  // ecosystem.
  Ecosystem ecosystem = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Build status across the library's requested versions.
  RequestedLibraryBuildStatus build_status = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // CVE-remediation status for this library, aggregated across the buildable
  // versions whose request groups opted into CVE remediation.
  //
  // That scope is narrower than the library's requested versions, and the
  // difference matters. Opt-in is a property of a request group, so an
  // organization with one opted-in group and one that is not has versions of
  // the same library inside and outside this answer. A version nobody asked us
  // to scan is not reported here, and does not hold the status back: every
  // rung below is a claim about the versions in scope, not about every version
  // the organization pins.
  //
  // A version that build_status counts as not buildable is outside the scope
  // too. Chainguard remediates by shipping a build, so a version it will not
  // build is never remediated, and it does not hold the status at REVIEWING.
  //
  // UNSPECIFIED where no version is in scope, which reads as "not computed" --
  // there is no scan to report, and any rung would claim one. That is the case
  // where no contributing group opted in, and also where every opted-in
  // version is not buildable. Tell the two apart by build_status: WONT_BUILD
  // means the second.
  //
  // Where usage tracking is enabled there is no opt-in: the scope is every
  // buildable tracked version that the request's source admits, and
  // UNSPECIFIED means none of them is buildable.
  RequestedLibraryCVEStatus cve_status = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How many distinct versions of this library the organization has requested.
  // Where usage tracking is enabled, how many it tracks (requested or pulled)
  // among those the request's source admits.
  int32 requested_version_count = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How many of those versions Chainguard has built.
  int32 built_version_count = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Total High and Critical CVEs remediated across the versions in cve_status's
  // scope -- the ones whose request groups opted in, not every requested
  // version. Severity-scoped like CVERemediation.cve_count: medium and low
  // findings are excluded, as are findings with no recorded CVSS score. Where
  // usage tracking is enabled, the scope is cve_status's: every buildable
  // tracked version the source admits.
  //
  // Reported whatever cve_status says, because a library part-way through
  // remediation has fixed CVEs worth naming: the status answers whether it is
  // finished and this answers what has been done.
  int32 remediated_cve_count = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How the requests for this library arrived, deduplicated.
  repeated RequestSource sources = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The request groups that asked for this library. Capped, because a library
  // requested by many groups must not make this row unbounded; see
  // contributing_group_count for the true total.
  repeated RequestGroupRef contributing_groups = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How many groups asked for this library, including any beyond the capped list
  // above.
  int32 contributing_group_count = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When this library was most recently requested. Unset where the
  // organization tracks the library only because it pulls it.
  google.protobuf.Timestamp last_request_time = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The earliest pull of any of this library's tracked versions through the
  // Chainguard Repository. Unset where none was pulled.
  google.protobuf.Timestamp first_use_time = 12
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // The latest pull of any of this library's tracked versions. Unset where
  // none was pulled.
  google.protobuf.Timestamp last_use_time = 13
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// RequestGroupRef points at a group that contributed a request.
message RequestGroupRef {
  // The group's unique identifier.
  string uid = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The group's customer-supplied name.
  string name = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// RequestedLibraryVersion is one requested version of a library, with the detail behind
// the library-level summary.
message RequestedLibraryVersion {
  // The version string as requested.
  string version = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Build availability of this version.
  Availability availability = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Reason accompanying availability, written by Chainguard. It is never an
  // internal note.
  string availability_reason = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // A newer built version to move to, when one exists and this version is
  // requestable.
  Upgrade upgrade = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // CVE-remediation status of this version. Absent when no contributing group
  // opted in, and when availability is WONT_BUILD or NOT_FOUND_UPSTREAM:
  // Chainguard remediates by shipping a build, so a version it will not build
  // is never remediated. Where usage tracking is enabled there is no opt-in,
  // so it is absent only for those two availabilities.
  CVERemediation cve_remediation = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How the requests for this version arrived, deduplicated.
  repeated RequestSource sources = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The IAM identities that requested this version. Only uids are stored; resolve
  // them through IAM to display names.
  repeated string requested_by = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The groups that asked for this version.
  repeated RequestGroupRef contributing_groups = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When this version was most recently requested. Unset where the
  // organization tracks the version only because it pulls it.
  google.protobuf.Timestamp last_request_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When this version's answer last changed. A re-check that reaches the same
  // answer does not move it. It can move with no visible change: the answer
  // that follows a forced refresh is recorded even when it repeats the earlier
  // one, and so is a move between two answers that report the same
  // availability.
  //
  // This is last_request_time while the version is pending, while it holds an
  // answer Chainguard retries automatically, such as CAN_BE_REQUESTED or
  // BUILD_FAILED, and where no change has been recorded: every version whose
  // answer has not changed since Chainguard began recording changes. BLOCKED
  // and WONT_BUILD are checked again too, but keep the time they were reached.
  //
  // Unset where it would fall back to last_request_time and that is unset: a
  // version the organization only pulled, with no recorded change.
  //
  // buf format keeps a field and its options on one line, which is longer than
  // the line limit here. Disabled for this line only.
  // protolint:disable:next MAX_LINE_LENGTH
  google.protobuf.Timestamp availability_change_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The earliest pull of this version through the Chainguard Repository. Unset
  // where the organization never pulled it, which means it tracks the version
  // only because it was requested.
  google.protobuf.Timestamp first_use_time = 11
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // The latest pull of this version. Unset where it was never pulled.
  google.protobuf.Timestamp last_use_time = 12
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Which artifact the organization's pulls of this version received over the
  // last seven days, for a version Chainguard has built. A built version can
  // keep reaching an organization from upstream through a resolution pin, a
  // lockfile that recorded the upstream URL or hash, or a build pointed at the
  // upstream repository.
  //
  // UNSPECIFIED where it is not reported: the version is not built, it was not
  // pulled in the last seven days, or the ecosystem is Python, whose upstream
  // wheels cannot be told apart from the ones Chainguard does not build.
  UpstreamUse upstream_use = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ListRequestedLibrariesRequest lists an organization's requested libraries.
message ListRequestedLibrariesRequest {
  // The organization whose libraries to list.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];

  // Filter to one ecosystem. The dashboard renders a table per ecosystem, so it
  // sets this.
  Ecosystem ecosystem = 2 [(google.api.field_behavior) = OPTIONAL];

  // Substring match on the library name.
  string query = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by computed build status.
  RequestedLibraryBuildStatus build_status = 4 [(google.api.field_behavior) = OPTIONAL];

  // Filter by computed CVE-remediation status.
  RequestedLibraryCVEStatus cve_status = 5 [(google.api.field_behavior) = OPTIONAL];

  // Exact match on the library's canonical name, as RequestedLibrary.name
  // reports it. Unlike query, "requests" does not also match
  // "requests-oauthlib". One name can exist in more than one ecosystem, so set
  // ecosystem as well to get at most one library. At most 255 characters, the
  // longest name the service stores.
  string name = 6 [(google.api.field_behavior) = OPTIONAL];

  // Why the organization tracks a version: it requested it, it pulled it, or
  // either. Counts and statuses cover only the versions that match. Defaults
  // to ANY.
  //
  // Where usage tracking is not enabled, results cover only requested
  // versions, so ANY and REQUESTED return the same rows, and USED fails with
  // FAILED_PRECONDITION.
  TrackingSource source = 7 [(google.api.field_behavior) = OPTIONAL];

  // Maximum libraries to return. Default 50, maximum 1000.
  int32 page_size = 10 [(google.api.field_behavior) = OPTIONAL];

  // Opaque page token from a previous response.
  string page_token = 11 [(google.api.field_behavior) = OPTIONAL];

  // Order results by field, as "field [asc|desc]". Defaults to
  // "last_request_time desc", which puts the most recently requested or pulled
  // library first. Changing this between pages invalidates the token.
  string order_by = 12 [(google.api.field_behavior) = OPTIONAL];

  // Number of results to skip before returning, for random-access pagination.
  // Combines with page_token to skip from the cursor position. Must be
  // non-negative.
  int32 skip = 13 [(google.api.field_behavior) = OPTIONAL];
}

// ListRequestedLibrariesResponse returns a page of libraries.
message ListRequestedLibrariesResponse {
  // The libraries on this page.
  repeated RequestedLibrary requested_libraries = 1;

  // Token for the next page; empty when there are no more.
  string next_page_token = 2;

  // Total libraries matching the filter, for pagination controls.
  optional int64 total_count = 3;

  // Number of results skipped, accumulated across paginated requests.
  int32 skipped = 4;
}

// ListRequestedLibraryVersionsRequest pages one library's requested versions.
message ListRequestedLibraryVersionsRequest {
  // The organization whose requests to read.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];

  // The library's canonical name, as returned by ListRequestedLibraries.
  string name = 2 [(google.api.field_behavior) = REQUIRED];

  // The library's ecosystem. Required alongside name, because the two together
  // identify the library.
  Ecosystem ecosystem = 3 [(google.api.field_behavior) = REQUIRED];

  // Filter by build availability.
  Availability availability = 4 [(google.api.field_behavior) = OPTIONAL];

  // Filter by CVE-remediation status. total_count and the page tokens then
  // describe the versions that match, not every version of the library.
  //
  // The status is derived for every version of the library before the page
  // is cut, so a library with more than 5,000 matching versions (after the
  // availability and source filters) fails with FAILED_PRECONDITION. Narrow
  // the request with availability and retry.
  CVERemediationStatus cve_remediation_status = 5 [(google.api.field_behavior) = OPTIONAL];

  // Why the organization tracks a version: it requested it, it pulled it, or
  // either. Defaults to ANY.
  //
  // Where usage tracking is not enabled, results cover only requested
  // versions, so ANY and REQUESTED return the same rows, and USED fails with
  // FAILED_PRECONDITION.
  TrackingSource source = 6 [(google.api.field_behavior) = OPTIONAL];

  // Maximum versions to return. Default 50, maximum 1000.
  int32 page_size = 10 [(google.api.field_behavior) = OPTIONAL];

  // Opaque page token from a previous response.
  string page_token = 11 [(google.api.field_behavior) = OPTIONAL];
  // Order results by field. Format: "field [asc|desc]"
  // Note: changing order_by between pages invalidates the page_token.
  string order_by = 12 [(google.api.field_behavior) = OPTIONAL];

  // Number of results to skip before returning, for random-access pagination.
  // Combines with page_token to skip from the cursor position. Must be
  // non-negative.
  int32 skip = 13 [(google.api.field_behavior) = OPTIONAL];
}

// ListRequestedLibraryVersionsResponse returns a page of versions.
message ListRequestedLibraryVersionsResponse {
  // The versions on this page.
  repeated RequestedLibraryVersion requested_library_versions = 1;

  // Token for the next page; empty when there are no more.
  string next_page_token = 2;

  // Total versions of this library the organization has requested.
  optional int64 total_count = 3;

  // Number of results skipped, accumulated across paginated requests.
  int32 skipped = 4;
}

// ListRequestedLibraryVersionCvesRequest names one version of one library.
//
// The triple (name, ecosystem, version) identifies the version, for the same
// reason ListRequestedLibraryVersions needs name and ecosystem together: one
// package name can exist under two ecosystems.
message ListRequestedLibraryVersionCvesRequest {
  // The organization whose requests to read.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];

  // The library's canonical name, as returned by ListRequestedLibraries.
  string name = 2 [(google.api.field_behavior) = REQUIRED];

  // The library's ecosystem.
  Ecosystem ecosystem = 3 [(google.api.field_behavior) = REQUIRED];

  // The version as requested, as returned by ListRequestedLibraryVersions.
  string version = 4 [(google.api.field_behavior) = REQUIRED];

  // Maximum CVEs to return. Default 50, maximum 1000.
  int32 page_size = 10 [(google.api.field_behavior) = OPTIONAL];

  // Opaque page token from a previous response.
  string page_token = 11 [(google.api.field_behavior) = OPTIONAL];

  // Number of results to skip before returning, for random-access pagination.
  // Combines with page_token to skip from the cursor position. Must be
  // non-negative.
  int32 skip = 13 [(google.api.field_behavior) = OPTIONAL];
}

// ListRequestedLibraryVersionCvesResponse returns a page of CVEs.
message ListRequestedLibraryVersionCvesResponse {
  // The CVEs on this page, KEV first.
  repeated RequestedLibraryVersionCVE cves = 1;

  // Token for the next page; empty when there are no more.
  string next_page_token = 2;

  // Total CVEs recorded against this version, across all pages.
  optional int64 total_count = 3;

  // Results skipped before this page, accumulated across paginated requests.
  int32 skipped = 4;

  // Whether Chainguard has cross-referenced this version against advisory data.
  //
  // False with an empty list means "no answer yet", not "no CVEs" — rows are
  // created only when the cross-reference returns a decision, so a clean
  // version and an unprocessed one are otherwise indistinguishable. A caller
  // must not render an empty list as "no CVEs found" unless this is true.
  bool cross_referenced = 5;
}

// RequestedLibraryVersionCVE is one CVE recorded against one version.
//
// One row per (version, CVE). Rows are shared across request groups: if
// several groups pin the same version, there is one record and a triage
// decision applies to all of them.
message RequestedLibraryVersionCVE {
  // The CVE identifier, e.g. "CVE-2024-12345". For a vulnerability with no CVE
  // assigned, an internal synthetic identifier.
  string cve_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Severity band, from the advisory data.
  CVESeverity severity = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether the CVE is in CISA's Known Exploited Vulnerabilities catalog.
  bool kev = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Remediation state of this CVE on this version.
  CVEStatus status = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The reviewer's decision, where one was recorded. Per CVE, so unlike the
  // aggregate on CVERemediation this value is not collapsed across a version.
  //
  // Over the line limit by two characters, and buf format puts a field and its
  // options on one line. Disabled for this line only; the identical
  // declaration on CVERemediation above predates the limit.
  // protolint:disable:next MAX_LINE_LENGTH
  CVERemediationDecision decision = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The earliest Chainguard remediation carrying the fix, e.g.
  // "0.115.0+cgr.1". May move to an earlier version as older backports land,
  // never to a later one.
  //
  // Always a cgr cut, never a plain rebuild. A rebuild of an upstream release
  // is built from upstream's source and carries whatever that release carries,
  // so naming one here would credit Chainguard with a fix upstream made. The
  // upstream release that resolves the CVE is upstream_fix_version.
  //
  // Empty means no Chainguard remediation is recorded against this CVE. It
  // does not mean no fix exists: an upstream release may carry one, and status
  // FIX_AVAILABLE says so where we know. Rendering an empty value as "no fix"
  // is the one reading that stops a customer investigating.
  //
  // This field does not yet report a fix target that landed on the malware
  // block list as blocked, so treat it as evidence of a Chainguard remediation
  // and not as the complete answer about where a fix exists.
  string remediated_version = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What this row asserts. Read it before presenting the row as a finding:
  // an UPSTREAM row is a detection, not a Chainguard determination.
  CVEProvenance provenance = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The version the upstream advisory names as fixed, e.g. "3.9.2". Upstream's
  // claim, recorded as received and not verified by Chainguard.
  //
  // Never a remediation Chainguard performed: remediated_version is the only
  // field that names one. Presenting this value as a Chainguard fix credits us
  // with upstream's work, and the two populations differ by an order of
  // magnitude -- upstream has fixed far more CVEs than we have cut a build for.
  //
  // Read both to answer "how do I resolve this CVE": this field says which
  // upstream release resolves it, remediated_version says whether Chainguard
  // already remediated the version the caller pinned.
  //
  // Empty where upstream recorded no fix, which covers a CVE upstream has not
  // fixed and one whose advisory names no version.
  //
  // Reported whatever the malware gate says about it. Read upstream_fix_check
  // before recommending it as an upgrade.
  string upstream_fix_version = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether remediated_version is served by the inventory projection -- that
  // is, whether a customer can pull it today.
  //
  // It qualifies remediated_version and nothing else: false with an empty
  // remediated_version says only that there is no Chainguard remediation to
  // publish, not that anything is missing.
  //
  // The two differ because they answer different questions. A pointer says a
  // fix version was chosen; this says the index will hand it over. They
  // disagree while the inventory walk lags a fresh build, a window that closes
  // on the next pass -- so false here is ordinarily "not yet", not "never".
  // Only this field supports telling a customer the CVE is remediated for
  // them, and the aggregate's remediated_count is sourced from it so the two
  // reads cannot disagree about one version.
  bool remediated_version_published = 9
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // The version Chainguard's advisory names as fixing this CVE for the version
  // asked about, e.g. "3.9.2" or "3.9.0+cgr.1": the lowest one at or above it,
  // a cut of the pinned version first.
  //
  // Chainguard's determination, where upstream_fix_version is upstream's. The
  // two can disagree, and both are reported as recorded rather than reconciled.
  // This one is the answer on a CVE upstream has no fix for, or has not looked
  // at.
  //
  // Not a claim that Chainguard built it: it may name an upstream release.
  // remediated_version is the only field that names a Chainguard remediation.
  //
  // Reported whatever the malware gate says about it. Read advisory_fix_check
  // before recommending it as an upgrade.
  //
  // Empty where no Chainguard advisory governs the CVE, or where it names no
  // fix at or above the version asked about. It never means no fix exists:
  // upstream_fix_version may still name one.
  string advisory_fix_version = 10
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether upstream_fix_version may be recommended, from the malware gate,
  // checked when this response was built. Always the gate's answer: the
  // version is upstream's string, so its form is never taken as proof that
  // Chainguard built it. UNSPECIFIED exactly when upstream_fix_version is
  // empty.
  FixTargetCheck upstream_fix_check = 11
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether advisory_fix_version may be recommended, checked when this
  // response was built. For a cgr cut, which a Chainguard advisory named and so
  // is a Chainguard build, only a finding counts: BLOCKED on a malware or
  // block-list finding, CLEARED otherwise, including before sentinel has
  // scanned it. Any other version gets the malware gate's answer. UNSPECIFIED
  // exactly when advisory_fix_version is empty.
  FixTargetCheck advisory_fix_check = 12
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Availability is the normalized build status of one requested version.
//
// It never depends on whether the organization has upstream fallback enabled.
// "Can Chainguard build this?" is a different question from "am I pulling
// upstream in the meantime?", so an org that turned upstream off sees identical
// values and the identical requestable set.
enum Availability {
  // Unspecified availability.
  AVAILABILITY_UNSPECIFIED = 0;

  // Chainguard has built this exact version.
  AVAILABILITY_BUILT = 1;

  // Not built, and requestable. The upgrade field may name a newer built version.
  AVAILABILITY_CAN_BE_REQUESTED = 2;

  // On the malware block list. Still requestable, but the build is held until the
  // block is withdrawn — a false positive must not silently discard a legitimate
  // request, and the daily refresh picks the item up once it clears.
  AVAILABILITY_BLOCKED = 3;

  // The version does not exist on the upstream registry, so there is nothing to
  // build. The only true dead end.
  AVAILABILITY_NOT_FOUND_UPSTREAM = 4;

  // Chainguard will not build this version for policy reasons, such as licence or
  // end-of-life.
  AVAILABILITY_WONT_BUILD = 5;

  // The requirement is not a parseable pinned package and version. Terminal and
  // not retried; the customer must fix or remove the line.
  AVAILABILITY_INVALID_REQUIREMENT = 6;

  // A build has been triggered and is running.
  AVAILABILITY_BUILDING = 7;

  // A build ran and failed. Retried automatically.
  AVAILABILITY_BUILD_FAILED = 8;

  // The build was declined and is being held, and no retry will change that on
  // its own — a later publish of the version is what releases it.
  //
  // Deliberately not folded into AVAILABILITY_BLOCKED. That value is specific to
  // the malware block list and is documented as still requestable; reusing it
  // here would give a customer the same answer for "this may be malware" and
  // "the build is held", which are different situations with different
  // resolutions. Unlike a blocked item, a held one is not requestable.
  AVAILABILITY_HELD = 9;
}

// CVERemediationStatus is the aggregate remediation status of one version.
//
// Fully orthogonal to Availability, and populated only for an opted-in group.
enum CVERemediationStatus {
  // Unspecified remediation status.
  CVE_REMEDIATION_STATUS_UNSPECIFIED = 0;

  // Queued for review, or not yet resolvable to a version we hold. Distinct from
  // NO_HIGH_CRITICAL_CVES: this means no answer yet, not a clean answer.
  CVE_REMEDIATION_STATUS_SCAN_QUEUED = 1;

  // Cross-referenced against advisory data, and no High or Critical CVEs apply.
  CVE_REMEDIATION_STATUS_NO_HIGH_CRITICAL_CVES = 2;

  // CVEs identified; remediation not started.
  CVE_REMEDIATION_STATUS_REVIEWING = 3;

  // Remediation underway on at least one CVE.
  CVE_REMEDIATION_STATUS_IN_PROGRESS = 4;

  // Remediation finished with at least one CVE remediated.
  CVE_REMEDIATION_STATUS_COMPLETE = 5;

  // Every CVE on this version was ruled out of scope. The decision on
  // CVERemediation says which kind of out-of-scope.
  CVE_REMEDIATION_STATUS_WONT_REMEDIATE = 6;

  // A fix exists that the caller can move to now, and Chainguard has not
  // remediated the pinned version.
  //
  // The one rung that names a target: CVERemediation.fix_version carries the
  // release that clears every CVE the message counts, where one can be
  // established. An empty fix_version beside this status is ordinary rather
  // than a contradiction -- read
  // RequestedLibraryVersionCVE.upstream_fix_version for what is known per CVE.
  //
  // Distinct from REVIEWING, which says remediation has not started and would
  // hide an upgrade available today, and from COMPLETE, which claims a build
  // Chainguard shipped. Reached when an untriaged CVE already records a fix
  // target, or when an advisory named a fix at or above the pinned version
  // that Chainguard never ingested.
  //
  // Added after the other values. proto3 enums are open, so a client generated
  // from an earlier copy of this file keeps the number as an unrecognized
  // value and its switches fall through to their default branch -- it does not
  // read as UNSPECIFIED. A client parsing the JSON surface strictly errors on
  // the unknown name instead. Treat an unrecognized value as not computed.
  //
  // A version that reports this today reported REVIEWING before the value
  // existed.
  CVE_REMEDIATION_STATUS_FIX_AVAILABLE = 7;
}

// CVERemediationDecision is what a Chainguard reviewer decided about a CVE,
// stated in customer terms.
//
// It exists because WONT_REMEDIATE covers judgements that mean opposite things
// to the reader: "this does not affect the build you pull" is reassurance, while
// "we are not fixing this" is a risk to weigh. Collapsing both into one status
// reports the reassuring case as the alarming one.
//
// A value appears only where a reviewer recorded a judgement. Automation may
// retire a decision whose premise no longer holds, but never authors one, so a
// value here always reflects a person's call.
enum CVERemediationDecision {
  // No reviewer decision to report. Either nobody has decided yet, or the row
  // was settled by automation. Not an error, and the common case.
  CVE_REMEDIATION_DECISION_UNSPECIFIED = 0;

  // The Chainguard build is not affected, so there is nothing to remediate and
  // nothing for the caller to act on.
  //
  // Reported only when it holds for EVERY CVE on the version. A version with one
  // unaffected CVE and one deliberately unfixed CVE is not NOT_AFFECTED: the
  // unanimity requirement is deliberate, because wrongly reassuring a caller
  // hides real exposure, while wrongly alarming them only costs an
  // investigation.
  CVE_REMEDIATION_DECISION_NOT_AFFECTED = 1;

  // Chainguard does not plan to fix this, and there is no upgrade to move to.
  // The caller carries the risk and may want to weigh it.
  CVE_REMEDIATION_DECISION_NO_FIX_PLANNED = 2;

  // Chainguard does not plan to publish a remediated build of the pinned
  // version, because moving to a later version resolves it.
  CVE_REMEDIATION_DECISION_UPGRADE_AVAILABLE = 3;
}

// CVEStatus is the remediation state of one CVE on one version.
//
// Deliberately not CVERemediationStatus, which is the aggregate ladder over a
// whole version and has a different vocabulary. The two share only IN_PROGRESS,
// so one enum serving both would report a per-CVE state in words that mean
// something else at the version level.
enum CVEStatus {
  // Unspecified state.
  CVE_STATUS_UNSPECIFIED = 0;

  // Recorded by the cross-reference and not yet triaged.
  CVE_STATUS_PENDING = 1;

  // A reviewer has decided how to remediate; work has not started.
  CVE_STATUS_TRIAGED = 2;

  // A rebuild or backport is underway.
  CVE_STATUS_IN_PROGRESS = 3;

  // Chainguard delivered a remediation carrying the fix, and
  // remediated_version names it.
  //
  // Delivery, not the existence of a fix somewhere. The stored status alone
  // does not establish it: a row completes as soon as an advisory names a fix
  // at or above the affected version, and that fix may be one Chainguard never
  // ingested. Such a row reports FIX_AVAILABLE instead, so this value never
  // appears without a remediated_version beside it.
  CVE_STATUS_COMPLETED = 4;

  // Ruled out of scope. decision says which kind of out-of-scope, and is the
  // field to render: "not affected" and "no fix planned" mean opposite things
  // to the reader.
  CVE_STATUS_EXCLUDED = 5;

  // No active request group references this version any more, so the row is no
  // longer maintained. Reported rather than hidden, because a caller that
  // pinned the version earlier may still be running it.
  CVE_STATUS_SUPERSEDED = 6;

  // An advisory names a fix, but Chainguard has not remediated the pinned
  // version. remediated_version is empty: there is no Chainguard remediation
  // to name.
  //
  // Not "no Chainguard build": we may well build the release that carries the
  // fix, and a plain rebuild of it is content-equivalent to upstream's, so it
  // remediates nothing we did. upstream_fix_version names that release, and is
  // the field to read for an upgrade target.
  //
  // That release can be the one the caller already pins, where an advisory
  // records the pinned version itself as fixed. Read that as "nothing to do"
  // rather than as an upgrade: the value says only that no Chainguard
  // remediation exists, and for that shape none is needed. Compare
  // upstream_fix_version against the version asked about before presenting it
  // as an action.
  //
  // Its own value rather than COMPLETED, which would claim a remediation
  // nobody shipped, and rather than IN_PROGRESS or TRIAGED, which say
  // remediation has not landed yet while hiding that the CVE is resolved by
  // moving to a later upstream version today.
  CVE_STATUS_FIX_AVAILABLE = 7;
}

// CVESeverity is the severity band from the advisory data.
//
// UNSPECIFIED covers two cases a caller should treat alike: no severity was
// recorded, and the advisory reported a band this API does not enumerate. The
// second is mapped rather than dropped, so the CVE still appears.
enum CVESeverity {
  // No severity recorded, or a band this API does not enumerate.
  CVE_SEVERITY_UNSPECIFIED = 0;

  // The advisory reported "low".
  CVE_SEVERITY_LOW = 1;

  // The advisory reported "medium".
  CVE_SEVERITY_MEDIUM = 2;

  // The advisory reported "high".
  CVE_SEVERITY_HIGH = 3;

  // The advisory reported "critical".
  CVE_SEVERITY_CRITICAL = 4;
}

// CVEProvenance is what a CVE row asserts, which differs by where it came from.
//
// It exists because the two are not interchangeable to a reader. An ADVISORY
// row is a Chainguard determination: we rebuilt the artifact and the rebuild
// remediates this CVE. An UPSTREAM row is an untriaged detection that this
// version is affected. Presenting an upstream detection as a determination
// reports input we have not stood behind as a finding we have.
enum CVEProvenance {
  // Unspecified provenance.
  CVE_PROVENANCE_UNSPECIFIED = 0;

  // Chainguard's rebuild of this artifact remediates this CVE.
  CVE_PROVENANCE_ADVISORY = 1;

  // This version is affected by this CVE. An untriaged detection.
  CVE_PROVENANCE_UPSTREAM = 2;
}

// FixTargetCheck says whether one upgrade target may be recommended, read when
// the response is built rather than when the CVE was recorded: a release can
// land on the block list after its fix was named, and the verdict follows it.
// It is the malware gate's answer, except that for a cgr cut on the advisory's
// target only a malware or block-list finding counts against it.
//
// A target the gate did not clear is still reported, next to this verdict.
// Leaving the version out would read as "no fix exists", which is the one
// answer that stops a customer looking further.
enum FixTargetCheck {
  // No target to check: the version field beside this one is empty.
  FIX_TARGET_CHECK_UNSPECIFIED = 0;

  // The release may be recommended as an upgrade: the gate cleared it, or it is
  // a cgr cut a Chainguard advisory named and the gate holds no malware or
  // block-list finding against it. Other controls keep malware out of
  // Chainguard builds, so a cut sentinel has not scanned yet reads CLEARED.
  FIX_TARGET_CHECK_CLEARED = 1;

  // The release is on the malware block list or was found to carry malware.
  // A fix exists at this version, and it must not be installed.
  FIX_TARGET_CHECK_BLOCKED = 2;

  // The gate could not clear the release: it has not been scanned yet, the
  // gate could not be reached in time, or the ecosystem is outside its
  // coverage. Not a finding against the release, and not a clearance.
  FIX_TARGET_CHECK_UNVERIFIED = 3;
}

// RequestSource records how a group came to exist.
enum RequestSource {
  // Unspecified source.
  REQUEST_SOURCE_UNSPECIFIED = 0;

  // Uploaded through the console.
  REQUEST_SOURCE_MANUAL_UPLOAD = 1;

  // Created through the API.
  REQUEST_SOURCE_API = 2;

  // Created from observed upstream-fallback traffic.
  REQUEST_SOURCE_UPSTREAM_FALLBACK = 3;

  // Created by the Gardener GitHub app.
  REQUEST_SOURCE_GARDENER_GITHUB = 4;

  // Predates source tracking.
  REQUEST_SOURCE_LEGACY = 5;
}

// RequestedLibraryBuildStatus is the build ladder across a library's requested versions.
//
// A version counts as buildable unless it is WONT_BUILD or NOT_FOUND_UPSTREAM,
// so versions Chainguard will never build do not hold a library short of
// COMPLETE.
enum RequestedLibraryBuildStatus {
  // Unspecified build status.
  REQUESTED_LIBRARY_BUILD_STATUS_UNSPECIFIED = 0;

  // Submitted, but no build activity on any version yet.
  REQUESTED_LIBRARY_BUILD_STATUS_REVIEWING = 1;

  // Build activity has started on at least one version and at least one buildable
  // version is not built yet. A version that is already built, or that failed and
  // will be retried, counts as activity.
  REQUESTED_LIBRARY_BUILD_STATUS_IN_PROGRESS = 2;

  // Every buildable requested version is built, with at least one built.
  //
  // The rung is over versions, not over requests. A version counts as built
  // once any request for it resolved to an artifact, so a second request for
  // the same version -- whose own status may still say building, because a
  // request's status is a snapshot from its own check -- does not reopen the
  // library. Reporting IN_PROGRESS there would tell the customer to wait for
  // something they can already pull.
  REQUESTED_LIBRARY_BUILD_STATUS_COMPLETE = 3;

  // No requested version is buildable.
  REQUESTED_LIBRARY_BUILD_STATUS_WONT_BUILD = 4;
}

// RequestedLibraryCVEStatus is the remediation ladder across a library's versions.
//
// Only meaningful where a contributing group opted in.
enum RequestedLibraryCVEStatus {
  // Unspecified remediation status.
  REQUESTED_LIBRARY_CVE_STATUS_UNSPECIFIED = 0;

  // No version in scope is past being queued, or a cross-referenced one still
  // has untriaged CVEs. One un-cross-referenced version in scope makes the
  // library REVIEWING rather than clean: the alternative would report an
  // unfinished check as a clean bill of health.
  REQUESTED_LIBRARY_CVE_STATUS_REVIEWING = 1;

  // Remediation underway on at least one version in scope.
  REQUESTED_LIBRARY_CVE_STATUS_IN_PROGRESS = 2;

  // Every version in scope came back cross-referenced and clean, and none is
  // still queued.
  REQUESTED_LIBRARY_CVE_STATUS_NO_HIGH_CRITICAL_CVES = 3;

  // At least one CVE remediated, with nothing in progress and no version in
  // scope still queued.
  //
  // Read it as "nothing outstanding on the versions you asked us to scan, as
  // far as the last cross-reference knows" -- not as a durable property of the
  // library, and not as a statement about versions outside the scope.
  //
  // New upstream versions appear and new CVEs are disclosed against versions
  // already pinned, so a library has no permanent finished state, and this
  // value can go back to REVIEWING without anything regressing.
  //
  // A version nobody has cross-referenced holds this value off, for the reason
  // it holds off NO_HIGH_CRITICAL_CVES: both claim full coverage of the scope,
  // and an unexamined version in it is where that coverage is missing.
  //
  // remediated_cve_count is reported whatever the status, so a REVIEWING
  // library still says how many CVEs were fixed.
  REQUESTED_LIBRARY_CVE_STATUS_COMPLETE = 4;

  // Every CVE on the versions in scope was ruled out of scope. A version in
  // scope with no CVEs does not hold this back -- it has none to leave
  // unexcluded -- but one that was never cross-referenced does.
  REQUESTED_LIBRARY_CVE_STATUS_WONT_REMEDIATE = 5;

  // At least one version in scope has a CVE with a fix the caller can move to,
  // and Chainguard has not remediated that pinned version.
  //
  // The target is not named here. Different pinned versions upgrade to
  // different targets, so one library-level version would be wrong for most of
  // them -- the per-version read is where a target belongs.
  //
  // Added after the other values. proto3 enums are open, so a client generated
  // from an earlier copy of this file keeps the number as an unrecognized
  // value and its switches fall through to their default branch -- it does not
  // read as UNSPECIFIED. A client parsing the JSON surface strictly errors on
  // the unknown name instead. Treat an unrecognized value as not computed.
  REQUESTED_LIBRARY_CVE_STATUS_FIX_AVAILABLE = 6;
}

// TrackingSource is why an organization tracks a version.
enum TrackingSource {
  // Unspecified: the server applies its default, which is ANY.
  TRACKING_SOURCE_UNSPECIFIED = 0;

  // The organization asked for the version, whether or not it also pulls it.
  TRACKING_SOURCE_REQUESTED = 1;

  // The organization pulled the version through the Chainguard Repository,
  // whether or not it also asked for it.
  TRACKING_SOURCE_USED = 2;

  // Requested, pulled, or both.
  TRACKING_SOURCE_ANY = 3;
}

// UpstreamUse is which artifact an organization's recent pulls of a built
// version received: the Chainguard build, the upstream one, or both.
enum UpstreamUse {
  // Not reported: the version is not built, was not pulled recently, or its
  // ecosystem does not report this.
  UPSTREAM_USE_UNSPECIFIED = 0;

  // Every recent pull received the Chainguard build.
  UPSTREAM_USE_CHAINGUARD_ONLY = 1;

  // Built, but every recent pull still received the upstream artifact. Check
  // resolution pins, repository configuration and lockfiles.
  UPSTREAM_USE_UPSTREAM_ONLY = 2;

  // Built, and recent pulls received both: some of the organization's projects
  // still receive the upstream artifact.
  UPSTREAM_USE_MIXED = 3;
}
