syntax = "proto3";

package chainguard.platform.libraries.v2beta1;

import "annotations/auth.proto";
import "annotations/events.proto";
import "annotations/mcp.proto";
// Ecosystem is shared with the artifacts service rather than redeclared, so a
// Python request group and a Python artifact name the same ecosystem value.
import "chainguard/platform/libraries/v2beta1/artifacts.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "chainguard.dev/sdk/proto/chainguard/platform/libraries/v2beta1";
option java_multiple_files = true;
option java_outer_classname = "RequestGroupsProto";
option java_package = "com.chainguard.platform.libraries.v2beta1";

// RequestGroupsService manages an organization's requests for Chainguard-built
// library versions.
//
// A request group starts as a DRAFT: the customer supplies a pinned input — a
// Python lockfile or a Java GAV list — and the service reports, per version, what
// Chainguard already has, what can be requested, and what cannot. Nothing is
// built from a draft. SubmitRequestGroup is the commitment point, and it is
// separately capability-gated for that reason.
service RequestGroupsService {
  // CreateRequestGroup parses a pinned input and returns a DRAFT group whose
  // coverage check runs asynchronously. Poll GetRequestGroup until its status
  // leaves creating/processing.
  //
  // Idempotent on the content hash of the input within the organization, so a
  // retried upload rejoins the existing non-terminal group instead of starting a
  // second coverage run over the same versions.
  rpc CreateRequestGroup(CreateRequestGroupRequest) returns (RequestGroup) {
    option (google.api.http) = {
      post: "/libraries/v2beta1/requestGroups/{parent=**}"
      body: "*"
    };
    option (chainguard.annotations.iam) = {
      enabled: {capabilities: [CAP_LIBRARIES_REQUEST_GROUPS_CREATE]}
    };
    option (chainguard.annotations.events) = {
      type: "dev.chainguard.api.libraries.request_group.created.v1"
      extensions: ["group"]
      audience: CUSTOMER
    };
    option (chainguard.annotations.mcp) = {
      description: "Create a draft request for Chainguard-built library versions from a Python lockfile or a Java GAV list. Nothing is built until the draft is submitted."
      read_only: false
      destructive: false
      idempotent: true
      open_world: false
    };
  }

  // ListRequestGroups lists the organization's request groups. Defaults to
  // submitted groups; pass state to include or isolate drafts.
  rpc ListRequestGroups(ListRequestGroupsRequest) returns (ListRequestGroupsResponse) {
    option (google.api.http) = {get: "/libraries/v2beta1/requestGroups"};
    option (chainguard.annotations.iam) = {
      enabled: {capabilities: [CAP_LIBRARIES_REQUEST_GROUPS_LIST]}
    };
    option (chainguard.annotations.mcp) = {
      description: "List the organization's library request groups, filterable by state, status, ecosystem, source, name, and CVE-remediation opt-in."
      read_only: true
      destructive: false
      idempotent: true
      open_world: false
    };
  }

  // GetRequestGroup returns one group's metadata and summary counts.
  //
  // The response carries items_update_time as a high-water mark, so a client
  // polling a large group can tell whether anything moved without paging the
  // items again.
  rpc GetRequestGroup(GetRequestGroupRequest) returns (RequestGroup) {
    option (google.api.http) = {get: "/libraries/v2beta1/requestGroups/{uid=**}"};
    option (chainguard.annotations.iam) = {
      enabled: {capabilities: [CAP_LIBRARIES_REQUEST_GROUPS_LIST]}
    };
    option (chainguard.annotations.mcp) = {
      description: "Get a library request group's metadata, per-availability summary counts, and CVE-remediation summary."
      read_only: true
      destructive: false
      idempotent: true
      open_world: false
    };
  }

  // ListRequestGroupItems pages the per-item results, carrying both the build
  // availability and the CVE-remediation status for each requested version.
  //
  // min_update_time supports delta sync against items_update_time, which is how a
  // 10,000-item group is followed without repaging the whole set.
  rpc ListRequestGroupItems(ListRequestGroupItemsRequest) returns (ListRequestGroupItemsResponse) {
    option (google.api.http) = {get: "/libraries/v2beta1/requestGroups/{uid=**}/items"};
    option (chainguard.annotations.iam) = {
      enabled: {capabilities: [CAP_LIBRARIES_REQUEST_GROUPS_LIST]}
    };
    option (chainguard.annotations.mcp) = {
      description: "List a request group's items with per-version build availability and CVE-remediation status. Supports delta sync via min_update_time."
      read_only: true
      destructive: false
      idempotent: true
      open_world: false
    };
  }

  // SubmitRequestGroup promotes a DRAFT to SUBMITTED and queues builds for its
  // requestable items.
  //
  // Its own RPC rather than a field mask on UpdateRequestGroup, because it is the
  // point where a preview becomes committed work and it carries the group-level
  // CVE-remediation decision. That lets it hold a distinct, Owner-only
  // capability, which a mask on update could not express.
  //
  // Items in the cannot-be-requested set must be removed first.
  rpc SubmitRequestGroup(SubmitRequestGroupRequest) returns (RequestGroup) {
    option (google.api.http) = {
      post: "/libraries/v2beta1/requestGroups/{uid=**}:submit"
      body: "*"
    };
    option (chainguard.annotations.iam) = {
      enabled: {capabilities: [CAP_LIBRARIES_REQUEST_GROUPS_SUBMIT]}
    };
    option (chainguard.annotations.events) = {
      type: "dev.chainguard.api.libraries.request_group.submitted.v1"
      extensions: ["group"]
      audience: CUSTOMER
    };
    option (chainguard.annotations.mcp) = {
      description: "Submit a draft request group, committing Chainguard to build its requestable versions. Optionally opts the group in to CVE remediation. Owner-only."
      read_only: false
      destructive: false
      idempotent: true
      open_world: false
    };
  }

  // UpdateRequestGroup edits group metadata under a field mask. Renaming is the
  // expected use; it cannot submit a group or change its items.
  rpc UpdateRequestGroup(UpdateRequestGroupRequest) returns (RequestGroup) {
    option (google.api.http) = {
      patch: "/libraries/v2beta1/requestGroups/{request_group.uid=**}"
      body: "request_group"
    };
    option (chainguard.annotations.iam) = {
      enabled: {capabilities: [CAP_LIBRARIES_REQUEST_GROUPS_UPDATE]}
    };
    option (chainguard.annotations.events) = {
      type: "dev.chainguard.api.libraries.request_group.updated.v1"
      extensions: ["group"]
      audience: CUSTOMER
    };
    option (chainguard.annotations.mcp) = {
      description: "Update a request group's name or other mutable metadata. Cannot submit the group or change which items it carries."
      read_only: false
      destructive: false
      idempotent: true
      open_world: false
    };
  }

  // RemoveItems marks items as removed. Draft-only, and reversible via
  // RestoreItems — the rows are retained rather than deleted so a customer can
  // undo a removal while still editing.
  //
  // Every uid must belong to both the path group and the caller's organization;
  // any mismatch fails the whole call rather than partially applying.
  rpc RemoveItems(RemoveItemsRequest) returns (RemoveItemsResponse) {
    option (google.api.http) = {
      post: "/libraries/v2beta1/requestGroups/{uid=**}:removeItems"
      body: "*"
    };
    option (chainguard.annotations.iam) = {
      enabled: {capabilities: [CAP_LIBRARIES_REQUEST_GROUPS_ITEMS_UPDATE]}
    };
    option (chainguard.annotations.events) = {
      type: "dev.chainguard.api.libraries.request_group.items_removed.v1"
      extensions: ["group"]
      audience: CUSTOMER
    };
    option (chainguard.annotations.mcp) = {
      description: "Remove items from a draft request group. Reversible via RestoreItems."
      read_only: false
      destructive: false
      idempotent: true
      open_world: false
    };
  }

  // RestoreItems returns previously removed items to the draft.
  rpc RestoreItems(RestoreItemsRequest) returns (RestoreItemsResponse) {
    option (google.api.http) = {
      post: "/libraries/v2beta1/requestGroups/{uid=**}:restoreItems"
      body: "*"
    };
    option (chainguard.annotations.iam) = {
      enabled: {capabilities: [CAP_LIBRARIES_REQUEST_GROUPS_ITEMS_UPDATE]}
    };
    option (chainguard.annotations.events) = {
      type: "dev.chainguard.api.libraries.request_group.items_restored.v1"
      extensions: ["group"]
      audience: CUSTOMER
    };
    option (chainguard.annotations.mcp) = {
      description: "Restore items previously removed from a draft request group."
      read_only: false
      destructive: false
      idempotent: true
      open_world: false
    };
  }

  // DeleteRequestGroup cancels a group and drops its item rows, keeping the group
  // row as a tombstone so a stale link returns a sensible message rather than a
  // bare 404. A sweeper hard-deletes the tombstone later.
  //
  // A customer may delete their own drafts. Deleting a submitted group requires
  // the admin deleteSubmitted capability, since builds may already have run.
  rpc DeleteRequestGroup(DeleteRequestGroupRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/libraries/v2beta1/requestGroups/{uid=**}"};
    option (chainguard.annotations.iam) = {
      enabled: {capabilities: [CAP_LIBRARIES_REQUEST_GROUPS_DELETE]}
    };
    option (chainguard.annotations.events) = {
      type: "dev.chainguard.api.libraries.request_group.deleted.v1"
      extensions: ["group"]
      audience: CUSTOMER
    };
    option (chainguard.annotations.mcp) = {
      description: "Delete a draft request group. Deleting an already-submitted group requires Chainguard admin."
      read_only: false
      destructive: true
      idempotent: true
      open_world: false
    };
  }

  // RefreshCoverage re-runs the coverage check over a whole group.
  //
  // Chainguard-internal only. The scan is expensive, and submitted groups are
  // kept current by a daily sweep, so this exists for support and incident
  // escalation rather than as a customer control.
  rpc RefreshCoverage(RefreshCoverageRequest) returns (RequestGroup) {
    option (google.api.http) = {
      post: "/libraries/v2beta1/requestGroups/{uid=**}:refreshCoverage"
      body: "*"
    };
    option (chainguard.annotations.iam) = {
      enabled: {capabilities: [CAP_LIBRARIES_REQUEST_GROUPS_REFRESH_COVERAGE]}
    };
    option (chainguard.annotations.events) = {
      type: "dev.chainguard.api.libraries.request_group.coverage_refreshed.v1"
      extensions: ["group"]
      audience: INTERNAL
    };
    option (chainguard.annotations.mcp) = {
      description: "Force a full coverage re-scan of a request group. Chainguard-internal; expensive."
      read_only: false
      destructive: false
      idempotent: true
      open_world: false
    };
  }

  // ListRequestedLibraries returns one row per library the organization has
  // requested, aggregated across all its submitted groups.
  //
  // This is the per-library view of the same data the group RPCs return, because a
  // customer asks "where is snakeyaml" rather than "what was in the lockfile I
  // uploaded in March". It reports only libraries the organization has asked for,
  // not every library it can reach.
  //
  // The tree is paged one level at a time rather than nested: this RPC returns
  // bounded per-library summaries, and one library's versions are fetched by
  // ListRequestedLibraryVersions on expand. A nested response could not keep both
  // the page size and the page token one-dimensional.
  rpc ListRequestedLibraries(ListRequestedLibrariesRequest) returns (ListRequestedLibrariesResponse) {
    option (google.api.http) = {get: "/libraries/v2beta1/requestedLibraries"};
    option (chainguard.annotations.iam) = {
      enabled: {capabilities: [CAP_LIBRARIES_REQUEST_GROUPS_LIST]}
    };
    option (chainguard.annotations.mcp) = {
      description: "List the libraries an organization has requested Chainguard builds for, with per-library build status and CVE-remediation status."
      read_only: true
      destructive: false
      idempotent: true
      open_world: false
    };
  }

  // ListRequestedLibraryVersions returns the requested versions of one library.
  //
  // A requested library is a computed aggregate identified by name and ecosystem
  // rather than a stored resource with a uid, so this reads as a custom method on
  // the collection instead of a sub-resource of an addressable parent.
  rpc ListRequestedLibraryVersions(ListRequestedLibraryVersionsRequest) returns (ListRequestedLibraryVersionsResponse) {
    option (google.api.http) = {get: "/libraries/v2beta1/requestedLibraries:versions"};
    option (chainguard.annotations.iam) = {
      enabled: {capabilities: [CAP_LIBRARIES_REQUEST_GROUPS_LIST]}
    };
    option (chainguard.annotations.mcp) = {
      description: "List the requested versions of one library, with per-version build availability, CVE-remediation status, and who requested each."
      read_only: true
      destructive: false
      idempotent: true
      open_world: false
    };
  }
}

// RequestGroup is one organization's request for a set of library versions.
//
// Drafts and submitted groups are the same resource; submit_time distinguishes
// them. The two status axes — build availability and CVE remediation — are
// summarised here and reported per item by ListRequestGroupItems.
message RequestGroup {
  option (google.api.resource) = {
    type: "libraries.chainguard.dev/RequestGroup"
    pattern: "requestGroups/{request_group}"
    singular: "requestGroup"
    plural: "requestGroups"
  };

  // The group's unique identifier.
  string uid = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The organization the group belongs to.
  string parent_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Customer-supplied name, unique among the organization's live groups.
  //
  // OPTIONAL rather than OUTPUT_ONLY because it is the one field on this resource
  // the customer sets: omitted on create the server generates one, and
  // UpdateRequestGroup can rename it.
  string name = 3 [(google.api.field_behavior) = OPTIONAL];

  // Processing status of the group's coverage check.
  RequestGroupStatus status = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The ecosystem the group's requirements belong to.
  Ecosystem ecosystem = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How the group was created.
  RequestSource source = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether the group is opted in to CVE remediation. Set at submit.
  bool for_cve_remediation = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Unset while the group is a draft; set when the customer submitted it.
  google.protobuf.Timestamp submit_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the group was created.
  google.protobuf.Timestamp create_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the group's metadata last changed.
  google.protobuf.Timestamp update_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // High-water mark across the group's items. A client polling a large group
  // compares this to decide whether to re-read the items at all.
  google.protobuf.Timestamp items_update_time = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The IAM identity that created the group. Only the uid is stored; resolve it
  // through IAM to display a name.
  string created_by = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The IAM identity that submitted the group, if it has been submitted.
  string submitted_by = 13 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Metadata about the uploaded input. The content itself is not retained.
  InputMetadata input = 14 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Counts of items by build availability.
  AvailabilitySummary availability_summary = 15 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Counts of items by CVE-remediation status. Populated only when the group is
  // opted in.
  CVERemediationSummary cve_remediation_summary = 16 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether the organization pulls upstream artifacts through the Chainguard
  // Repository.
  //
  // Read-only, and reported on the envelope rather than per item, because it is
  // not part of any availability decision — see the comment on Availability. It
  // is here so a programmatic client with no console can phrase "available via
  // upstream fallback in the meantime" correctly, and omit it for an org that
  // turned upstream off.
  bool org_upstream_enabled = 17 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// RequestGroupItem is one requested package version within a group.
//
// The two status fields are orthogonal: a version can be BUILT and still have
// remediation in progress, or be blocked from building while its CVEs are clean.
// Read them independently.
message RequestGroupItem {
  option (google.api.resource) = {
    type: "libraries.chainguard.dev/RequestGroupItem"
    pattern: "requestGroups/{request_group}/items/{item}"
    singular: "requestGroupItem"
    plural: "requestGroupItems"
  };

  // The item's unique identifier.
  string uid = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The raw requirement line as supplied by the customer, retained so an
  // unparseable line can be shown back to them for correction.
  string requirement = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Canonical package name: the PEP 503 name for Python, "group:artifact" for
  // Java. Empty when the requirement could not be parsed.
  string package_name = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The pinned version requested. Empty when the requirement could not be parsed.
  string version = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The ecosystem this item belongs to.
  Ecosystem ecosystem = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Build availability of this version.
  Availability availability = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Human-readable reason accompanying availability, passed through verbatim from
  // the exclusion or block that produced it. Empty when there is nothing to say.
  string availability_reason = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // A newer built version to move to, when one exists and this version is
  // requestable.
  Upgrade upgrade = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // CVE-remediation status of this version. Populated only when the group is
  // opted in.
  CVERemediation cve_remediation = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether the customer removed this item from the draft.
  bool removed = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When this item's status last changed. Compare against a previous
  // ListRequestGroupItems call's min_update_time cursor.
  google.protobuf.Timestamp update_time = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Upgrade names newer built versions of the same package.
//
// Ordering is ecosystem-aware — PEP 440 for Python, Maven's own ordering for Java
// — because lexical ordering places 2.10 below 2.9 and would suggest a downgrade.
// Neither ecosystem guarantees semver, so no claim is made that an upgrade is
// compatible; only that it is newer and built.
message Upgrade {
  // The smallest built version above the requested one: the minimal move.
  string closest_version = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The highest built version. Equal to closest_version when only one newer
  // version is built.
  string latest_version = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// CVERemediation is the remediation state of one requested version, aggregated
// across the CVEs found against it.
message CVERemediation {
  // Aggregate remediation status for this version.
  CVERemediationStatus status = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How many CVEs on this version are remediated. Meaningful regardless of the
  // aggregate status, since a version can be partly remediated.
  int32 remediated_count = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How many CVEs were found against this version.
  int32 cve_count = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // 4 held a repeated string of internal reviewer notes. Not recycled: a field
  // number is wire format, and a client generated from an earlier copy of this
  // file would decode a new field 4 as the old one.
  reserved 4;

  // The reviewer's decision, where a reviewer recorded one. UNSPECIFIED
  // otherwise, which is the common case: most rows are settled by automation and
  // carry no human judgement to report.
  //
  // Derived server-side from an internal triage vocabulary rather than passed
  // through, so triage can be renamed without breaking this contract.
  //
  // Lossy by construction: decisions are recorded per CVE and this field is per
  // version, so a version whose CVEs were decided differently collapses to one
  // value. NOT_AFFECTED is reported only when it holds for every CVE on the
  // version. Read the per-CVE detail for the answer on any single CVE.
  CVERemediationDecision decision = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// InputMetadata describes the uploaded input. The content is deliberately not
// retained; the hash exists to detect a re-upload of the same file.
message InputMetadata {
  // Original filename, when the client supplied one.
  string filename = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The format the input was parsed as.
  InputFormat format = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Hash of the input content, used for re-upload detection.
  string content_hash = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How many requirements the input yielded.
  int32 item_count = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// AvailabilitySummary counts a group's items by build availability, so a client
// can render the report header without paging every item.
message AvailabilitySummary {
  // Versions Chainguard has already built.
  int32 built = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Versions that are not built and can be requested.
  int32 can_be_requested = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Versions on the malware block list. Still requestable, build held.
  int32 blocked = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Versions that do not exist on the upstream registry.
  int32 not_found_upstream = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Versions Chainguard will not build for policy reasons.
  int32 wont_build = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Lines that could not be parsed as a pinned package and version.
  int32 invalid_requirement = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Versions with a build running.
  int32 building = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Versions whose build failed and will be retried.
  int32 build_failed = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Items the customer removed from the draft.
  int32 removed = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Items the customer must resolve before the group can be submitted: the sum
  // of not_found_upstream, wont_build and invalid_requirement. Blocked items are
  // deliberately NOT counted here — they stay requestable with the build held.
  int32 blocking_submit = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// CVERemediationSummary counts a group's items by CVE-remediation status.
message CVERemediationSummary {
  // Versions queued for review, or not yet resolvable to a version we hold.
  int32 scan_queued = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Versions cross-referenced with no High or Critical CVEs.
  int32 no_high_critical_cves = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Versions with CVEs identified but remediation not started.
  int32 reviewing = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Versions with remediation underway.
  int32 in_progress = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Versions where remediation finished.
  int32 complete = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Versions whose CVEs were all ruled out of scope.
  int32 wont_remediate = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Total CVEs remediated across the group.
  int32 remediated_count = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// CreateRequestGroupRequest creates a draft from a pinned input.
//
// Supply exactly one of content or items.
message CreateRequestGroupRequest {
  // The organization to create the group under.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];

  // Optional customer-supplied name. A name is generated when omitted.
  string name = 2 [(google.api.field_behavior) = OPTIONAL];

  // The raw input: a Python lockfile, or a newline-separated Java GAV list.
  string content = 3 [(google.api.field_behavior) = OPTIONAL];

  // Pre-parsed requirement lines, as an alternative to content.
  repeated string items = 4 [(google.api.field_behavior) = OPTIONAL];

  // How to parse content. Required when content is set.
  InputFormat format = 5 [(google.api.field_behavior) = OPTIONAL];

  // Original filename, recorded as metadata.
  string filename = 6 [(google.api.field_behavior) = OPTIONAL];

  // Resolution context for ecosystems that need it, such as python_version and
  // platform for Python. Empty for Java, where a GAV is already fully pinned.
  //
  // Part of the idempotency hash: the same lockfile resolved for a different
  // Python version is a different request, not a repeat of the first.
  map<string, string> ecosystem_context = 7 [(google.api.field_behavior) = OPTIONAL];

  // Request CVE remediation for this group. The decision can also be made at
  // submit, which is where it takes effect.
  bool for_cve_remediation = 8 [(google.api.field_behavior) = OPTIONAL];
}

// ListRequestGroupsRequest lists an organization's groups.
message ListRequestGroupsRequest {
  // The organization whose groups to list.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];

  // Draft or submitted. Defaults to submitted, which is what the dashboard shows.
  RequestGroupState state = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by processing status.
  RequestGroupStatus status = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by ecosystem.
  Ecosystem ecosystem = 4 [(google.api.field_behavior) = OPTIONAL];

  // Filter by how the group was created.
  RequestSource source = 5 [(google.api.field_behavior) = OPTIONAL];

