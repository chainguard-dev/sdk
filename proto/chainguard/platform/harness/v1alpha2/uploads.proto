syntax = "proto3";

package chainguard.platform.harness.v1alpha2;

import "annotations/auth.proto";
import "annotations/events.proto";
import "annotations/mcp.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

option go_package =
    "chainguard.dev/sdk/proto/chainguard/platform/harness/v1alpha2";
option java_multiple_files = true;
option java_outer_classname = "UploadsProto";
option java_package = "com.chainguard.platform.harness.v1alpha2";

// Uploads is the customer-facing intake for `chainctl harness upload`: a
// customer submits one repository's source as a sealed bundle, and an operator
// later starts a hunt over one or more of those uploads. Uploading starts
// nothing, and each hunt expects fresh uploads.
//
// The client seals the bundle under the organization's harness key
// (GetOrgPublicKey) before any of it is sent, so only ciphertext travels on
// this API. CreateUpload records the upload, WriteUpload carries the sealed
// bytes in parts, and CompleteUpload verifies the stored object. The server
// never holds plaintext and never holds the key that opens it.
service Uploads {
  // GetOrgPublicKey returns the public half of the organization's harness key,
  // "harness-org-<uidp>" from the harness keyring. The client wraps the fresh
  // per-upload key it seals the bundle with under it. The private half never
  // leaves Cloud KMS, and only the harness fetch service may call it.
  //
  // ArgosDocuments.GetOrgPublicKey answers from the Argos keyring. A submitter
  // sealing against it would put customer source under an Argos key, outside
  // the harness's break-glass boundary and its US-only residency.
  rpc GetOrgPublicKey(GetOrgPublicKeyRequest) returns (OrgPublicKey) {
    option (google.api.http) = {
      get: "/harness/v1alpha2/orgs/{parent_id=**}/publicKey"
    };
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_HARNESS_UPLOADS_CREATE]
      }
    };
    option (chainguard.annotations.mcp) = {
      description:
        "Get the public key an organization's harness upload bundles must be "
        "sealed under. Returns a public key only."
      read_only: true
      destructive: false
      idempotent: true
      open_world: false
    };
  }

  // CreateUpload records an upload under the organization and returns it with
  // the largest part WriteUpload accepts for it. The upload starts at
  // UPLOAD_STATUS_PENDING and reaches UPLOAD_STATUS_READY only once
  // CompleteUpload has verified the stored object.
  //
  // Every call records a new upload, even for an identical bundle.
  rpc CreateUpload(CreateUploadRequest) returns (CreateUploadResponse) {
    option (google.api.http) = {
      post: "/harness/v1alpha2/uploads/{parent_id=**}"
      body: "*"
    };
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_HARNESS_UPLOADS_CREATE]
      }
    };
    option (chainguard.annotations.events) = {
      type: "dev.chainguard.api.harness.uploads.created.v1"
      extensions: ["group"]
      audience: CUSTOMER
    };
    option (chainguard.annotations.mcp) = {
      description:
        "Record a harness upload of a source bundle under an organization. "
        "Does not submit any source itself and starts no hunt."
      read_only: false
      destructive: false
      idempotent: false
      open_world: false
    };
  }

  // WriteUpload stores one part of the sealed bundle and returns how much of
  // the bundle storage holds.
  //
  // Send parts in order, one at a time, while the upload is
  // UPLOAD_STATUS_PENDING. On an UPLOAD_STATUS_READY or UPLOAD_STATUS_REJECTED
  // upload, or once the upload's write window has passed, WriteUpload fails
  // with FAILED_PRECONDITION.
  //
  // A part must start at or before committed_size. Bytes before committed_size
  // are already stored, and are skipped without being compared. A part that
  // starts past committed_size fails with FAILED_PRECONDITION.
  //
  // A part fails with INVALID_ARGUMENT, whatever the upload's progress, if:
  //   - it is empty,
  //   - it is larger than CreateUploadResponse.max_part_size,
  //   - its offset is not a multiple of 256 KiB,
  //   - it ends before envelope_size and its size is not a multiple of 256 KiB,
  //   - or it extends past the envelope_size declared at CreateUpload.
  //
  // The last part ends exactly at envelope_size, and storing it finalizes the
  // object.
  //
  // Storage can keep less of a part than was sent, so committed_size can stop
  // short of the part's end. Continue from committed_size. Retrying a part
  // whose response was lost succeeds and returns the current committed_size.
  // The sealed bytes are randomized and cannot be produced again, so keep each
  // part until a response's committed_size covers it.
  rpc WriteUpload(WriteUploadRequest) returns (WriteUploadResponse) {
    option (google.api.http) = {
      post: "/harness/v1alpha2/uploads/{id=**}:writeUpload"
      body: "*"
    };
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_HARNESS_UPLOADS_CREATE]
      }
    };
    // An agent has no sealed bundle to send.
    option (chainguard.annotations.mcp) = {hidden: true};
  }

  // CompleteUpload closes an upload. The server compares the stored object's
  // size and CRC32C with the envelope_size declared at CreateUpload and the
  // envelope_crc32c passed here. On a match the upload moves to
  // UPLOAD_STATUS_READY, and on a mismatch it is rejected. This proves the
  // ciphertext arrived intact. It says nothing about the plaintext, which only
  // a hunt can check.
  //
  // While bytes are still missing it fails with FAILED_PRECONDITION and the
  // upload stays UPLOAD_STATUS_PENDING. Calling it on a closed upload returns
  // the upload unchanged.
  rpc CompleteUpload(CompleteUploadRequest) returns (Upload) {
    option (google.api.http) = {
      post: "/harness/v1alpha2/uploads/{id=**}:completeUpload"
      body: "*"
    };
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_HARNESS_UPLOADS_CREATE]
      }
    };
    option (chainguard.annotations.mcp) = {
      description:
        "Close a harness upload, checking the stored object's size and "
        "checksum against what was declared."
      read_only: false
      destructive: false
      idempotent: true
      open_world: false
    };
  }

  // GetUpload returns one upload's metadata.
  rpc GetUpload(GetUploadRequest) returns (Upload) {
    option (google.api.http) = {get: "/harness/v1alpha2/uploads/{id=**}"};
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_HARNESS_UPLOADS_LIST]
      }
    };
    option (chainguard.annotations.mcp) = {
      description:
        "Get a harness upload's status, rejection reason and manifest counts "
        "by its id."
      read_only: true
      destructive: false
      idempotent: true
      open_world: false
    };
  }

  // ListUploads lists an organization's uploads, newest first, one bounded page
  // at a time.
  rpc ListUploads(ListUploadsRequest) returns (ListUploadsResponse) {
    option (google.api.http) = {get: "/harness/v1alpha2/uploads"};
    option (chainguard.annotations.iam) = {
      enabled: {
        capabilities: [CAP_HARNESS_UPLOADS_LIST]
      }
    };
    option (chainguard.annotations.mcp) = {
      description:
        "List an organization's harness uploads, newest first, one bounded "
        "page at a time."
      read_only: true
      destructive: false
      idempotent: true
      open_world: false
    };
  }
}

// Upload is one repository's sealed source bundle and whether it arrived
// intact. It is metadata only: the bundle's contents, and the storage
// identifier the pipeline knows the upload by, are reached elsewhere. That
// identifier stays off this message because, placed beside an organization, it
// would create a second record of which customer an upload belongs to.
message Upload {
  // id is the upload's UIDP, a child of the submitting organization.
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // status is where the upload is in its lifecycle.
  UploadStatus status = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // rejection_reason says why the upload was refused, and is set only when
  // status is UPLOAD_STATUS_REJECTED.
  UploadRejectionReason rejection_reason = 3 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // envelope_size is the size in bytes of the sealed object, as declared at
  // CreateUpload and verified against storage at CompleteUpload.
  int64 envelope_size = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // bundle_size is the declared size in bytes of the plaintext bundle. The
  // front end records it as a claim; a hunt is what checks it.
  int64 bundle_size = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // bundle_sha256 is the declared sha256 of the plaintext bundle, as
  // "sha256:<64-hex>". Recorded as a claim and checked by a hunt over the
  // decrypted bytes.
  string bundle_sha256 = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // file_count is the number of regular files the bundle's manifest declares.
  // Zero until a hunt has opened the bundle.
  int64 file_count = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // content_bytes is the total content size of those files. Zero until a hunt
  // has opened the bundle.
  int64 content_bytes = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // dropped_entry_count is the number of candidate source entries omitted
  // during packaging because the bundle format could not represent them.
  // Zero until a hunt has opened the bundle.
  int64 dropped_entry_count = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // create_time is when the upload was recorded.
  google.protobuf.Timestamp create_time = 10 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // update_time is when the upload last changed status.
  google.protobuf.Timestamp update_time = 11 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // next id: 12
}

// GetOrgPublicKeyRequest names the organization whose harness key to return.
message GetOrgPublicKeyRequest {
  // parent_id is the UIDP of the organization whose public key is requested,
  // and the IAM scope.
  string parent_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];
}

// OrgPublicKey is the public half of an organization's harness key.
message OrgPublicKey {
  // pem is the PEM-encoded SubjectPublicKeyInfo of the org's RSA-OAEP-3072
  // harness key. Wrap the fresh per-upload AES-256 key under it and carry the
  // wrapped key in the envelope alongside the ciphertext.
  string pem = 1;

  // algorithm names the RSA-OAEP algorithm to wrap with (for example
  // "RSA_DECRYPT_OAEP_3072_SHA256"), spelled as the Cloud KMS
  // CryptoKeyVersionAlgorithm enum spells it.
  string algorithm = 2;

  // key_version is the integer Cloud KMS CryptoKeyVersion pem belongs to. The
  // client echoes it in the envelope so a reader running after a rotation knows
  // which version's private half to decrypt against.
  string key_version = 3;
}

// CreateUploadRequest declares what the client is about to upload.
message CreateUploadRequest {
  // parent_id is the UIDP of the organization to record the upload under. It
  // is authorized against the caller and is never derived from identity.
  string parent_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];

  // envelope_size is the exact size in bytes of the sealed object the client
  // will upload. The envelope's framing is fixed, so the client knows it before
  // it starts sealing. WriteUpload refuses bytes past it.
  int64 envelope_size = 2 [(google.api.field_behavior) = REQUIRED];

  // bundle_size is the size in bytes of the plaintext bundle.
  int64 bundle_size = 3 [(google.api.field_behavior) = REQUIRED];

  // bundle_sha256 is the sha256 of the plaintext bundle, as
  // "sha256:<64-hex>". The server never sees the plaintext, so it cannot
  // verify it, and records it as a claim for a hunt to check after decryption.
  string bundle_sha256 = 4 [(google.api.field_behavior) = REQUIRED];
}

// CreateUploadResponse is the recorded upload and how to send its bundle.
message CreateUploadResponse {
  // upload is the recorded upload.
  Upload upload = 1;

  // max_part_size is the largest part, in bytes, WriteUpload accepts for this
  // upload. It is a multiple of 256 KiB and stays fixed for the upload's
  // lifetime.
  int64 max_part_size = 2;
}

// WriteUploadRequest carries one part of an upload's sealed bundle.
message WriteUploadRequest {
  // parent_id is the UIDP of the organization the upload belongs to. It is the
  // IAM scope, and id must fall within its subtree.
  string parent_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];

  // id is the upload's UIDP, CreateUploadResponse.upload.id.
  string id = 2 [(google.api.field_behavior) = REQUIRED];

  // offset is the position in the sealed bundle of data's first byte. It is a
  // multiple of 256 KiB. The first part starts at 0, which is also what an
  // omitted offset means.
  int64 offset = 3 [(google.api.field_behavior) = OPTIONAL];

  // data is the part's sealed bytes. WriteUpload states the size rules.
  bytes data = 4 [(google.api.field_behavior) = REQUIRED];
}

// WriteUploadResponse reports how much of the sealed bundle storage holds.
message WriteUploadResponse {
  // committed_size is the number of bytes storage holds from the start of the
  // sealed bundle. It is a multiple of 256 KiB until the last part is stored.
  // The next part starts at or before it.
  int64 committed_size = 1;
}

// CompleteUploadRequest closes an upload.
message CompleteUploadRequest {
  // parent_id is the UIDP of the organization the upload belongs to. It is the
  // IAM scope, and id must fall within its subtree.
  string parent_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];

  // id is the upload's UIDP, CreateUploadResponse.upload.id.
  string id = 2 [(google.api.field_behavior) = REQUIRED];

  // envelope_crc32c is the CRC32C the client computed over the sealed bytes as
  // it wrote them, an unsigned 32-bit value. The client seals while it uploads
  // and the ciphertext is randomized, so the checksum is known only at the end.
  // The server compares it with the CRC32C storage computed for the stored
  // object.
  int64 envelope_crc32c = 3 [(google.api.field_behavior) = REQUIRED];
}

// GetUploadRequest names one upload to read.
message GetUploadRequest {
  // parent_id is the UIDP of the organization the upload belongs to. It is the
  // IAM scope, and id must fall within its subtree.
  string parent_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];

  // id is the upload's UIDP.
  string id = 2 [(google.api.field_behavior) = REQUIRED];
}

// ListUploadsRequest names the organization whose uploads to list, and narrows
// and pages the result.
message ListUploadsRequest {
  // parent_id is the UIDP of the organization whose uploads to list, and the
  // IAM scope. One organization is required; there is no cross-org listing.
  string parent_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (chainguard.annotations.iam_scope) = true
  ];

  // status optionally narrows results to one lifecycle status.
  UploadStatus status = 2 [(google.api.field_behavior) = OPTIONAL];

  // page_size is the maximum number of uploads to return per page. It is
  // bounded server-side: omitting it applies a default and any value is
  // capped, so a list is always paginated.
  int32 page_size = 3 [(google.api.field_behavior) = OPTIONAL];

  // page_token is a token from a previous response's next_page_token. Omit to
  // start from the first page.
  string page_token = 4 [(google.api.field_behavior) = OPTIONAL];
}

// ListUploadsResponse is one page of uploads.
message ListUploadsResponse {
  // items are the uploads on this page, newest first.
  repeated Upload items = 1;

  // next_page_token is the token for the next page, empty when there are no
  // more.
  string next_page_token = 2;
}

// UploadStatus is where an upload is in its lifecycle. An upload ends at
// UPLOAD_STATUS_READY or UPLOAD_STATUS_REJECTED.
enum UploadStatus {
  // Not set.
  UPLOAD_STATUS_UNSPECIFIED = 0;
  // The upload is recorded and accepts WriteUpload, but CompleteUpload has not
  // verified a stored bundle. An upload left here is reclaimed.
  UPLOAD_STATUS_PENDING = 1;
  // The sealed bundle is stored and its size and checksum matched. A hunt can
  // be started over it.
  UPLOAD_STATUS_READY = 2;
  // The upload was refused; see rejection_reason.
  UPLOAD_STATUS_REJECTED = 3;
}

// UploadRejectionReason says why an upload was refused. Every value is a
// stable identifier: a reason never carries a path, an excerpt or any other
// content taken from the submitted source.
enum UploadRejectionReason {
  // Not set; the upload was not rejected.
  UPLOAD_REJECTION_REASON_UNSPECIFIED = 0;
  // The bundle exceeds the size the intake accepts.
  UPLOAD_REJECTION_REASON_BUNDLE_TOO_LARGE = 1;
  // An entry's path is absolute, escapes the bundle root, or is otherwise
  // unusable.
  UPLOAD_REJECTION_REASON_PATH_INVALID = 2;
  // An entry is neither a file, a directory nor a symlink.
  UPLOAD_REJECTION_REASON_ENTRY_TYPE_FORBIDDEN = 3;
  // The bundle decompresses to more than its permitted ratio.
  UPLOAD_REJECTION_REASON_RATIO_EXCEEDED = 4;
  // The decrypted bundle does not hash to the declared bundle_sha256, or its
  // tree hash disagrees with its manifest.
  UPLOAD_REJECTION_REASON_BUNDLE_DIGEST_MISMATCH = 5;
  // The manifest disagrees with the entries it describes.
  UPLOAD_REJECTION_REASON_MANIFEST_MISMATCH = 6;
  // The bundle is not in a format this intake understands.
  UPLOAD_REJECTION_REASON_FORMAT_UNSUPPORTED = 7;
  // The stored object's size or CRC32C did not match what CompleteUpload
  // declared.
  UPLOAD_REJECTION_REASON_UPLOAD_MISMATCH = 8;
  // The bundle declares no source entries. There is no source to hunt through,
  // so the validator refuses it rather than accepting an empty submission.
  UPLOAD_REJECTION_REASON_BUNDLE_EMPTY = 9;
}
